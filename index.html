<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#050a18" />
<title>机甲大战怪兽 · MECHA VS MONSTERS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#050a18;overflow:hidden;font-family:'Courier New',monospace;color:#fff;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #game{display:block;image-rendering:pixelated;background:#000;}
  /* 扫描线 */
  #scan{position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.12) 0px,rgba(0,0,0,0.12) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply;}
  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:8px 96px 8px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:1px 1px 0 #000;gap:6px;flex-wrap:nowrap;}
  .hud-cell{background:rgba(0,20,40,0.6);border:1px solid #0af;padding:4px 10px;font-weight:bold;font-size:clamp(11px,2.8vw,15px);border-radius:3px;letter-spacing:1px;color:#0df;}
  .hud-cell b{color:#fff;}
  #hpBar{display:flex;gap:3px;align-items:center;}
  .hp{width:clamp(10px,2.6vw,16px);height:clamp(10px,2.6vw,16px);background:#ff3050;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);box-shadow:0 0 6px #ff3050;}
  .hp.empty{background:#331020;box-shadow:none;}
  /* 触控 */
  #touchArea{position:fixed;inset:0;z-index:15;display:none;}
  /* 覆盖层 */
  .ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(5,10,30,0.92),rgba(2,4,12,0.98));text-align:center;padding:20px;}
  .ov.hidden{display:none;}
  .title{font-size:clamp(30px,9vw,64px);font-weight:900;color:#00e5ff;
    text-shadow:0 0 20px #00e5ff,0 0 40px #0088ff,3px 3px 0 #003;letter-spacing:0.08em;margin-bottom:4px;}
  .subtitle{font-size:clamp(11px,3.2vw,20px);color:#88ccff;letter-spacing:0.4em;margin-bottom:32px;}
  .btn{padding:12px 40px;font-size:clamp(15px,4vw,20px);font-weight:bold;color:#001;cursor:pointer;
    background:linear-gradient(180deg,#00e5ff,#0099cc);border:2px solid #0ff;border-radius:4px;letter-spacing:2px;
    box-shadow:0 0 18px rgba(0,229,255,0.5),0 4px 0 #003;margin:6px;}
  .btn:active{transform:translateY(3px);box-shadow:0 0 12px rgba(0,229,255,0.4),0 1px 0 #003;}
  .btn.ghost{background:transparent;color:#00e5ff;box-shadow:none;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;width:100%;}
  .lv{padding:14px 8px;border:2px solid #0af;border-radius:6px;background:rgba(0,30,60,0.4);cursor:pointer;transition:.15s;}
  .lv:hover{background:rgba(0,60,120,0.6);box-shadow:0 0 14px rgba(0,170,255,0.4);}
  .lv .num{font-size:clamp(22px,7vw,36px);font-weight:900;color:#0df;}
  .lv .nm{font-size:clamp(11px,3vw,14px);color:#aaf;margin-top:2px;}
  .lv .best{font-size:10px;color:#6f8;margin-top:3px;}
  .lv.locked{opacity:0.4;border-color:#555;cursor:not-allowed;}
  .lv.locked .num{color:#888;}
  .ov-stat{font-size:clamp(13px,3.5vw,18px);color:#aaf;margin:5px 0;}
  .ov-stat b{color:#ffd23f;font-size:1.2em;}
  .rank{font-size:clamp(42px,12vw,80px);color:#ffd23f;text-shadow:0 0 20px #ff8800,4px 4px 0 #000;margin:6px 0;}
  .hint{font-size:11px;color:#668;margin-top:18px;line-height:1.7;}
  /* Boss 预告 (荒野大镖客风格) */
  #ovBossIntro{background:radial-gradient(ellipse at center,rgba(40,0,0,0.94),rgba(10,0,0,0.99));}
  .boss-intro{animation:bossShake 0.5s ease-out;max-width:90%;}
  .boss-warn{font-size:clamp(18px,6vw,34px);font-weight:900;color:#ff3030;letter-spacing:0.4em;
    text-shadow:0 0 16px #ff0000,0 0 32px #aa0000,2px 2px 0 #000;animation:bossFlicker 1.2s infinite;}
  .boss-lv{font-size:clamp(12px,3.5vw,18px);color:#ffaaaa;letter-spacing:0.2em;margin:10px 0 4px;}
  .boss-name{font-size:clamp(34px,11vw,72px);font-weight:900;color:#fff;letter-spacing:0.1em;
    text-shadow:0 0 24px #ff2222,0 0 48px #ff0000,4px 4px 0 #500;margin:6px 0;}
  .boss-desc{font-size:clamp(13px,4vw,18px);color:#ffccaa;max-width:420px;line-height:1.6;margin:8px auto 12px;}
  .boss-hp{font-size:clamp(14px,4vw,18px);color:#ffd23f;margin-bottom:18px;}
  .boss-hp span{font-size:1.3em;font-weight:900;color:#ff5050;}
  .boss-hint{font-size:11px;color:#a86;margin-top:14px;opacity:0.8;}
  .boss-avatar{width:clamp(120px,38vw,180px);height:auto;margin:8px 0;
    filter:drop-shadow(0 0 12px rgba(255,60,60,0.6));border-radius:8px;}
  @keyframes bossShake{0%{transform:scale(0.6);opacity:0;}60%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  @keyframes bossFlicker{0%,100%{opacity:1;}45%{opacity:1;}50%{opacity:0.4;}55%{opacity:1;}}
  /* Boss血条 */
  #bossBar{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:21;width:70%;max-width:360px;display:none;}
  #bossBar.show{display:block;}
  #bossBar .name{text-align:center;color:#ff5;font-size:12px;letter-spacing:2px;margin-bottom:3px;text-shadow:1px 1px 0 #000;}
  #bossBar .track{height:8px;background:#200;border:1px solid #f50;border-radius:4px;overflow:hidden;}
  #bossBar .fill{height:100%;background:linear-gradient(90deg,#ff3030,#ff8800);transition:width .2s;box-shadow:0 0 8px #f50;}
  /* 暂停按钮 */
  #pauseBtn{position:fixed;top:60px;right:8px;z-index:25;width:32px;height:32px;border-radius:50%;
    background:rgba(0,20,40,0.7);border:1px solid #0af;color:#0af;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #bgmBtn{position:fixed;top:60px;right:46px;z-index:25;width:32px;height:32px;border-radius:50%;
    background:rgba(0,20,40,0.7);border:1px solid #0af;color:#0af;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #bgmBtn.off{opacity:0.4;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="scan"></div>

<div id="hud">
  <div class="hud-cell">关卡 <b id="hLv">1</b></div>
  <div class="hud-cell">分数 <b id="hSc">0</b></div>
  <div id="hpBar"></div>
  <div class="hud-cell" id="weaponCell" style="display:none">武器 <b id="hWp">普通</b></div>
  <div class="hud-cell">怪兽 <b id="hMst">0</b></div>
</div>
<div id="bossBar"><div class="name" id="bossName">BOSS</div><div class="track"><div class="fill" id="bossFill" style="width:100%"></div></div></div>
<button id="pauseBtn">Ⅱ</button>
<button id="bgmBtn" title="背景音乐">♪</button>
<div id="touchArea"></div>

<!-- 标题 -->
<div class="ov" id="ovTitle">
  <div class="title">机甲大战怪兽</div>
  <div class="subtitle">MECHA VS MONSTERS</div>
  <button class="btn" id="btnStart">开始游戏</button>
  <button class="btn ghost" id="btnLevel">选择关卡</button>
  <div class="hint">桌面: 方向键/WASD 移动 · 空格 射击<br/>手机: 触摸拖动移动 · 自动射击</div>
</div>

<!-- 关卡选择 -->
<div class="ov hidden" id="ovLevel">
  <div class="title" style="font-size:clamp(24px,7vw,48px)">选择关卡</div>
  <div class="grid" id="lvGrid"></div>
  <button class="btn ghost" id="btnBack" style="margin-top:20px">返回</button>
</div>

<!-- 暂停 -->
<div class="ov hidden" id="ovPause">
  <div class="title" style="font-size:clamp(24px,7vw,48px)">暂停</div>
  <button class="btn" id="btnResume">继续</button>
  <button class="btn ghost" id="btnQuit">返回主菜单</button>
</div>

<!-- 结算 -->
<div class="ov hidden" id="ovOver">
  <div class="title" id="overTitle" style="font-size:clamp(26px,8vw,56px)">胜利!</div>
  <div class="rank" id="rank">S</div>
  <div class="ov-stat">关卡 <b id="ovLv">1</b> · 得分 <b id="ovSc">0</b></div>
  <div class="ov-stat">消灭怪兽 <b id="ovKill">0</b> · 命中率 <b id="ovHit">0%</b></div>
  <button class="btn" id="btnNext">下一关</button>
  <button class="btn ghost" id="btnRetry">重试</button>
  <button class="btn ghost" id="btnMenu">主菜单</button>
</div>

<!-- Boss 预告 (荒野大镖客风格) -->
<div class="ov hidden" id="ovBossIntro">
  <div class="boss-intro">
    <div class="boss-warn">⚠ 危 险 ⚠</div>
    <div class="boss-lv" id="bossIntroLv">第 1 关 · 太空</div>
    <canvas class="boss-avatar" id="bossAvatar" width="160" height="120"></canvas>
    <div class="boss-name" id="bossIntroName">虚空领主</div>
    <div class="boss-desc" id="bossIntroDesc">来自维度裂缝的异形母舰</div>
    <div class="boss-hp">生命值 <span id="bossIntroHP">80</span></div>
    <button class="btn" id="btnBossFight">开 始 战 斗</button>
    <div class="boss-hint">准备好后点击按钮，Boss 将正式登场</div>
  </div>
</div>

<script>
/* ============================================================
 * 机甲大战怪兽 — 单文件 Canvas 2D 飞机射击游戏
 * 模块化: CFG / LEVELS / MONSTERS / 玩家 / 子弹 / 粒子 / 碰撞 / 音频
 * ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const vv = () => window.visualViewport;
function resize() {
  W = vv() ? vv().width : innerWidth;
  H = vv() ? vv().height : innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ==================== 配置 ==================== */
const CFG = {
  playerSpeed: 380,
  fireInterval: 0.14,
  bulletSpeed: 720,
  maxHP: 6,
  invulnTime: 1.2,
  baseMonsterSpeed: 80,
  // 难度曲线: 每关递增, 速度倍率 & 射击间隔缩短
  difficulty: [1.0, 1.1, 1.2, 1.35, 1.5, 1.65, 1.85, 2.1],
};

/* ==================== 8 关卡定义 ==================== */
const LEVELS = [
  { name:'太空', bg:['#0a0e2a','#1a1a4a','#2a1a5a'], starColor:'#ffffff', particle:'star', ground:null,
    waves:[ {t:0,type:'octopus',n:5,pattern:'line'}, {t:8,type:'octopus',n:6,pattern:'v'}, {t:16,type:'scorpion',n:4,pattern:'line'}, {t:24,type:'octopus',n:8,pattern:'wave'} ], boss:'voidlord' },
  { name:'海洋', bg:['#001a33','#003355','#004466'], starColor:'#aaddff', particle:'bubble', ground:'ocean',
    waves:[ {t:0,type:'scorpion',n:5,pattern:'v'}, {t:8,type:'ufo',n:3,pattern:'line'}, {t:16,type:'octopus',n:8,pattern:'wave'}, {t:24,type:'scorpion',n:6,pattern:'line'} ], boss:'leviathan' },
  { name:'撒哈拉沙漠', bg:['#3a2010','#6a4020','#9a6030'], starColor:'#ffe0a0', particle:'sand', ground:'desert',
    waves:[ {t:0,type:'bug',n:6,pattern:'wave'}, {t:8,type:'scorpion',n:5,pattern:'v'}, {t:16,type:'bug',n:8,pattern:'line'}, {t:24,type:'turret',n:4,pattern:'line'} ], boss:'colossus' },
  { name:'火星', bg:['#3a0a0a','#5a1a0a','#7a2a1a'], starColor:'#ffaa88', particle:'ember', ground:'mars',
    waves:[ {t:0,type:'ufo',n:5,pattern:'line'}, {t:8,type:'bug',n:8,pattern:'wave'}, {t:16,type:'turret',n:4,pattern:'v'}, {t:22,type:'scorpion',n:6,pattern:'line'} ], boss:'dragon' },
  { name:'月球', bg:['#0a0a18','#1a1a2a','#2a2a3a'], starColor:'#ccccff', particle:'star', ground:'moon',
    waves:[ {t:0,type:'turret',n:5,pattern:'line'}, {t:8,type:'ufo',n:4,pattern:'v'}, {t:16,type:'bug',n:10,pattern:'wave'}, {t:24,type:'bomber',n:2,pattern:'line'} ], boss:'guardian' },
  { name:'非洲大草原', bg:['#1a2a0a','#2a4a1a','#3a6a2a'], starColor:'#aaff88', particle:'leaf', ground:'savanna',
    waves:[ {t:0,type:'scorpion',n:6,pattern:'v'}, {t:8,type:'octopus',n:8,pattern:'wave'}, {t:16,type:'bomber',n:3,pattern:'line'}, {t:24,type:'turret',n:5,pattern:'v'} ], boss:'beastking' },
  { name:'热带雨林', bg:['#0a2a1a','#1a4a2a','#2a6a3a'], starColor:'#88ffaa', particle:'rain', ground:'jungle',
    waves:[ {t:0,type:'bug',n:8,pattern:'wave'}, {t:8,type:'ufo',n:5,pattern:'line'}, {t:16,type:'scorpion',n:8,pattern:'v'}, {t:24,type:'bomber',n:3,pattern:'line'} ], boss:'vinetitan' },
  { name:'海王星', bg:['#0a1a3a','#1a3a6a','#2a5aaa'], starColor:'#aaccff', particle:'snow', ground:'neptune',
    waves:[ {t:0,type:'turret',n:6,pattern:'line'}, {t:8,type:'bomber',n:3,pattern:'v'}, {t:16,type:'bug',n:12,pattern:'wave'}, {t:24,type:'ufo',n:6,pattern:'line'} ], boss:'kraken' },
];

/* ==================== 怪兽类型 ==================== */
// 每种怪兽: hp, score, speed, size, shoot?, draw(ctx, m, t)
const MONSTER_TYPES = {
  octopus: { hp:1, score:100, speed:1.0, size:1.0, shoot:false },
  scorpion:{ hp:2, score:200, speed:0.9, size:1.1, shoot:true, shootInterval:1.8 },
  ufo:     { hp:2, score:250, speed:0.6, size:1.2, shoot:true, shootInterval:1.4 },
  bug:     { hp:1, score:150, speed:1.6, size:0.8, shoot:false },
  turret:  { hp:3, score:300, speed:0.3, size:1.3, shoot:true, shootInterval:1.2 },
  bomber:  { hp:6, score:500, speed:0.5, size:2.0, shoot:true, shootInterval:1.0 },
};

const BOSS_TYPES = {
  voidlord:  { hp:80,  score:6000,  size:5.0, name:'虚空领主',   desc:'来自维度裂缝的异形母舰，以螺旋弹幕撕裂星空' },
  leviathan: { hp:95,  score:7000,  size:5.0, name:'深海利维坦', desc:'沉睡万年的远古海蛇，一口水柱可击穿钢甲' },
  colossus:  { hp:110, score:8000,  size:5.5, name:'沙暴巨像',   desc:'由沙岩与怨念凝聚而成的巨人，尾刺淬有剧毒' },
  dragon:    { hp:125, score:9000,  size:5.0, name:'机械巨龙',   desc:'火星兵工厂的终极造物，龙息焚尽一切' },
  guardian:  { hp:140, score:10000, size:5.0, name:'月面守护者', desc:'月球背面苏醒的古代机甲，红眼锁定即死' },
  beastking: { hp:155, score:11000, size:5.5, name:'百兽之王',   desc:'草原霸主，獠牙与利爪之下无人生还' },
  vinetitan: { hp:170, score:12000, size:5.5, name:'藤蔓巨怪',   desc:'雨林深处的食人植物，种子炸弹遍地开花' },
  kraken:    { hp:190, score:15000, size:6.0, name:'深渊海妖',   desc:'海王星深渊的终极恐惧，八条触须粉碎舰队' },
};

/* ==================== 工具 ==================== */
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

/* ==================== 存档 (localStorage) ==================== */
const SAVE_KEY = 'mecha_vs_monsters_save_v1';
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { unlocked: 1, bestScores: {} }; // 默认解锁第 1 关
}
function saveSave(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e) {}
}
let save = loadSave();
function unlockLevel(idx) {
  if (idx + 1 > save.unlocked) { save.unlocked = idx + 1; saveSave(save); }
}
function recordBest(idx, score) {
  if (!save.bestScores[idx] || score > save.bestScores[idx]) {
    save.bestScores[idx] = score;
    saveSave(save);
  }
}

/* ==================== 游戏状态 ==================== */
let game = {
  state: 'title', // title/level/playing/pause/over
  level: 0,
  score: 0,
  kills: 0,
  shots: 0,
  hits: 0,
  time: 0,
  waveIdx: 0,
  monsters: [],
  bullets: [],
  enemyBullets: [],
  particles: [],
  stars: [],
  boss: null,
  bossActive: false,
  bossPending: false, // Boss预告已触发，等待玩家确认
  trickleTimer: 0, // 连续刷怪计时器
  shake: 0,
  overWin: false,
  powerups: [], // 奖励宝盒
};

let player = {
  x: 0, y: 0,
  hp: CFG.maxHP,
  invuln: 0,
  fireCD: 0,
  tilt: 0,
  engineT: 0,
  weapon: 'normal', // normal / laser / shotgun / rocket
  weaponTime: 0, // 武器持续时间
};

let input = { left:false, right:false, up:false, down:false, shoot:false };

/* ==================== 输入 ==================== */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowleft'||k==='a') input.left=true;
  if (k==='arrowright'||k==='d') input.right=true;
  if (k==='arrowup'||k==='w') input.up=true;
  if (k==='arrowdown'||k==='s') input.down=true;
  if (k===' '||k==='j') input.shoot=true;
  if (k==='escape') togglePause();
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowleft'||k==='a') input.left=false;
  if (k==='arrowright'||k==='d') input.right=false;
  if (k==='arrowup'||k==='w') input.up=false;
  if (k==='arrowdown'||k==='s') input.down=false;
  if (k===' '||k==='j') input.shoot=false;
});

// 触摸拖动
const ta = document.getElementById('touchArea');
let touchActive = false, touchId = null;
ta.addEventListener('pointerdown', e => {
  if (game.state !== 'playing') return;
  touchActive = true; touchId = e.pointerId;
  input.shoot = true; // 触摸时自动射击
  movePlayerTo(e.clientX, e.clientY);
  e.preventDefault();
}, {passive:false});
ta.addEventListener('pointermove', e => {
  if (touchActive && e.pointerId === touchId) movePlayerTo(e.clientX, e.clientY);
}, {passive:false});
ta.addEventListener('pointerup', e => {
  if (e.pointerId === touchId) { touchActive = false; touchId = null; input.shoot = false; }
});
function movePlayerTo(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  player.x = clamp(cx - rect.left, 30, W - 30);
  player.y = clamp(cy - rect.top, H * 0.3, H - 50);
}
document.getElementById('touchArea').style.display = 'block';

/* ==================== 星空/粒子背景 ==================== */
function initStars(level) {
  const lv = LEVELS[level];
  game.stars = [];
  for (let i = 0; i < 80; i++) {
    game.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: rand(0.5, 2.5),
      speed: rand(20, 80),
      color: lv.starColor,
      alpha: rand(0.3, 1),
    });
  }
}

/* ==================== 怪兽生成 ==================== */
function spawnWave(wave) {
  const lv = LEVELS[game.level];
  const cfg = MONSTER_TYPES[wave.type];
  const diff = CFG.difficulty[game.level] || 1;
  const n = wave.n;
  const startY = -50;
  // 根据屏幕宽度自适应间距，确保所有怪兽都在屏幕内
  const maxSpread = W - 80; // 左右各留 40 边距
  const spacing = Math.min(60, maxSpread / Math.max(n - 1, 1));

  for (let i = 0; i < n; i++) {
    let x, y, vx = 0, vy = cfg.speed * CFG.baseMonsterSpeed * diff;
    const offset = (i - (n - 1) / 2) * spacing;
    if (wave.pattern === 'line') {
      x = W / 2 + offset;
      y = startY - i * 30;
    } else if (wave.pattern === 'v') {
      const half = (n - 1) / 2;
      x = W / 2 + offset;
      y = startY - Math.abs(i - half) * 40;
    } else { // wave
      x = W / 2 + offset;
      y = startY - i * 20;
      vx = (i % 2 === 0 ? 1 : -1) * 40 * diff;
    }
    // 确保生成位置在屏幕内
    x = clamp(x, 40, W - 40);
    const shootInt = cfg.shoot ? cfg.shootInterval / diff : 0;
    game.monsters.push({
      type: wave.type, x, y, vx, vy,
      hp: cfg.hp, maxHp: cfg.hp,
      size: cfg.size, score: cfg.score,
      shootCD: cfg.shoot ? rand(0.5, shootInt) : 0,
      shootInterval: shootInt,
      t: Math.random() * Math.PI * 2,
      pattern: wave.pattern,
      phase: 'enter',
    });
  }
}

function spawnBoss(type) {
  const cfg = BOSS_TYPES[type];
  game.boss = {
    type, x: W / 2, y: -150,
    hp: cfg.hp, maxHp: cfg.hp,
    size: cfg.size, score: cfg.score, name: cfg.name,
    t: 0, shootCD: 1.5, phase: 'enter',
    atkPhase: 0, atkTimer: 0, charging: false, chargeX: 0, chargeY: 0,
  };
  game.bossActive = true;
  document.getElementById('bossName').textContent = cfg.name;
  document.getElementById('bossBar').classList.add('show');
}

// 在预告画布上绘制 Boss 头像（独立简化绘制，不依赖 drawBoss，确保稳定显示）
function drawBossAvatar(type) {
  try {
    const cv = document.getElementById('bossAvatar');
    if (!cv) return;
    const av = cv.getContext('2d');
    av.clearRect(0, 0, cv.width, cv.height);
    const cx = cv.width / 2, cy = cv.height / 2;

    // 背景圆
    av.fillStyle = 'rgba(0,0,0,0.45)';
    av.beginPath(); av.arc(cx, cy, 56, 0, Math.PI*2); av.fill();
    av.strokeStyle = '#ff4444'; av.lineWidth = 2.5;
    av.beginPath(); av.arc(cx, cy, 56, 0, Math.PI*2); av.stroke();

    // 裁剪到圆内，避免图形溢出
    av.save();
    av.beginPath(); av.arc(cx, cy, 54, 0, Math.PI*2); av.clip();

    if (type === 'voidlord') {
      // 虚空领主: 紫色菱形母舰 + 脉冲核心
      av.fillStyle = '#3a1a6a';
      av.beginPath();
      av.moveTo(cx, cy-36); av.lineTo(cx+30, cy); av.lineTo(cx+18, cy+30);
      av.lineTo(cx-18, cy+30); av.lineTo(cx-30, cy);
      av.closePath(); av.fill();
      av.strokeStyle = '#9a6aff'; av.lineWidth = 2; av.stroke();
      // 核心
      av.fillStyle = '#cc66ff';
      av.shadowColor = '#aa44ff'; av.shadowBlur = 14;
      av.beginPath(); av.arc(cx, cy-4, 9, 0, Math.PI*2); av.fill();
      av.shadowBlur = 0;
      av.fillStyle = '#fff';
      av.beginPath(); av.arc(cx, cy-4, 3.5, 0, Math.PI*2); av.fill();

    } else if (type === 'leviathan') {
      // 深海利维坦: 蛇头 + 巨口 + 黄眼
      av.fillStyle = '#115577';
      av.beginPath(); av.ellipse(cx, cy+4, 28, 22, 0, 0, Math.PI*2); av.fill();
      av.strokeStyle = '#33aacc'; av.lineWidth = 2; av.stroke();
      // 巨口
      av.fillStyle = '#082233';
      av.beginPath(); av.ellipse(cx, cy+14, 18, 8, 0, 0, Math.PI*2); av.fill();
      // 獠牙
      av.fillStyle = '#fff';
      for (let i=-2;i<=2;i++){
        av.beginPath();
        av.moveTo(cx+i*6, cy+10); av.lineTo(cx+i*6-2, cy+16); av.lineTo(cx+i*6+2, cy+16);
        av.closePath(); av.fill();
      }
      // 黄眼
      av.fillStyle = '#ffcc00';
      av.shadowColor = '#ffaa00'; av.shadowBlur = 8;
      av.beginPath(); av.arc(cx-10, cy-6, 5, 0, Math.PI*2); av.fill();
      av.beginPath(); av.arc(cx+10, cy-6, 5, 0, Math.PI*2); av.fill();
      av.shadowBlur = 0;

    } else if (type === 'colossus') {
      // 沙暴巨像: 沙岩巨人头 + 橙眼
      av.fillStyle = '#8a6a3a';
      av.fillRect(cx-24, cy-28, 48, 56);
      av.strokeStyle = '#ccaa66'; av.lineWidth = 2;
      av.strokeRect(cx-24, cy-28, 48, 56);
      // 裂纹
      av.strokeStyle = 'rgba(60,40,20,0.6)'; av.lineWidth = 1.5;
      av.beginPath(); av.moveTo(cx-10, cy-28); av.lineTo(cx-4, cy); av.lineTo(cx-14, cy+28); av.stroke();
      // 橙眼
      av.fillStyle = '#ff7700';
      av.shadowColor = '#ff5500'; av.shadowBlur = 10;
      av.fillRect(cx-18, cy-12, 10, 6);
      av.fillRect(cx+8, cy-12, 10, 6);
      av.shadowBlur = 0;
      // 嘴
      av.fillStyle = '#3a2a1a';
      av.fillRect(cx-12, cy+8, 24, 6);

    } else if (type === 'dragon') {
      // 机械巨龙: 龙头 + 红眼 + 角
      av.fillStyle = '#553322';
      av.beginPath();
      av.moveTo(cx, cy-30); av.lineTo(cx+22, cy-10); av.lineTo(cx+18, cy+18);
      av.lineTo(cx-18, cy+18); av.lineTo(cx-22, cy-10);
      av.closePath(); av.fill();
      av.strokeStyle = '#aa6633'; av.lineWidth = 2; av.stroke();
      // 角
      av.fillStyle = '#886644';
      av.beginPath(); av.moveTo(cx-14, cy-24); av.lineTo(cx-22, cy-38); av.lineTo(cx-8, cy-28); av.fill();
      av.beginPath(); av.moveTo(cx+14, cy-24); av.lineTo(cx+22, cy-38); av.lineTo(cx+8, cy-28); av.fill();
      // 红眼
      av.fillStyle = '#ff2200';
      av.shadowColor = '#ff0000'; av.shadowBlur = 10;
      av.beginPath(); av.arc(cx-8, cy-4, 4, 0, Math.PI*2); av.fill();
      av.beginPath(); av.arc(cx+8, cy-4, 4, 0, Math.PI*2); av.fill();
      av.shadowBlur = 0;
      // 鼻孔喷火
      av.fillStyle = '#ffaa00';
      av.beginPath(); av.arc(cx-4, cy+12, 3, 0, Math.PI*2); av.fill();
      av.beginPath(); av.arc(cx+4, cy+12, 3, 0, Math.PI*2); av.fill();

    } else if (type === 'guardian') {
      // 月面守护者: 机甲 + 单红眼
      av.fillStyle = '#667788';
      av.beginPath();
      av.moveTo(cx, cy-32); av.lineTo(cx+26, cy-16); av.lineTo(cx+26, cy+16);
      av.lineTo(cx, cy+28); av.lineTo(cx-26, cy+16); av.lineTo(cx-26, cy-16);
      av.closePath(); av.fill();
      av.strokeStyle = '#aabbcc'; av.lineWidth = 2; av.stroke();
      // 装甲板
      av.strokeStyle = 'rgba(255,255,255,0.3)'; av.lineWidth = 1;
      av.beginPath(); av.moveTo(cx, cy-32); av.lineTo(cx, cy+28); av.stroke();
      // 单红眼
      av.fillStyle = '#ff0000';
      av.shadowColor = '#ff0000'; av.shadowBlur = 14;
      av.beginPath(); av.arc(cx, cy, 9, 0, Math.PI*2); av.fill();
      av.shadowBlur = 0;
      av.fillStyle = '#fff';
      av.beginPath(); av.arc(cx, cy, 3, 0, Math.PI*2); av.fill();

    } else if (type === 'beastking') {
      // 百兽之王: 狮王头 + 鬃毛 + 獠牙
      // 鬃毛
      av.fillStyle = '#7a4a1a';
      for (let a=0; a<12; a++) {
        const ang = (a/12)*Math.PI*2;
        av.beginPath();
        av.arc(cx+Math.cos(ang)*26, cy+Math.sin(ang)*26, 9, 0, Math.PI*2); av.fill();
      }
      // 脸
      av.fillStyle = '#cc8833';
      av.beginPath(); av.arc(cx, cy, 22, 0, Math.PI*2); av.fill();
      av.strokeStyle = '#885522'; av.lineWidth = 2; av.stroke();
      // 眼
      av.fillStyle = '#ffee00';
      av.shadowColor = '#ffaa00'; av.shadowBlur = 8;
      av.beginPath(); av.arc(cx-8, cy-5, 3.5, 0, Math.PI*2); av.fill();
      av.beginPath(); av.arc(cx+8, cy-5, 3.5, 0, Math.PI*2); av.fill();
      av.shadowBlur = 0;
      // 鼻
      av.fillStyle = '#553311';
      av.beginPath(); av.arc(cx, cy+4, 3, 0, Math.PI*2); av.fill();
      // 獠牙
      av.fillStyle = '#fff';
      av.beginPath(); av.moveTo(cx-5, cy+10); av.lineTo(cx-7, cy+18); av.lineTo(cx-3, cy+10); av.fill();
      av.beginPath(); av.moveTo(cx+5, cy+10); av.lineTo(cx+7, cy+18); av.lineTo(cx+3, cy+10); av.fill();

    } else if (type === 'vinetitan') {
      // 藤蔓巨怪: 植物怪 + 藤蔓触手 + 花芯眼
      // 藤蔓触手
      av.strokeStyle = '#337722'; av.lineWidth = 6; av.lineCap = 'round';
      for (let i=0;i<5;i++){
        const ang = -Math.PI/2 + (i-2)*0.4;
        av.beginPath();
        av.moveTo(cx, cy);
        av.quadraticCurveTo(cx+Math.cos(ang)*30, cy+Math.sin(ang)*30,
                            cx+Math.cos(ang)*44, cy+Math.sin(ang)*44+10);
        av.stroke();
      }
      // 主体(南瓜形)
      av.fillStyle = '#664411';
      av.beginPath(); av.ellipse(cx, cy+2, 28, 24, 0, 0, Math.PI*2); av.fill();
      av.strokeStyle = '#886622'; av.lineWidth = 2; av.stroke();
      // 棱线
      av.strokeStyle = 'rgba(0,0,0,0.3)'; av.lineWidth = 1.5;
      av.beginPath(); av.moveTo(cx, cy-22); av.lineTo(cx, cy+26); av.stroke();
      // 花芯复眼
      av.fillStyle = '#ff44aa';
      av.shadowColor = '#ff22aa'; av.shadowBlur = 10;
      av.beginPath(); av.arc(cx, cy-2, 10, 0, Math.PI*2); av.fill();
      av.shadowBlur = 0;
      av.fillStyle = '#ffff44';
      av.beginPath(); av.arc(cx, cy-2, 4, 0, Math.PI*2); av.fill();

    } else if (type === 'kraken') {
      // 深渊海妖: 头 + 8条触须
      // 触须
      av.strokeStyle = '#772255'; av.lineWidth = 5; av.lineCap = 'round';
      for (let i=0;i<8;i++){
        const ang = (i/8)*Math.PI*2;
        av.beginPath();
        av.moveTo(cx+Math.cos(ang)*18, cy+Math.sin(ang)*10+6);
        const mx = cx+Math.cos(ang)*34, my = cy+Math.sin(ang)*28+10;
        av.quadraticCurveTo(mx, my, mx+Math.cos(ang+0.3)*12, my+Math.sin(ang+0.3)*12);
        av.stroke();
      }
      // 头
      av.fillStyle = '#552244';
      av.beginPath();
      av.moveTo(cx, cy-28); av.lineTo(cx+22, cy-8); av.lineTo(cx+18, cy+14);
      av.lineTo(cx-18, cy+14); av.lineTo(cx-22, cy-8);
      av.closePath(); av.fill();
      av.strokeStyle = '#aa4477'; av.lineWidth = 2; av.stroke();
      // 复眼
      av.fillStyle = '#ff3366';
      av.shadowColor = '#ff0044'; av.shadowBlur = 10;
      av.beginPath(); av.arc(cx-7, cy-4, 3.5, 0, Math.PI*2); av.fill();
      av.beginPath(); av.arc(cx+7, cy-4, 3.5, 0, Math.PI*2); av.fill();
      av.beginPath(); av.arc(cx, cy+2, 3, 0, Math.PI*2); av.fill();
      av.shadowBlur = 0;
      // 利齿
      av.fillStyle = '#fff';
      for (let i=-2;i<=2;i++){
        av.beginPath();
        av.moveTo(cx+i*5, cy+10); av.lineTo(cx+i*5-1.5, cy+16); av.lineTo(cx+i*5+1.5, cy+16);
        av.closePath(); av.fill();
      }
    }

    av.restore();
  } catch (e) {
    console.warn('drawBossAvatar failed:', e);
  }
}

// 触发 Boss 预告（荒野大镖客风格）：暂停游戏，显示 Boss 介绍，等玩家确认
let pendingBossType = null;
function triggerBossIntro(type) {
  if (game.bossPending) return;
  game.bossPending = true;
  pendingBossType = type;
  game.state = 'bossIntro';
  try {
    const cfg = BOSS_TYPES[type];
    document.getElementById('bossIntroName').textContent = cfg.name;
    document.getElementById('bossIntroDesc').textContent = cfg.desc;
    document.getElementById('bossIntroHP').textContent = cfg.hp;
    document.getElementById('bossIntroLv').textContent = '第 ' + (game.level + 1) + ' 关 · ' + LEVELS[game.level].name;
    // 先显示 overlay，再画头像（即使头像失败也能看到预告界面）
    document.getElementById('ovBossIntro').classList.remove('hidden');
    drawBossAvatar(type);
    sfx('bossWarn');
  } catch (e) {
    console.error('triggerBossIntro error:', e);
    // 兜底：直接开始 Boss 战，避免卡死
    confirmBossBattle();
  }
}

// 玩家确认后正式开始 Boss 战
function confirmBossBattle() {
  if (!game.bossPending) return;
  document.getElementById('ovBossIntro').classList.add('hidden');
  game.bossPending = false;
  game.state = 'playing';
  spawnBoss(pendingBossType);
  pendingBossType = null;
}

/* ==================== 玩家绘制: 歼20/隐身战机 ==================== */
function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2) return;
  const x = player.x, y = player.y;
  const tilt = player.tilt * 0.12;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);

  // ---- 引擎尾焰 (三层: 外蓝 / 中青 / 内白) ----
  player.engineT += 0.35;
  const f1 = 22 + Math.sin(player.engineT) * 6;
  const f2 = 14 + Math.sin(player.engineT * 1.8) * 4;
  const f3 = 8 + Math.sin(player.engineT * 2.6) * 2;
  // 左
  ctx.fillStyle = 'rgba(0,180,255,0.55)';
  ctx.beginPath(); ctx.moveTo(-11,20); ctx.lineTo(-7,20+f1); ctx.lineTo(-3,20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(120,230,255,0.8)';
  ctx.beginPath(); ctx.moveTo(-9,20); ctx.lineTo(-7,20+f2); ctx.lineTo(-5,20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-8,20); ctx.lineTo(-7,20+f3); ctx.lineTo(-6,20); ctx.closePath(); ctx.fill();
  // 右
  ctx.fillStyle = 'rgba(0,180,255,0.55)';
  ctx.beginPath(); ctx.moveTo(3,20); ctx.lineTo(7,20+f1); ctx.lineTo(11,20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(120,230,255,0.8)';
  ctx.beginPath(); ctx.moveTo(5,20); ctx.lineTo(7,20+f2); ctx.lineTo(9,20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(6,20); ctx.lineTo(7,20+f3); ctx.lineTo(8,20); ctx.closePath(); ctx.fill();

  // ---- 主翼: 大后掠菱形三角翼, 翼身融合 ----
  const wg = ctx.createLinearGradient(0,-12,0,20);
  wg.addColorStop(0,'#3e5063'); wg.addColorStop(0.5,'#2b3b4c'); wg.addColorStop(1,'#1a2836');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.moveTo(-38,16); ctx.lineTo(-26,-6); ctx.lineTo(-10,-10);
  ctx.lineTo(10,-10); ctx.lineTo(26,-6); ctx.lineTo(38,16);
  ctx.lineTo(16,16); ctx.lineTo(16,20); ctx.lineTo(-16,20); ctx.lineTo(-16,16);
  ctx.closePath(); ctx.fill();
  // 翼面蒙皮折线
  ctx.strokeStyle = 'rgba(120,150,180,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-38,16); ctx.lineTo(-26,-6); ctx.lineTo(-10,-10);
  ctx.moveTo(38,16); ctx.lineTo(26,-6); ctx.lineTo(10,-10);
  ctx.moveTo(-16,0); ctx.lineTo(16,0);
  ctx.stroke();
  // 翼端弹仓/挂架
  ctx.fillStyle = '#15202c';
  ctx.fillRect(-34,8,8,5); ctx.fillRect(26,8,8,5);

  // ---- 鸭翼 (前翼, J-20 特征) ----
  ctx.fillStyle = '#324252';
  ctx.beginPath(); ctx.moveTo(-22,-14); ctx.lineTo(-12,-19); ctx.lineTo(-10,-13); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22,-14); ctx.lineTo(12,-19); ctx.lineTo(10,-13); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,210,0.3)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(-22,-14); ctx.lineTo(-12,-19); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(22,-14); ctx.lineTo(12,-19); ctx.stroke();

  // ---- 机身: 菱形截面 + 尖锐边条(chine) ----
  const bg = ctx.createLinearGradient(-11,-28,11,20);
  bg.addColorStop(0,'#4d5e70'); bg.addColorStop(0.3,'#374757');
  bg.addColorStop(0.7,'#23313f'); bg.addColorStop(1,'#121d28');
  ctx.fillStyle = bg;
  // 边条(从机鼻延伸到主翼前缘的尖锐棱线)
  ctx.beginPath();
  ctx.moveTo(0,-30);            // 鼻尖
  ctx.lineTo(9,-16);            // 边条前缘转折
  ctx.lineTo(11,18);            // 机身尾部右侧
  ctx.lineTo(-11,18);           // 尾部左侧
  ctx.lineTo(-9,-16);
  ctx.closePath(); ctx.fill();
  // 机背脊线高光
  ctx.fillStyle = 'rgba(190,215,240,0.18)';
  ctx.beginPath();
  ctx.moveTo(0,-30); ctx.lineTo(2,-16); ctx.lineTo(0,18); ctx.lineTo(-2,-16);
  ctx.closePath(); ctx.fill();
  // 机身右侧阴影面
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.moveTo(9,-16); ctx.lineTo(11,18); ctx.lineTo(2,18); ctx.lineTo(2,-16);
  ctx.closePath(); ctx.fill();
  // 机腹折线
  ctx.strokeStyle = 'rgba(100,130,160,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-9,-16); ctx.lineTo(-11,18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,-16); ctx.lineTo(11,18); ctx.stroke();

  // ---- DSI 进气道鼓包 ----
  ctx.fillStyle = '#1a2632';
  ctx.beginPath(); ctx.ellipse(-6,2,3.5,3,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,2,3.5,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(80,110,140,0.5)';
  ctx.beginPath(); ctx.ellipse(-6,1,1.5,1.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,1,1.5,1.5,0,0,Math.PI*2); ctx.fill();

  // ---- 外倾双垂尾 ----
  ctx.fillStyle = '#243342';
  ctx.beginPath(); ctx.moveTo(-13,4); ctx.lineTo(-16,-12); ctx.lineTo(-10,-7); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13,4); ctx.lineTo(16,-12); ctx.lineTo(10,-7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(140,170,200,0.3)';
  ctx.beginPath(); ctx.moveTo(-16,-12); ctx.lineTo(-10,-7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16,-12); ctx.lineTo(10,-7); ctx.stroke();

  // ---- 座舱盖 (镀金膜座舱) ----
  ctx.fillStyle = '#08121c';
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.quadraticCurveTo(6,-18,5,-8);
  ctx.quadraticCurveTo(0,-4,-5,-8); ctx.quadraticCurveTo(-6,-18,0,-22);
  ctx.closePath(); ctx.fill();
  // 镀金反光
  const cg = ctx.createLinearGradient(-4,-20,4,-6);
  cg.addColorStop(0,'rgba(255,210,120,0.55)');
  cg.addColorStop(0.4,'rgba(120,200,255,0.25)');
  cg.addColorStop(1,'rgba(20,50,80,0.1)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.quadraticCurveTo(6,-18,5,-8);
  ctx.quadraticCurveTo(0,-4,-5,-8); ctx.quadraticCurveTo(-6,-18,0,-22);
  ctx.closePath(); ctx.fill();
  // 高光条
  ctx.fillStyle = 'rgba(220,245,255,0.6)';
  ctx.beginPath(); ctx.ellipse(-1.5,-16,1,3,-0.3,0,Math.PI*2); ctx.fill();
  // 座舱框
  ctx.strokeStyle = 'rgba(180,210,240,0.3)'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.quadraticCurveTo(6,-18,5,-8);
  ctx.quadraticCurveTo(0,-4,-5,-8); ctx.quadraticCurveTo(-6,-18,0,-22);
  ctx.stroke();

  // ---- 机鼻传感器 / 空速管 ----
  ctx.strokeStyle = '#aac'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(0,-34); ctx.stroke();
  ctx.fillStyle = '#7788aa';
  ctx.beginPath(); ctx.arc(0,-34,1,0,Math.PI*2); ctx.fill();

  // ---- 武器发光指示 (机鼻下方挂点) ----
  if (player.weapon !== 'normal') {
    const wc = { laser:'#0ff', shotgun:'#fd0', rocket:'#f60' }[player.weapon];
    ctx.shadowColor = wc; ctx.shadowBlur = 12;
    ctx.fillStyle = wc;
    ctx.globalAlpha = 0.55 + Math.sin(game.time * 9) * 0.3;
    ctx.beginPath(); ctx.arc(0,-26,2.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  ctx.restore();
}

/* ==================== 怪兽绘制 ==================== */
function drawMonster(m) {
  const x = m.x, y = m.y, s = m.size;
  ctx.save();
  ctx.translate(x, y);

  if (m.type === 'octopus') {
    // 生化机械章鱼: 金属头壳 + 发光脉络 + 分段机械触手
    const hg = ctx.createRadialGradient(-4*s,-6*s,2*s, 0,-4*s,15*s);
    hg.addColorStop(0,'#5a3a7a'); hg.addColorStop(0.6,'#3a1a5a'); hg.addColorStop(1,'#1a0a2a');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0,-4*s,14*s,0,Math.PI*2); ctx.fill();
    // 头壳装甲板
    ctx.fillStyle = 'rgba(20,10,30,0.5)';
    ctx.beginPath(); ctx.arc(0,-4*s,14*s,Math.PI*0.15,Math.PI*0.85); ctx.lineTo(0,-4*s); ctx.fill();
    // 发光脉络 (赛博纹理)
    ctx.strokeStyle = `rgba(0,255,200,${0.5+Math.sin(m.t*3)*0.2})`; ctx.lineWidth = 1.2*s;
    ctx.beginPath();
    ctx.moveTo(-8*s,-10*s); ctx.lineTo(-3*s,-2*s); ctx.lineTo(-5*s,4*s);
    ctx.moveTo(8*s,-10*s); ctx.lineTo(3*s,-2*s); ctx.lineTo(5*s,4*s);
    ctx.moveTo(0,-14*s); ctx.lineTo(0,-2*s);
    ctx.stroke();
    // 单眼 (垂直裂缝状发光眼)
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0,-5*s,5*s,6*s,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00ffaa';
    ctx.shadowColor = '#00ffaa'; ctx.shadowBlur = 8*s;
    ctx.beginPath(); ctx.ellipse(0,-5*s,2.5*s,5*s,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-1*s,-7*s,1*s,2*s,0,0,Math.PI*2); ctx.fill();
    // 5条分段机械触手
    for (let i = -2; i <= 2; i++) {
      const tx = i * 7 * s;
      const wave = Math.sin(m.t * 2 + i * 0.8) * 5 * s;
      // 触手主体 (深色)
      ctx.fillStyle = '#2a1a3a';
      ctx.beginPath();
      ctx.moveTo(tx - 3.5*s, 5*s);
      ctx.quadraticCurveTo(tx + wave, 18*s, tx - 1*s, 24*s);
      ctx.quadraticCurveTo(tx + wave*0.5, 18*s, tx + 3.5*s, 5*s);
      ctx.closePath(); ctx.fill();
      // 触手关节环 (发光)
      ctx.fillStyle = '#00ffcc';
      for (let j = 1; j <= 3; j++) {
        const jy = 5*s + j * 5 * s;
        ctx.beginPath(); ctx.arc(tx + wave*(j/4), jy, 1*s, 0, Math.PI*2); ctx.fill();
      }
    }
  } else if (m.type === 'scorpion') {
    // 装甲机械蝎: 金属分节 + 能量钳 + 等离子毒尾
    // 身体分节 (金属装甲)
    for (let i = 0; i < 4; i++) {
      const sg = ctx.createRadialGradient(0,-8*s+i*8*s,1*s, 0,-8*s+i*8*s,(12-i*1.5)*s);
      sg.addColorStop(0,'#882244'); sg.addColorStop(1,'#330818');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.ellipse(0,-8*s+i*8*s,(12-i*1.5)*s,(5-i*0.5)*s,0,0,Math.PI*2);
      ctx.fill();
      // 装甲板缝
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0,-8*s+i*8*s,(12-i*1.5)*s,(5-i*0.5)*s,0,0,Math.PI*2); ctx.stroke();
    }
    // 钳子 (带能量刃)
    const clawOpen = Math.sin(m.t * 3) * 2 * s;
    ctx.fillStyle = '#551133';
    ctx.beginPath(); ctx.ellipse(-15*s,-10*s,7*s,5*s,0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(15*s,-10*s,7*s,5*s,-0.3,0,Math.PI*2); ctx.fill();
    // 钳爪能量刃
    ctx.fillStyle = '#ff3366';
    ctx.shadowColor = '#ff3366'; ctx.shadowBlur = 6*s;
    ctx.beginPath(); ctx.moveTo(-20*s,-13*s+clawOpen); ctx.lineTo(-26*s,-17*s); ctx.lineTo(-18*s,-10*s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20*s,-13*s-clawOpen); ctx.lineTo(26*s,-17*s); ctx.lineTo(18*s,-10*s); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    // 尾巴 (弯曲带发光节)
    ctx.strokeStyle = '#551133'; ctx.lineWidth = 5*s; ctx.lineCap = 'round';
    const tailWag = Math.sin(m.t * 2) * 6 * s;
    ctx.beginPath();
    ctx.moveTo(0,14*s);
    ctx.quadraticCurveTo(12*s+tailWag,22*s,6*s,30*s);
    ctx.stroke();
    // 尾节发光点
    ctx.fillStyle = '#ff4400';
    for (let j = 1; j <= 3; j++) {
      const tt = j/4;
      const tx = 0 + (12*s+tailWag)*2*tt*(1-tt) + 6*s*tt*tt;
      const ty = 14*s + 8*s*2*tt*(1-tt) + 16*s*tt*tt;
      ctx.beginPath(); ctx.arc(tx,ty,1.2*s,0,Math.PI*2); ctx.fill();
    }
    // 毒刺 (等离子)
    ctx.fillStyle = '#ffaa00';
    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 8*s;
    ctx.beginPath(); ctx.moveTo(6*s,30*s); ctx.lineTo(2*s,37*s); ctx.lineTo(9*s,34*s); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    // 复眼 (多眼)
    ctx.fillStyle = '#ffee00';
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 4;
    for (let j = -1; j <= 1; j++) {
      ctx.beginPath(); ctx.arc(j*4*s,-10*s,2*s,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  } else if (m.type === 'ufo') {
    // 外星战舰: 棱角舰体 + 底部能量核心 + 侧推进器
    // 底部舰体 (棱角六边形)
    ctx.fillStyle = '#2a3a4a';
    ctx.beginPath();
    ctx.moveTo(-22*s,4*s); ctx.lineTo(-16*s,10*s); ctx.lineTo(16*s,10*s);
    ctx.lineTo(22*s,4*s); ctx.lineTo(16*s,-2*s); ctx.lineTo(-16*s,-2*s);
    ctx.closePath(); ctx.fill();
    // 中层舰桥
    const mg = ctx.createLinearGradient(0,-6*s,0,4*s);
    mg.addColorStop(0,'#5a6a7a'); mg.addColorStop(1,'#334252');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.moveTo(-16*s,-2*s); ctx.lineTo(-12*s,-6*s); ctx.lineTo(12*s,-6*s); ctx.lineTo(16*s,-2*s);
    ctx.closePath(); ctx.fill();
    // 顶部圆顶 (能量罩)
    const dg = ctx.createRadialGradient(-3*s,-9*s,1*s, 0,-6*s,11*s);
    dg.addColorStop(0,'#ccffff'); dg.addColorStop(0.5,'#33aacc'); dg.addColorStop(1,'#004466');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.ellipse(0,-6*s,10*s,7*s,0,Math.PI,0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(-3*s,-10*s,3*s,3*s,-0.3,0,Math.PI*2); ctx.fill();
    // 底部能量核心 (脉冲)
    const pulse = (Math.sin(m.t*3)+1)/2;
    ctx.fillStyle = `rgba(255,${100+pulse*155},0,${0.6+pulse*0.4})`;
    ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 10*s;
    ctx.beginPath(); ctx.arc(0,8*s,4*s+pulse*s,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 侧推进器发光
    for (let j = -1; j <= 1; j += 2) {
      ctx.fillStyle = '#00aaff';
      ctx.shadowColor = '#0088ff'; ctx.shadowBlur = 6*s;
      ctx.beginPath(); ctx.arc(j*18*s,2*s,2*s,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // 底部灯条
    ctx.fillStyle = '#00ffff';
    for (let j = -2; j <= 2; j++) {
      ctx.beginPath(); ctx.arc(j*7*s,10*s,1*s,0,Math.PI*2); ctx.fill();
    }
  } else if (m.type === 'bug') {
    // 机械蜂群无人机: 尖锐虫体 + 能量翅 + 复眼
    const bg = ctx.createLinearGradient(0,-14*s,0,14*s);
    bg.addColorStop(0,'#2a4a2a'); bg.addColorStop(0.5,'#1a3318'); bg.addColorStop(1,'#0a1a0a');
    ctx.fillStyle = bg;
    // 尖锐虫体 (水滴形)
    ctx.beginPath();
    ctx.moveTo(0,-15*s); ctx.lineTo(9*s,0); ctx.lineTo(6*s,14*s);
    ctx.lineTo(-6*s,14*s); ctx.lineTo(-9*s,0); ctx.closePath(); ctx.fill();
    // 甲壳分割线
    ctx.strokeStyle = 'rgba(80,140,60,0.5)'; ctx.lineWidth = 1.2*s;
    ctx.beginPath(); ctx.moveTo(0,-15*s); ctx.lineTo(0,14*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9*s,0); ctx.lineTo(9*s,0); ctx.stroke();
    // 甲壳发光斑点
    ctx.fillStyle = '#66ff44';
    ctx.shadowColor = '#44ff22'; ctx.shadowBlur = 4*s;
    ctx.beginPath(); ctx.arc(-4*s,-4*s,1.5*s,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s,2*s,1.2*s,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 翅膀 (高速振动, 带能量纹)
    const wing = Math.sin(m.t * 10) * 3 * s;
    ctx.fillStyle = 'rgba(150,255,150,0.3)';
    ctx.beginPath(); ctx.ellipse(-13*s,-4*s+wing,10*s,6*s,-0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13*s,-4*s-wing,10*s,6*s,0.4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(100,255,100,0.5)'; ctx.lineWidth = 0.8*s;
    ctx.beginPath(); ctx.moveTo(-5*s,-4*s); ctx.lineTo(-20*s,-4*s+wing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5*s,-4*s); ctx.lineTo(20*s,-4*s-wing); ctx.stroke();
    // 复眼 (红色发光阵列)
    ctx.fillStyle = '#ff0000';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 6*s;
    ctx.beginPath(); ctx.arc(-4*s,-9*s,3*s,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s,-9*s,3*s,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff8888';
    ctx.beginPath(); ctx.arc(-5*s,-10*s,1*s,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3*s,-10*s,1*s,0,Math.PI*2); ctx.fill();
    // 口器
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.moveTo(-2*s,13*s); ctx.lineTo(0,17*s); ctx.lineTo(2*s,13*s); ctx.closePath(); ctx.fill();
  } else if (m.type === 'turret') {
    // 重型等离子炮台: 装甲底座 + 能量线圈 + 旋转炮管
    // 底座 (八边形装甲)
    const baseGrad = ctx.createLinearGradient(0,-4*s,0,18*s);
    baseGrad.addColorStop(0,'#555'); baseGrad.addColorStop(1,'#2a2a2a');
    ctx.fillStyle = baseGrad;
    ctx.beginPath();
    ctx.moveTo(-16*s,-4*s); ctx.lineTo(-18*s,4*s); ctx.lineTo(-16*s,14*s);
    ctx.lineTo(16*s,14*s); ctx.lineTo(18*s,4*s); ctx.lineTo(16*s,-4*s);
    ctx.closePath(); ctx.fill();
    // 装甲铆钉
    ctx.fillStyle = '#888';
    for (let j = -1; j <= 1; j++) {
      ctx.beginPath(); ctx.arc(j*10*s,11*s,1.5*s,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(j*10*s,1*s,1.5*s,0,Math.PI*2); ctx.fill();
    }
    // 履带
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-18*s,14*s,36*s,7*s);
    ctx.fillStyle = '#3a3a3a';
    for (let j = -3; j <= 3; j++) ctx.fillRect(j*6*s-1.5,15*s,3*s,5*s);
    // 能量线圈 (环绕炮座)
    ctx.strokeStyle = '#ff6600';
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 8*s;
    ctx.lineWidth = 1.5*s;
    for (let j = 0; j < 3; j++) {
      const ry = -2*s + j*3*s;
      ctx.beginPath(); ctx.ellipse(0,ry,9*s,2.5*s,0,0,Math.PI*2); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // 炮塔球
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.arc(0,-3*s,8*s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath(); ctx.arc(0,-3*s,8*s,0.2,Math.PI-0.2); ctx.fill();
    // 炮管 (朝玩家)
    const ang = Math.atan2(player.y - m.y, player.x - m.x) + Math.PI/2;
    ctx.save();
    ctx.rotate(ang);
    // 炮管主体
    ctx.fillStyle = '#333';
    ctx.fillRect(-4*s,-24*s,8*s,22*s);
    // 炮管散热片
    ctx.fillStyle = '#555';
    for (let j = 0; j < 4; j++) ctx.fillRect(-5*s,-22*s+j*5*s,10*s,2*s);
    // 炮口
    ctx.fillStyle = '#222';
    ctx.fillRect(-5*s,-26*s,10*s,4*s);
    // 炮口能量
    ctx.fillStyle = '#ff4400';
    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 6*s;
    ctx.beginPath(); ctx.arc(0,-26*s,2.5*s,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    // 红眼瞄准 (跟随)
    ctx.fillStyle = '#ff2200';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 8*s;
    ctx.beginPath(); ctx.arc(0,-3*s,3*s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,-3*s,1*s,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (m.type === 'bomber') {
    // 隐身攻击机: 飞翼布局 + 棱角切面 + 多引擎
    // 主翼 (飞翼, 棱角)
    const wg = ctx.createLinearGradient(0,-10*s,0,20*s);
    wg.addColorStop(0,'#4a3a2a'); wg.addColorStop(0.5,'#33251a'); wg.addColorStop(1,'#1a1208');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(-40*s,8*s); ctx.lineTo(-28*s,-8*s); ctx.lineTo(-12*s,-14*s);
    ctx.lineTo(12*s,-14*s); ctx.lineTo(28*s,-8*s); ctx.lineTo(40*s,8*s);
    ctx.lineTo(20*s,14*s); ctx.lineTo(-20*s,14*s);
    ctx.closePath(); ctx.fill();
    // 翼面折线 (隐身切面)
    ctx.strokeStyle = 'rgba(120,90,60,0.4)'; ctx.lineWidth = 1*s;
    ctx.beginPath();
    ctx.moveTo(-40*s,8*s); ctx.lineTo(-28*s,-8*s); ctx.lineTo(-12*s,-14*s);
    ctx.moveTo(40*s,8*s); ctx.lineTo(28*s,-8*s); ctx.lineTo(12*s,-14*s);
    ctx.moveTo(-20*s,2*s); ctx.lineTo(20*s,2*s);
    ctx.stroke();
    // 机身中央棱
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.moveTo(0,-24*s); ctx.lineTo(8*s,-8*s); ctx.lineTo(10*s,14*s);
    ctx.lineTo(-10*s,14*s); ctx.lineTo(-8*s,-8*s);
    ctx.closePath(); ctx.fill();
    // 机翼引擎 (4发)
    for (let j = -1; j <= 1; j += 2) {
      for (let k = -1; k <= 1; k += 2) {
        const ex = j * 22*s;
        const ey = 4*s + k * 4*s;
        ctx.fillStyle = '#1a1208';
        ctx.beginPath(); ctx.ellipse(ex,ey,4*s,7*s,0,0,Math.PI*2); ctx.fill();
        // 引擎喷口
        ctx.fillStyle = '#ff6600';
        ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 6*s;
        ctx.beginPath(); ctx.ellipse(ex,ey+5*s,2.5*s,3*s,0,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    // 驾驶舱 (发光橙色)
    ctx.fillStyle = '#000810';
    ctx.beginPath(); ctx.ellipse(0,-14*s,8*s,6*s,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,0,0.7)';
    ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 6*s;
    ctx.beginPath(); ctx.ellipse(0,-15*s,5*s,3.5*s,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 翼端武器挂架
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(-36*s,6*s,6*s,4*s);
    ctx.fillRect(30*s,6*s,6*s,4*s);
  }

  // 血条 (多血怪兽)
  if (m.maxHp > 1) {
    const bw = 26 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-bw/2, -22 * s, bw, 3);
    ctx.fillStyle = '#ff3030';
    ctx.fillRect(-bw/2, -22 * s, bw * (m.hp / m.maxHp), 3);
  }
  ctx.restore();
}

/* ==================== Boss 绘制 ==================== */
function drawBoss(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  const S = b.size / 5; // 缩放基准

  // 高对比光晕: 确保Boss在任何背景下都清晰可见（不与背景色融合）
  const auraR = 78 * S;
  const aura = ctx.createRadialGradient(0, 0, 8*S, 0, 0, auraR);
  aura.addColorStop(0, 'rgba(255,240,200,0.30)');
  aura.addColorStop(0.45, 'rgba(255,180,80,0.16)');
  aura.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI*2); ctx.fill();

  if (b.type === 'voidlord') {
    // 虚空领主: 巨型菱形外星母舰 + 发光核心 + 侧翼
    // 侧翼
    ctx.fillStyle = '#2a1a4a';
    ctx.beginPath();
    ctx.moveTo(-20*S,-10*S); ctx.lineTo(-70*S,5*S); ctx.lineTo(-60*S,25*S); ctx.lineTo(-18*S,15*S);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(20*S,-10*S); ctx.lineTo(70*S,5*S); ctx.lineTo(60*S,25*S); ctx.lineTo(18*S,15*S);
    ctx.closePath(); ctx.fill();
    // 主体 (菱形)
    const bg = ctx.createLinearGradient(0,-50*S,0,50*S);
    bg.addColorStop(0,'#4a2a8a'); bg.addColorStop(0.5,'#2a1a5a'); bg.addColorStop(1,'#1a0a3a');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0,-50*S); ctx.lineTo(40*S,0); ctx.lineTo(25*S,40*S);
    ctx.lineTo(-25*S,40*S); ctx.lineTo(-40*S,0);
    ctx.closePath(); ctx.fill();
    // 装甲棱线
    ctx.strokeStyle = 'rgba(150,100,220,0.4)'; ctx.lineWidth = 1.5*S;
    ctx.beginPath();
    ctx.moveTo(0,-50*S); ctx.lineTo(40*S,0); ctx.lineTo(25*S,40*S);
    ctx.moveTo(0,-50*S); ctx.lineTo(-40*S,0); ctx.lineTo(-25*S,40*S);
    ctx.stroke();
    // 核心 (脉冲发光)
    const pulse = 0.6 + Math.sin(b.t*4)*0.4;
    ctx.fillStyle = `rgba(180,80,255,${pulse})`;
    ctx.shadowColor = '#aa44ff'; ctx.shadowBlur = 20*S;
    ctx.beginPath(); ctx.arc(0,-5*S,12*S,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,-5*S,5*S,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 眼部传感器 (多条)
    ctx.fillStyle = '#ff44aa';
    ctx.shadowColor = '#ff22aa'; ctx.shadowBlur = 8*S;
    for (let j=-2;j<=2;j++){
      ctx.beginPath(); ctx.ellipse(j*10*S, 20*S, 2.5*S, 5*S, 0, 0, Math.PI*2); ctx.fill();
