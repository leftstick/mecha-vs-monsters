    ctx.strokeStyle = 'rgba(10,50,15,0.5)'; ctx.lineWidth = 2*S;
    for (let a=0;a<Math.PI*2;a+=Math.PI/6){
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*10*S, Math.sin(a)*10*S);
      ctx.lineTo(Math.cos(a)*44*S, Math.sin(a)*44*S);
      ctx.stroke();
    }
    // 顶部花/叶冠
    ctx.fillStyle = '#3a8a3a';
    for (let a=0;a<Math.PI*2;a+=Math.PI/5){
      const lx = Math.cos(a)*30*S, ly = -35*S + Math.sin(a)*8*S;
      ctx.beginPath(); ctx.ellipse(lx,ly,12*S,6*S,a,0,Math.PI*2); ctx.fill();
    }
    // 核心花芯 (眼睛)
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0,-5*S,16*S,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff2266';
    ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 16*S;
    ctx.beginPath(); ctx.arc(0,-5*S,12*S,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffee00';
    ctx.beginPath(); ctx.arc(0,-5*S,5*S,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 周围花瓣状眼
    for (let i=0;i<6;i++){
      const a = i * Math.PI/3 + b.t*0.3;
      const ex = Math.cos(a)*28*S, ey = -5*S + Math.sin(a)*22*S;
      ctx.fillStyle = '#ff6622';
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 6*S;
      ctx.beginPath(); ctx.arc(ex,ey,3*S,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // 獠牙 (植物怪也有)
    ctx.fillStyle = '#ddeecc';
    for (let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(i*8*S-2*S, 12*S); ctx.lineTo(i*8*S, 22*S); ctx.lineTo(i*8*S+2*S, 12*S);
      ctx.closePath(); ctx.fill();
    }
  } else if (b.type === 'kraken') {
    // 深渊海妖: 装甲头部 + 8条发光触须 + 复眼
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2 + Math.PI/8;
      const wave = Math.sin(b.t * 1.5 + i * 0.7) * 20*S;
      const sx = Math.cos(ang) * 36*S, sy = Math.sin(ang) * 36*S - 8*S;
      const mx = Math.cos(ang) * 62*S, my = Math.sin(ang) * 62*S + wave;
      const ex = Math.cos(ang) * 46*S, ey = Math.sin(ang) * 96*S;
      ctx.strokeStyle = '#5a1144'; ctx.lineWidth = 14*S;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();
      ctx.strokeStyle = `rgba(255,${80+Math.sin(b.t*2+i)*40},180,0.6)`; ctx.lineWidth = 3*S;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();
      ctx.fillStyle = '#ff88bb';
      for (let k = 1; k <= 2; k++) {
        const tt = k/3;
        const px = sx + (mx-sx)*2*tt*(1-tt) + (ex-sx)*tt*tt;
        const py = sy + (my-sy)*2*tt*(1-tt) + (ey-sy)*tt*tt;
        ctx.beginPath(); ctx.arc(px,py,4*S,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#ff44aa';
      ctx.shadowColor = '#ff22aa'; ctx.shadowBlur = 10*S;
      ctx.beginPath(); ctx.arc(ex,ey,5*S,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    const bg = ctx.createRadialGradient(-12*S,-22*S,10*S, 0,-12*S,68*S);
    bg.addColorStop(0,'#dd3388'); bg.addColorStop(0.6,'#882255'); bg.addColorStop(1,'#330022');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0,-12*S,58*S,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(30,0,20,0.45)';
    ctx.beginPath(); ctx.arc(0,-12*S,58*S,Math.PI*0.1,Math.PI*0.9); ctx.lineTo(0,-12*S); ctx.fill();
    ctx.fillStyle = `rgba(120,255,200,${0.5+Math.sin(b.t*3)*0.3})`;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.beginPath(); ctx.arc(Math.cos(a)*30*S, -12*S+Math.sin(a)*20*S, 3*S, 0, Math.PI*2); ctx.fill();
    }
    for (let j = -1; j <= 1; j++) {
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(j*18*S,-20*S,10*S,9*S,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffff00';
      ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 14*S;
      ctx.beginPath(); ctx.arc(j*18*S,-20*S,7*S,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(j*18*S,-20*S,3.5*S,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(j*18*S-2*S,-22*S,1.5*S,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#1a0010';
    ctx.beginPath();
    ctx.moveTo(-22*S,2*S); ctx.quadraticCurveTo(0,16*S,22*S,2*S);
    ctx.quadraticCurveTo(0,6*S,-22*S,2*S);
    ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i*8*S-3*S,2*S); ctx.lineTo(i*8*S,10*S); ctx.lineTo(i*8*S+3*S,2*S);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

/* ==================== 子弹 ==================== */
function fireBullet() {
  if (player.fireCD > 0) return;
  const w = player.weapon;
  if (w === 'normal') {
    player.fireCD = CFG.fireInterval;
    game.bullets.push({ x: player.x, y: player.y - 24, vx: 0, vy: -CFG.bulletSpeed, dmg: 1, type: 'normal' });
    game.shots++;
    sfx('shoot');
  } else if (w === 'laser') {
    // 激光: 穿透, 高伤害, 宽弹
    player.fireCD = 0.08;
    game.bullets.push({ x: player.x, y: player.y - 24, vx: 0, vy: -CFG.bulletSpeed * 1.4, dmg: 2, type: 'laser', pierce: true });
    game.shots++;
    sfx('laser');
  } else if (w === 'shotgun') {
    // 霰弹: 5 发扇形散射
    player.fireCD = 0.28;
    for (let i = -2; i <= 2; i++) {
      const ang = -Math.PI / 2 + i * 0.18;
      game.bullets.push({ x: player.x, y: player.y - 20, vx: Math.cos(ang) * CFG.bulletSpeed, vy: Math.sin(ang) * CFG.bulletSpeed, dmg: 1, type: 'shotgun' });
    }
    game.shots += 5;
    sfx('shotgun');
  } else if (w === 'rocket') {
    // 三连发火箭: 追踪, 爆炸伤害
    player.fireCD = 0.35;
    for (let i = -1; i <= 1; i++) {
      game.bullets.push({ x: player.x + i * 12, y: player.y - 20, vx: i * 60, vy: -CFG.bulletSpeed * 0.9, dmg: 3, type: 'rocket', track: true });
    }
    game.shots += 3;
    sfx('rocket');
  }
  // 炮口闪光粒子
  for (let i = 0; i < 3; i++) {
    game.particles.push({ x: player.x + rand(-4, 4), y: player.y - 24, vx: rand(-30, 30), vy: rand(-50, -10), life: 0.15, color: '#aaffff', size: 3 });
  }
}

function updateBullets(dt) {
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    // 追踪导弹
    if (b.track) {
      let target = game.boss;
      if (!target && game.monsters.length > 0) {
        // 找最近的怪兽
        let minD = Infinity;
        for (const m of game.monsters) {
          const d = dist(b, m);
          if (d < minD) { minD = d; target = m; }
        }
      }
      if (target) {
        const dx = target.x - b.x, dy = target.y - b.y;
        const d = Math.hypot(dx, dy) || 1;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx += (dx / d) * 600 * dt;
        b.vy += (dy / d) * 600 * dt;
        const ns = Math.hypot(b.vx, b.vy);
        if (ns > sp * 1.5) { b.vx = b.vx / ns * sp * 1.5; b.vy = b.vy / ns * sp * 1.5; }
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) game.bullets.splice(i, 1);
  }
  for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
    const b = game.enemyBullets[i];
    // 追踪弹
    if (b.homing) {
      const dx = player.x - b.x, dy = player.y - b.y;
      const d = Math.max(Math.hypot(dx, dy), 0.001);
      const curSpeed = Math.hypot(b.vx, b.vy);
      b.vx += (dx / d) * b.homing * dt;
      b.vy += (dy / d) * b.homing * dt;
      const ns = Math.hypot(b.vx, b.vy);
      if (ns > curSpeed * 1.3) { b.vx = b.vx / ns * curSpeed * 1.3; b.vy = b.vy / ns * curSpeed * 1.3; }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    // 分裂弹 (到达玩家y附近时分裂)
    if (b.split && b.y >= player.y - 30 && b.y <= player.y + 30) {
      b.split = false;
      for (let k = 0; k < b.splitCount; k++) {
        const ang = -Math.PI/2 + (k - (b.splitCount-1)/2) * (Math.PI / (b.splitCount-1));
        const sp = b.splitSpeed || 220;
        game.enemyBullets.push({ x: b.x, y: b.y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp });
      }
      game.enemyBullets.splice(i, 1);
      continue;
    }
    if (b.y > H + 30 || b.y < -40 || b.x < -40 || b.x > W + 40) game.enemyBullets.splice(i, 1);
  }
}

function drawBullets() {
  for (const b of game.bullets) {
    if (b.type === 'laser') {
      // 激光: 青色粗光柱
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 12;
      ctx.fillRect(b.x - 4, b.y - 14, 8, 24);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x - 2, b.y - 14, 4, 24);
      ctx.shadowBlur = 0;
    } else if (b.type === 'shotgun') {
      // 霰弹: 黄色小球
      ctx.fillStyle = '#ffdd00';
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    } else if (b.type === 'rocket') {
      // 火箭: 橙色带尾焰
      ctx.fillStyle = '#ff6600';
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - 8); ctx.lineTo(b.x + 4, b.y + 6); ctx.lineTo(b.x - 4, b.y + 6);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      // 尾焰
      ctx.fillStyle = 'rgba(255,200,0,0.6)';
      ctx.beginPath(); ctx.arc(b.x, b.y + 8, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      // 普通子弹: 蓝色能量弹
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, 3, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,229,255,0.3)';
      ctx.fillRect(b.x - 1, b.y, 2, 8);
    }
  }
  // 敌方子弹 (按类型着色)
  for (const b of game.enemyBullets) {
    const col = b.color || '#ff4444';
    const rad = b.radius || 5;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(b.x, b.y, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

/* ==================== 粒子 ==================== */
function addExplosion(x, y, color, count = 12, power = 1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(60, 200) * power;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.7),
      color, size: rand(2, 5) * power,
    });
  }
}

function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* ==================== 碰撞 ==================== */
function checkCollisions() {
  // 玩家子弹 vs 怪兽
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    let consumed = false;
    let hitCount = 0;
    for (let j = game.monsters.length - 1; j >= 0; j--) {
      const m = game.monsters[j];
      if (dist(b, m) < 18 * m.size) {
        m.hp -= b.dmg;
        game.hits++;
        addExplosion(b.x, b.y, '#88ccff', 4, 0.5);
        hitCount++;
        if (m.hp <= 0) {
          game.kills++;
          game.score += m.score;
          addExplosion(m.x, m.y, '#ff8800', 16, 1);
          sfx('explode');
          // 火箭爆炸范围伤害
          if (b.type === 'rocket') {
            rocketExplode(b.x, b.y, 50, b.dmg);
          }
          // 随机掉落宝盒 (5% 概率)
          if (Math.random() < 0.05) spawnPowerup(m.x, m.y);
          game.monsters.splice(j, 1);
        } else {
          sfx('hit');
        }
        if (!b.pierce) { consumed = true; break; }
      }
    }
    // vs Boss（仅在 Boss 完全进场后才能造成伤害，缩小碰撞半径更精准）
    if (!consumed && game.boss && game.boss.phase === 'fight') {
      if (dist(b, game.boss) < 14 * game.boss.size) {
        game.boss.hp -= b.dmg;
        game.hits++;
        addExplosion(b.x, b.y, '#ffaa00', 4, 0.5);
        hitCount++;
        if (b.type === 'rocket') rocketExplode(b.x, b.y, 60, b.dmg);
        document.getElementById('bossFill').style.width = (game.boss.hp / game.boss.maxHp * 100) + '%';
        if (game.boss.hp <= 0) {
          game.score += game.boss.score;
          addExplosion(game.boss.x, game.boss.y, '#ff5500', 60, 2);
          game.shake = 0.5;
          sfx('bossDie');
          game.boss = null;
          game.bossActive = false;
          game.bossPending = true; // 阻止 updateWaves 再次触发 Boss 预告
          document.getElementById('bossBar').classList.remove('show');
          setTimeout(() => endLevel(true), 800);
        }
        if (!b.pierce) consumed = true;
      }
    }
    if (consumed) game.bullets.splice(i, 1);
  }

  // 玩家 vs 宝盒
  for (let i = game.powerups.length - 1; i >= 0; i--) {
    const p = game.powerups[i];
    if (dist(p, player) < 28) {
      applyPowerup(p.type);
      addExplosion(p.x, p.y, '#ffd700', 12, 0.8);
      sfx('powerup');
      game.powerups.splice(i, 1);
    }
  }

  // 敌方子弹 vs 玩家
  if (player.invuln <= 0) {
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      if (dist(b, player) < 18) {
        playerHit();
        game.enemyBullets.splice(i, 1);
        break;
      }
    }
    // 怪兽撞玩家
    for (const m of game.monsters) {
      if (dist(m, player) < 16 * m.size + 10) {
        playerHit();
        break;
      }
    }
    // Boss 撞玩家 (尤其冲撞型)
    if (game.boss && game.boss.phase === 'fight') {
      const bs = game.boss;
      const hitR = (bs.type === 'beastking' && bs.charging) ? 28 * bs.size : 22 * bs.size;
      if (dist(bs, player) < hitR) {
        playerHit();
      }
    }
  }
}

// 火箭爆炸范围伤害
function rocketExplode(x, y, radius, dmg) {
  addExplosion(x, y, '#ff6600', 20, 1.2);
  game.shake = Math.max(game.shake, 0.15);
  for (let j = game.monsters.length - 1; j >= 0; j--) {
    const m = game.monsters[j];
    if (dist({x,y}, m) < radius) {
      m.hp -= dmg;
      if (m.hp <= 0) {
        game.kills++;
        game.score += m.score;
        addExplosion(m.x, m.y, '#ff8800', 12, 0.8);
        if (Math.random() < 0.05) spawnPowerup(m.x, m.y);
        game.monsters.splice(j, 1);
      }
    }
  }
  if (game.boss && game.boss.phase === 'fight' && dist({x,y}, game.boss) < radius) {
    game.boss.hp -= dmg * 0.5;
    document.getElementById('bossFill').style.width = (game.boss.hp / game.boss.maxHp * 100) + '%';
  }
}

/* ==================== 奖励宝盒 ==================== */
const POWERUP_TYPES = ['laser', 'shotgun', 'rocket'];
function spawnPowerup(x, y) {
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  game.powerups.push({ x, y, vy: 80, type, t: 0 });
}
function updatePowerups(dt) {
  for (let i = game.powerups.length - 1; i >= 0; i--) {
    const p = game.powerups[i];
    p.y += p.vy * dt;
    p.t += dt;
    if (p.y > H + 30) game.powerups.splice(i, 1);
  }
}
function drawPowerups() {
  for (const p of game.powerups) {
    const colors = { laser: '#00ffff', shotgun: '#ffdd00', rocket: '#ff6600' };
    const labels = { laser: 'L', shotgun: 'S', rocket: 'R' };
    const c = colors[p.type];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.t * 2);
    // 外框发光
    ctx.shadowColor = c; ctx.shadowBlur = 12;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(-12, -12, 24, 24);
    ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.strokeRect(-12, -12, 24, 24);
    ctx.shadowBlur = 0;
    ctx.rotate(-p.t * 2);
    // 字母
    ctx.fillStyle = c;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[p.type], 0, 0);
    ctx.restore();
  }
}
function applyPowerup(type) {
  player.weapon = type;
  player.weaponTime = 10; // 持续 10 秒
}

function playerHit() {
  player.hp--;
  player.invuln = CFG.invulnTime;
  game.shake = 0.3;
  addExplosion(player.x, player.y, '#00aaff', 10, 0.8);
  sfx('hurt');
  updateHUD();
  if (player.hp <= 0) endLevel(false);
}

/* ==================== 怪兽更新 ==================== */
function updateMonsters(dt) {
  const lv = LEVELS[game.level];
  for (let i = game.monsters.length - 1; i >= 0; i--) {
    const m = game.monsters[i];
    m.t += dt;
    if (m.phase === 'enter') {
      m.y += m.vy * dt;
      if (m.y > 60) { m.phase = 'fight'; }
    } else {
      // 战斗模式: 持续缓慢下降 + 左右穿梭（不再固定在某条线上）
      if (m.pattern === 'wave') {
        m.x += m.vx * dt;
        // 边界反弹
        if (m.x < 35) { m.x = 35; m.vx = Math.abs(m.vx); }
        if (m.x > W - 35) { m.x = W - 35; m.vx = -Math.abs(m.vx); }
      } else {
        m.x += Math.sin(m.t * 1.5) * 40 * dt;
        m.x = clamp(m.x, 35, W - 35);
      }
      // 持续向玩家方向下压，制造压迫感；上下小幅波动
      m.y += m.vy * 0.4 * dt + Math.sin(m.t * 2) * 6 * dt;

      const cfg = MONSTER_TYPES[m.type];
      if (cfg.shoot) {
        m.shootCD -= dt;
        if (m.shootCD <= 0) {
          m.shootCD = m.shootInterval;
          const dx = player.x - m.x, dy = player.y - m.y;
          const d = Math.hypot(dx, dy);
          const bSpeed = 220 * (CFG.difficulty[game.level] || 1);
          game.enemyBullets.push({ x: m.x, y: m.y + 10 * m.size, vx: dx/d * bSpeed, vy: dy/d * bSpeed });
          if (m.type === 'bomber') {
            // 轰炸机撒 3 发
            game.enemyBullets.push({ x: m.x - 15, y: m.y, vx: -60, vy: 200 * (CFG.difficulty[game.level] || 1) });
            game.enemyBullets.push({ x: m.x + 15, y: m.y, vx: 60, vy: 200 * (CFG.difficulty[game.level] || 1) });
          }
        }
      }
    }
    // 超出屏幕底部移除
    if (m.y > H + 60) game.monsters.splice(i, 1);
  }

  // Boss 更新
  if (game.boss) {
    const b = game.boss;
    b.t += dt;
    const diff = CFG.difficulty[game.level] || 1;
    if (b.phase === 'enter') {
      b.y += 60 * dt;
      if (b.y > 110) b.phase = 'fight';
    } else {
      b.atkTimer += dt;
      b.shootCD -= dt;
      // 通用: 特殊攻击计时器 (每 4-5 秒一次)
      const specialCD = 4.2 - diff * 0.3;

      if (b.type === 'voidlord') {
        // 虚空领主: 缓慢横移 + 螺旋弹幕 + 召唤小行星
        b.x = W/2 + Math.sin(b.t * 0.6) * (W * 0.32);
        b.y = 95 + Math.sin(b.t * 1.1) * 18;
        if (b.shootCD <= 0) {
          b.shootCD = 1.5 / diff;
          const arms = 3, perArm = 4, baseAng = b.t * 1.5;
          for (let a = 0; a < arms; a++) {
            for (let k = 0; k < perArm; k++) {
              const ang = baseAng + a * (Math.PI*2/arms) + k * 0.12;
              const sp = 150 + k * 15;
              game.enemyBullets.push({ x:b.x, y:b.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, color:'#aa66ff', radius:4 });
            }
          }
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          for (let i = 0; i < 4; i++) {
            const ax = rand(W*0.15, W*0.85);
            game.enemyBullets.push({ x:ax, y:-20, vx:rand(-20,20), vy:rand(140,200), color:'#888899', radius:9 });
          }
        }
      } else if (b.type === 'leviathan') {
        // 深海利维坦: 上下浮动 + 瞄准水柱 + 气泡环爆
        b.x = W/2 + Math.sin(b.t * 0.7) * (W * 0.25);
        b.y = 80 + Math.sin(b.t * 1.5) * 30;
        if (b.shootCD <= 0) {
          b.shootCD = 1.3 / diff;
          const dx = player.x - b.x, dy = player.y - b.y;
          const d = Math.max(Math.hypot(dx,dy), 0.001);
          const baseAng = Math.atan2(dy, dx);
          for (let k = -1; k <= 1; k++) {
            const ang = baseAng + k * 0.12;
            game.enemyBullets.push({ x:b.x, y:b.y+20, vx:Math.cos(ang)*260, vy:Math.sin(ang)*260, color:'#44aaff', radius:6 });
          }
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          const count = 14;
          for (let i = 0; i < count; i++) {
            const ang = (i / count) * Math.PI * 2;
            game.enemyBullets.push({ x:b.x, y:b.y, vx:Math.cos(ang)*120, vy:Math.sin(ang)*120, color:'#88ddff', radius:5 });
          }
        }
      } else if (b.type === 'colossus') {
        // 沙暴巨像: 基本不动 + 追踪沙旋 + 落石雨
        b.x = W/2 + Math.sin(b.t * 0.4) * 40;
        b.y = 100 + Math.sin(b.t * 0.9) * 12;
        if (b.shootCD <= 0) {
          b.shootCD = 1.7 / diff;
          const dx = player.x - b.x, dy = player.y - b.y;
          const d = Math.max(Math.hypot(dx,dy), 0.001);
          game.enemyBullets.push({ x:b.x, y:b.y+20, vx:dx/d*140, vy:dy/d*140, color:'#ddaa55', radius:7, homing:120 });
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          for (let i = 0; i < 6; i++) {
            const rx = rand(W*0.1, W*0.9);
            game.enemyBullets.push({ x:rx, y:-20, vx:rand(-15,15), vy:rand(160,220), color:'#aa7744', radius:8 });
          }
        }
      } else if (b.type === 'dragon') {
        // 机械巨龙: 横扫 + 火焰锥 + 陨石火球
        b.x = W/2 + Math.sin(b.t * 0.9) * (W * 0.35);
        b.y = 90 + Math.sin(b.t * 1.3) * 22;
        if (b.shootCD <= 0) {
          b.shootCD = 1.2 / diff;
          const dx = player.x - b.x, dy = player.y - b.y;
          const baseAng = Math.atan2(dy, dx);
          for (let k = -3; k <= 3; k++) {
            const ang = baseAng + k * 0.16;
            game.enemyBullets.push({ x:b.x, y:b.y+10, vx:Math.cos(ang)*230, vy:Math.sin(ang)*230, color:'#ff6622', radius:5 });
          }
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          for (let i = 0; i < 3; i++) {
            const mx = b.x + (i-1) * 80;
            game.enemyBullets.push({ x:mx, y:b.y, vx:rand(-30,30), vy:160, color:'#ff3300', radius:10, split:true, splitCount:6, splitSpeed:200 });
          }
        }
      } else if (b.type === 'guardian') {
        // 月面守护者: 慢速横移 + 预判激光 + 导弹齐射
        b.x = W/2 + Math.sin(b.t * 0.5) * (W * 0.28);
        b.y = 85 + Math.sin(b.t * 1.0) * 15;
        if (b.shootCD <= 0) {
          b.shootCD = 1.1 / diff;
          // 预判瞄准: 朝玩家未来位置
          const lead = 0.25;
          const tx = player.x + (player.x - b.x) * lead;
          const ty = player.y + (player.y - b.y) * lead;
          const dx = tx - b.x, dy = ty - b.y;
          const d = Math.max(Math.hypot(dx,dy), 0.001);
          const ang = Math.atan2(dy, dx);
          for (let k = -1; k <= 1; k += 2) {
            game.enemyBullets.push({ x:b.x + k*18, y:b.y, vx:Math.cos(ang)*340, vy:Math.sin(ang)*340, color:'#00ffff', radius:4 });
          }
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          for (let i = 0; i < 5; i++) {
            const ang = -Math.PI/2 + (i-2) * 0.25;
            game.enemyBullets.push({ x:b.x, y:b.y+10, vx:Math.cos(ang)*160, vy:Math.sin(ang)*160, color:'#ffaa00', radius:5, homing:80 });
          }
        }
      } else if (b.type === 'beastking') {
        // 百兽之王: 投石扇形 + 冲撞碾压
        b.x = W/2 + Math.sin(b.t * 0.5) * (W * 0.3);
        b.y = 90 + Math.sin(b.t * 0.8) * 16;
        if (b.shootCD <= 0) {
          b.shootCD = 1.4 / diff;
          for (let k = -2; k <= 2; k++) {
            const ang = -Math.PI/2 + k * 0.22;
            game.enemyBullets.push({ x:b.x, y:b.y+15, vx:Math.cos(ang)*210, vy:Math.sin(ang)*210, color:'#a07040', radius:6 });
          }
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          // 冲撞: 快速移动到玩家位置
          b.charging = true;
          b.chargeX = player.x;
          b.chargeY = player.y;
          const dx = b.chargeX - b.x, dy = b.chargeY - b.y;
          const d = Math.max(Math.hypot(dx,dy), 0.001);
          b.vx = dx / d * 650;
          b.vy = dy / d * 650;
        }
        if (b.charging) {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.y > b.chargeY || Math.abs(b.x - b.chargeX) < 20) {
            b.charging = false;
            b.y = clamp(b.y, 70, 140);
          }
          b.x = clamp(b.x, 30, W-30);
        }
      } else if (b.type === 'vinetitan') {
        // 藤蔓巨怪: 毒雾扇形 + 种子炸弹
        b.x = W/2 + Math.sin(b.t * 0.45) * (W * 0.3);
        b.y = 95 + Math.sin(b.t * 0.9) * 14;
        if (b.shootCD <= 0) {
          b.shootCD = 1.3 / diff;
          for (let k = -3; k <= 3; k++) {
            const ang = -Math.PI/2 + k * 0.18;
            game.enemyBullets.push({ x:b.x, y:b.y+15, vx:Math.cos(ang)*190, vy:Math.sin(ang)*190, color:'#66ff44', radius:5 });
          }
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          for (let i = 0; i < 4; i++) {
            const sx = b.x + (i-1.5) * 70;
            game.enemyBullets.push({ x:sx, y:b.y, vx:rand(-20,20), vy:150, color:'#88dd22', radius:9, split:true, splitCount:5, splitSpeed:180 });
          }
        }
      } else if (b.type === 'kraken') {
        // 深渊海妖: 环形移动 + 电弧环爆 + 触手打击
        b.x = W/2 + Math.cos(b.t * 0.6) * (W * 0.25);
        b.y = 95 + Math.sin(b.t * 0.9) * 18;
        if (b.shootCD <= 0) {
          b.shootCD = 0.9 / diff;
          const count = 12;
          for (let i = 0; i < count; i++) {
            const ang = (i / count) * Math.PI * 2 + b.t * 0.5;
            game.enemyBullets.push({ x:b.x, y:b.y, vx:Math.cos(ang)*170, vy:Math.sin(ang)*170, color:'#ff66cc', radius:5 });
          }
        }
        if (b.atkTimer >= specialCD) {
          b.atkTimer = 0;
          // 触手打击: 3个垂直区域落弹
          for (let i = 0; i < 3; i++) {
            const zx = W * (0.2 + i * 0.3) + rand(-30, 30);
            for (let k = 0; k < 6; k++) {
              game.enemyBullets.push({ x:zx + rand(-15,15), y:-20 - k*30, vx:0, vy:280, color:'#ff44aa', radius:5 });
            }
          }
        }
      }
    }
  }
}

/* ==================== 关卡波次 ==================== */
function updateWaves(dt) {
  if (game.bossActive || game.bossPending) return;
  const lv = LEVELS[game.level];

  // 1) 按时间推进波次
  if (game.waveIdx < lv.waves.length) {
    if (game.time >= lv.waves[game.waveIdx].t) {
      spawnWave(lv.waves[game.waveIdx]);
      game.waveIdx++;
    }
  }

  // 2) 连续补怪: 场上怪兽过少时零星补 1-2 只，消除批次间空白感
  //    仅在还有波次未出时补怪，波次全部出完后停手以便清场触发 Boss
  const keepMin = 4; // 场上至少保持的怪兽数
  if (game.waveIdx < lv.waves.length && game.monsters.length < keepMin) {
    game.trickleTimer -= dt;
    if (game.trickleTimer <= 0) {
      spawnTrickle(lv);
      game.trickleTimer = rand(1.4, 2.6) / (CFG.difficulty[game.level] || 1);
    }
  } else {
    game.trickleTimer = 0;
  }

  // 3) 所有波次结束且怪兽清空 → 触发 Boss 预告（而非直接生成）
  if (game.waveIdx >= lv.waves.length && game.monsters.length === 0) {
    if (lv.boss) {
      triggerBossIntro(lv.boss);
    } else {
      endLevel(true);
    }
  }
}

// 零星补怪: 从本关波次中随机选一种类型，生成 1-2 只
function spawnTrickle(lv) {
  const types = [...new Set(lv.waves.map(w => w.type))];
  const type = types[Math.floor(Math.random() * types.length)];
  const cfg = MONSTER_TYPES[type];
  const diff = CFG.difficulty[game.level] || 1;
  const count = Math.random() < 0.35 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const x = clamp(rand(W * 0.15, W * 0.85), 40, W - 40);
    const shootInt = cfg.shoot ? cfg.shootInterval / diff : 0;
    game.monsters.push({
      type, x, y: -50 - i * 40,
      vx: rand(-30, 30) * diff, vy: cfg.speed * CFG.baseMonsterSpeed * diff,
      hp: cfg.hp, maxHp: cfg.hp, size: cfg.size, score: cfg.score,
      shootCD: cfg.shoot ? rand(0.5, shootInt) : 0, shootInterval: shootInt,
      t: Math.random() * Math.PI * 2, pattern: 'wave', phase: 'enter',
    });
  }
}

/* ==================== 背景绘制 (多层视差) ==================== */
function drawBackground(dt) {
  const lv = LEVELS[game.level];
  // 渐变天空
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, lv.bg[0]);
  g.addColorStop(0.5, lv.bg[1]);
  g.addColorStop(1, lv.bg[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 视差远景层
  drawFarLayer(lv.ground, lv);

  // 星空/粒子 (中景)
  for (const s of game.stars) {
    s.y += s.speed * dt;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // 地形 (近景底部)
  if (lv.ground) drawGround(lv.ground);
}

// 远景层: 每关独特的视差元素
function drawFarLayer(type, lv) {
  const off = (game.time * 20) % W;
  const off2 = (game.time * 8) % W;
  ctx.save();
  if (type === null) {
    // 太空: 星云带 + 行星(带环) + 小行星带 + 银河
    // 紫色星云
    ctx.globalAlpha = 0.18;
    const n1 = ctx.createRadialGradient(W*0.25-off*0.15, H*0.25, 10, W*0.25-off*0.15, H*0.25, 120);
    n1.addColorStop(0,'#6644ff'); n1.addColorStop(1,'rgba(60,30,120,0)');
    ctx.fillStyle = n1; ctx.fillRect(0,0,W,H);
    // 粉色星云
    const n2 = ctx.createRadialGradient(W*0.75-off*0.1, H*0.4, 10, W*0.75-off*0.1, H*0.4, 100);
    n2.addColorStop(0,'#ff4488'); n2.addColorStop(1,'rgba(120,30,60,0)');
    ctx.fillStyle = n2; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
    // 带环行星 (右上角)
    const px = W*0.82 - off*0.08, py = H*0.18;
    const pg = ctx.createRadialGradient(px-12,py-8,3, px,py,42);
    pg.addColorStop(0,'#ffcc66'); pg.addColorStop(0.6,'#cc7733'); pg.addColorStop(1,'#663311');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(px,py,38,0,Math.PI*2); ctx.fill();
    // 行星环
    ctx.strokeStyle = 'rgba(255,200,120,0.5)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(px,py,58,14,0.4,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,150,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(px,py,66,17,0.4,0,Math.PI*2); ctx.stroke();
    // 小行星带 (远处, 横向)
    ctx.fillStyle = 'rgba(180,160,140,0.5)';
    for (let i = 0; i < 20; i++) {
      const ax = (i*73 - off*0.5) % W;
      const ay = H*0.55 + Math.sin(i*1.3)*30;
      const as = 1.5 + (i%3);
      ctx.beginPath(); ctx.arc(ax,ay,as,0,Math.PI*2); ctx.fill();
    }
    // 远处小蓝行星
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#4488ff';
    ctx.beginPath(); ctx.arc(W*0.15-off*0.05, H*0.6, 14, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (type === 'ocean') {
    // 海洋: 水下光柱(上帝之光) + 鱼群剪影 + 海草
    // 光柱
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 5; i++) {
      const lx = W*(0.1+i*0.2) - off2*0.3;
      const grad = ctx.createLinearGradient(lx,0, lx+30, H*0.7);
      grad.addColorStop(0,'#88ccff'); grad.addColorStop(1,'rgba(100,180,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(lx-15,0); ctx.lineTo(lx+15,0);
      ctx.lineTo(lx+45, H*0.7); ctx.lineTo(lx-45, H*0.7);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 远处鱼群剪影
    ctx.fillStyle = 'rgba(0,30,60,0.4)';
    for (let i = 0; i < 12; i++) {
      const fx = (i*60 - off*0.6) % (W+40) - 20;
      const fy = H*0.3 + Math.sin(i*0.9+game.time)*40;
      ctx.beginPath(); ctx.ellipse(fx,fy,6,3,0,0,Math.PI*2); ctx.fill();
    }
    // 远处水母剪影
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#aa88ff';
    for (let i = 0; i < 3; i++) {
      const jx = W*(0.2+i*0.3) - off2*0.2;
      const jy = H*0.45 + Math.sin(game.time*0.5+i)*15;
      ctx.beginPath(); ctx.arc(jx,jy,12,Math.PI,0); ctx.fill();
      ctx.strokeStyle = 'rgba(170,136,255,0.5)'; ctx.lineWidth = 1;
      for (let k=-2;k<=2;k++){
        ctx.beginPath(); ctx.moveTo(jx+k*4,jy); ctx.lineTo(jx+k*4+Math.sin(game.time+k)*3,jy+18); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  } else if (type === 'desert') {
    // 沙漠: 多层沙丘视差 + 金字塔 + 废墟 + 烈日
    // 远处沙丘 (最淡)
    ctx.fillStyle = 'rgba(140,100,50,0.35)';
    ctx.beginPath();
    ctx.moveTo(0,H*0.55);
    for (let x=0;x<=W;x+=30) ctx.lineTo(x, H*0.55 + Math.sin(x*0.008+1)*25);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
    // 金字塔
    ctx.fillStyle = 'rgba(120,80,40,0.6)';
    let ppx = W*0.25 - off*0.3;
    ctx.beginPath(); ctx.moveTo(ppx,H*0.58); ctx.lineTo(ppx+55,H*0.38); ctx.lineTo(ppx+110,H*0.58); ctx.closePath(); ctx.fill();
    // 金字塔阴影面
    ctx.fillStyle = 'rgba(80,50,20,0.6)';
    ctx.beginPath(); ctx.moveTo(ppx+55,H*0.38); ctx.lineTo(ppx+110,H*0.58); ctx.lineTo(ppx+55,H*0.58); ctx.closePath(); ctx.fill();
    // 小金字塔
    ppx = W*0.7 - off*0.3;
    ctx.fillStyle = 'rgba(120,80,40,0.5)';
    ctx.beginPath(); ctx.moveTo(ppx,H*0.6); ctx.lineTo(ppx+38,H*0.44); ctx.lineTo(ppx+76,H*0.6); ctx.closePath(); ctx.fill();
    // 方尖碑/废墟
    ctx.fillStyle = 'rgba(100,70,35,0.6)';
    for (let i=0;i<3;i++){
      const rx = (W*0.1+i*W*0.35 - off*0.4) % (W+60) - 30;
      ctx.fillRect(rx, H*0.55, 5, 25);
      ctx.fillRect(rx-4, H*0.55, 13, 4);
    }
    // 中景沙丘
    ctx.fillStyle = 'rgba(160,115,60,0.5)';
    ctx.beginPath();
    ctx.moveTo(0,H*0.68);
    for (let x=0;x<=W;x+=25) ctx.lineTo(x, H*0.68 + Math.sin(x*0.015+2)*18);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
  } else if (type === 'mars') {
    // 火星: 奥林匹斯山 + 峡谷 + 尘暴 + 岩石
    // 远处巨型火山
    ctx.fillStyle = 'rgba(100,35,15,0.6)';
    ctx.beginPath();
    ctx.moveTo(W*0.3-off*0.15, H*0.55);
    ctx.lineTo(W*0.42-off*0.15, H*0.25);
    ctx.lineTo(W*0.46-off*0.15, H*0.22);
    ctx.lineTo(W*0.5-off*0.15, H*0.25);
    ctx.lineTo(W*0.62-off*0.15, H*0.55);
    ctx.closePath(); ctx.fill();
    // 火山口
    ctx.fillStyle = 'rgba(60,15,5,0.6)';
    ctx.beginPath(); ctx.ellipse(W*0.46-off*0.15, H*0.24, 16, 5, 0, 0, Math.PI*2); ctx.fill();
    // 远处山脉
    ctx.fillStyle = 'rgba(90,30,15,0.5)';
    ctx.beginPath();
    ctx.moveTo(0,H*0.6);
    for (let x=0;x<=W;x+=40) ctx.lineTo(x, H*0.6 + Math.sin(x*0.01+1)*30 - 20);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
    // 尘暴 (横向半透明带)
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#cc6644';
    for (let i=0;i<3;i++){
      ctx.fillRect(0, H*(0.3+i*0.12)+Math.sin(game.time+i)*10, W, 18);
    }
    ctx.globalAlpha = 1;
  } else if (type === 'moon') {
    // 月球: 巨大地球 + 月面基地 + 环形山剪影
    // 地球 (大, 带大气辉光)
    const earthX = W*0.78 - off*0.05, earthY = H*0.16;
    const eGlow = ctx.createRadialGradient(earthX,earthY,40, earthX,earthY,70);
    eGlow.addColorStop(0,'rgba(100,180,255,0.3)'); eGlow.addColorStop(1,'rgba(100,180,255,0)');
    ctx.fillStyle = eGlow; ctx.beginPath(); ctx.arc(earthX,earthY,70,0,Math.PI*2); ctx.fill();
    const eg = ctx.createRadialGradient(earthX-15,earthY-15,5, earthX,earthY,40);
    eg.addColorStop(0,'#5599ff'); eg.addColorStop(0.5,'#3366cc'); eg.addColorStop(0.8,'#225544'); eg.addColorStop(1,'#1a3366');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(earthX,earthY,40,0,Math.PI*2); ctx.fill();
    // 地球大陆斑
    ctx.fillStyle = 'rgba(60,140,60,0.7)';
    ctx.beginPath(); ctx.ellipse(earthX-8,earthY-5,10,7,0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(earthX+10,earthY+8,8,5,-0.2,0,Math.PI*2); ctx.fill();
    // 远处月面基地剪影
    ctx.fillStyle = 'rgba(80,80,90,0.5)';
    const bx = W*0.2 - off*0.2;
    ctx.fillRect(bx, H*0.62, 30, 8);
    ctx.beginPath(); ctx.arc(bx+15, H*0.62, 8, Math.PI, 0); ctx.fill();
    ctx.fillRect(bx+6, H*0.56, 3, 6); ctx.fillRect(bx+21, H*0.56, 3, 6);
    // 天线
    ctx.strokeStyle = 'rgba(120,120,140,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx+15, H*0.56); ctx.lineTo(bx+15, H*0.48); ctx.stroke();
    ctx.fillStyle = 'rgba(120,120,140,0.5)';
    ctx.beginPath(); ctx.arc(bx+15, H*0.48, 2, 0, Math.PI*2); ctx.fill();
  } else if (type === 'savanna') {
    // 草原: 金合欢树(平顶) + 落日 + 白蚁丘 + 动物剪影
    // 落日
    ctx.globalAlpha = 0.9;
    const sunG = ctx.createRadialGradient(W*0.5,H*0.32,5, W*0.5,H*0.32,50);
    sunG.addColorStop(0,'#ffee88'); sunG.addColorStop(0.5,'#ffaa33'); sunG.addColorStop(1,'rgba(255,120,30,0)');
    ctx.fillStyle = sunG;
    ctx.beginPath(); ctx.arc(W*0.5,H*0.32,50,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath(); ctx.arc(W*0.5,H*0.32,28,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    // 金合欢树 (平顶剪影)
    ctx.fillStyle = 'rgba(40,25,10,0.65)';
    for (let i=0;i<5;i++){
      const tx = (i*W/4 + 40 - off*0.2) % (W+120) - 60;
      const th = 45 + (i%2)*15;
      ctx.fillRect(tx, H*0.62-th+12, 4, th-12);
      // 平顶树冠
      ctx.beginPath(); ctx.ellipse(tx+2, H*0.62-th+10, 24, 7, 0, 0, Math.PI*2); ctx.fill();
      // 分枝
      ctx.beginPath(); ctx.moveTo(tx+2,H*0.62-th+14); ctx.lineTo(tx-10,H*0.62-th+6); ctx.lineTo(tx+14,H*0.62-th+6); ctx.closePath(); ctx.fill();
    }
    // 远处动物剪影
    ctx.fillStyle = 'rgba(30,20,8,0.5)';
    for (let i=0;i<3;i++){
      const ax = (i*W/3 + 100 - off*0.35) % (W+60) - 30;
      const ay = H*0.66;
      // 身体
      ctx.beginPath(); ctx.ellipse(ax,ay,12,5,0,0,Math.PI*2); ctx.fill();
      // 头颈
      ctx.beginPath(); ctx.arc(ax+10,ay-4,4,0,Math.PI*2); ctx.fill();
      // 腿
      ctx.fillRect(ax-6,ay,2,8); ctx.fillRect(ax+4,ay,2,8);
    }
    // 白蚁丘
    ctx.fillStyle = 'rgba(90,60,30,0.5)';
    for (let i=0;i<2;i++){
      const mx = (W*0.3+i*W*0.5 - off*0.3) % (W+60) - 30;
      ctx.beginPath(); ctx.moveTo(mx,H*0.68); ctx.lineTo(mx+6,H*0.52); ctx.lineTo(mx+12,H*0.68); ctx.closePath(); ctx.fill();
    }
  } else if (type === 'jungle') {
    // 雨林: 浓密树冠层 + 藤蔓 + 雾气 + 瀑布
    // 远处树冠 (多层)
    ctx.fillStyle = 'rgba(10,40,20,0.7)';
    for (let x=0;x<W;x+=30){
      const th = 30 + Math.sin(x*0.04)*15;
      ctx.beginPath(); ctx.arc(x, H*0.5, th, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(20,60,30,0.6)';
    for (let x=15;x<W;x+=30){
      const th = 25 + Math.sin(x*0.06)*10;
      ctx.beginPath(); ctx.arc(x, H*0.58, th, 0, Math.PI*2); ctx.fill();
    }
    // 藤蔓 (从顶部垂下)
    ctx.strokeStyle = 'rgba(30,80,40,0.6)'; ctx.lineWidth = 2;
    for (let i=0;i<8;i++){
      const vx = (i*W/8 + 20 - off2*0.3) % W;
      ctx.beginPath();
      ctx.moveTo(vx, 0);
      for (let y=0;y<H*0.5;y+=20){
        ctx.lineTo(vx + Math.sin(y*0.05+i)*6, y);
      }
      ctx.stroke();
      // 藤蔓叶
      ctx.fillStyle = 'rgba(50,120,50,0.6)';
      ctx.beginPath(); ctx.ellipse(vx+3, H*0.3+Math.sin(i)*10, 4, 2, 0.5, 0, Math.PI*2); ctx.fill();
    }
    // 雾气 (中景横向带)
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#88bb88';
    ctx.fillRect(0, H*0.55, W, 30);
    ctx.globalAlpha = 1;
  } else if (type === 'neptune') {
    // 海王星: 多层极光 + 浮冰 + 风暴涡旋
    // 极光层 1 (绿)
    ctx.globalAlpha = 0.22;
    let ag = ctx.createLinearGradient(0,0,W,0);
    ag.addColorStop(0,'#00ff88'); ag.addColorStop(0.5,'#00ddff'); ag.addColorStop(1,'#4488ff');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(0,H*0.08);
    for (let x=0;x<=W;x+=15) ctx.lineTo(x, H*0.08 + Math.sin(x*0.012+game.time*0.8)*18);
    ctx.lineTo(W,H*0.22);
    for (let x=W;x>=0;x-=15) ctx.lineTo(x, H*0.22 + Math.sin(x*0.018+game.time*0.5)*12);
    ctx.closePath(); ctx.fill();
    // 极光层 2 (紫)
    ag = ctx.createLinearGradient(0,H*0.1,W,H*0.1);
    ag.addColorStop(0,'#aa44ff'); ag.addColorStop(0.5,'#ff44aa'); ag.addColorStop(1,'#8844ff');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(0,H*0.16);
    for (let x=0;x<=W;x+=15) ctx.lineTo(x, H*0.16 + Math.sin(x*0.02+game.time*1.2+1)*14);
    ctx.lineTo(W,H*0.28);
    for (let x=W;x>=0;x-=15) ctx.lineTo(x, H*0.28 + Math.sin(x*0.015+game.time*0.7+1)*10);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // 远处风暴涡旋
    ctx.globalAlpha = 0.25;
    const sg = ctx.createRadialGradient(W*0.3,H*0.45,5, W*0.3,H*0.45,50);
    sg.addColorStop(0,'#ffffff'); sg.addColorStop(0.5,'#88bbff'); sg.addColorStop(1,'rgba(80,120,200,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(W*0.3,H*0.45,50,0,Math.PI*2); ctx.fill();
    // 涡旋旋臂
    ctx.strokeStyle = 'rgba(200,220,255,0.3)'; ctx.lineWidth = 2;
    for (let i=0;i<3;i++){
      ctx.beginPath();
      for (let a=0;a<Math.PI*2;a+=0.1){
        const r = 8 + a*7;
        const px = W*0.3 + Math.cos(a+game.time+i)*r;
        const py = H*0.45 + Math.sin(a+game.time+i)*r*0.6;
        if (a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 浮冰 (远处)
    ctx.fillStyle = 'rgba(200,220,255,0.4)';
    for (let i=0;i<5;i++){
      const ix = (i*W/5 + off2*0.4) % (W+60) - 30;
      ctx.beginPath();
      ctx.moveTo(ix,H*0.62); ctx.lineTo(ix+15,H*0.58); ctx.lineTo(ix+30,H*0.62);
      ctx.lineTo(ix+25,H*0.66); ctx.lineTo(ix+5,H*0.66);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function drawGround(type) {
  const gy = H * 0.82;
  ctx.save();
  if (type === 'ocean') {
    // 海洋: 深水 + 多层波浪 + 气泡 + 海底珊瑚
    const og = ctx.createLinearGradient(0, gy, 0, H);
    og.addColorStop(0, '#004477'); og.addColorStop(0.5, '#002855'); og.addColorStop(1, '#001133');
    ctx.fillStyle = og;
    ctx.fillRect(0, gy, W, H - gy);
    // 海面高光带
    ctx.fillStyle = 'rgba(100,200,255,0.15)';
    ctx.fillRect(0, gy, W, 3);
    // 波浪线 (多层)
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(0,${130+i*20},${200+i*10},${0.5-i*0.07})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8) {
        ctx.lineTo(x, gy + 4 + i * 11 + Math.sin(game.time * 2 + x * 0.035 + i * 0.8) * (4 - i*0.5));
      }
      ctx.stroke();
    }
    // 气泡
    ctx.fillStyle = 'rgba(150,220,255,0.3)';
    for (let i = 0; i < 10; i++) {
      const bx = (i * 73 + game.time * 25) % W;
      const by = gy + 8 + ((i * 19 + game.time * 45) % (H - gy - 16));
      ctx.beginPath(); ctx.arc(bx, by, 1.5 + i % 3, 0, Math.PI*2); ctx.fill();
    }
    // 海底珊瑚/礁石剪影
    ctx.fillStyle = 'rgba(0,15,40,0.6)';
    for (let i = 0; i < 6; i++) {
      const cx = (i * W/6 + 20) % W;
      ctx.beginPath();
      ctx.moveTo(cx, H); ctx.lineTo(cx-8, H-12); ctx.lineTo(cx-4, H-20);
      ctx.lineTo(cx, H-16); ctx.lineTo(cx+4, H-22); ctx.lineTo(cx+8, H-12);
      ctx.closePath(); ctx.fill();
    }
    // 海草 (从底部摇摆)
    ctx.strokeStyle = 'rgba(20,80,50,0.5)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const sx = (i * W/8 + 10) % W;
      ctx.beginPath();
      ctx.moveTo(sx, H);
      for (let y = H; y > H-25; y -= 4) {
        ctx.lineTo(sx + Math.sin((H-y)*0.2 + game.time*1.5 + i) * 4, y);
      }
      ctx.stroke();
    }
  } else if (type === 'desert') {
    // 沙漠: 沙丘 + 沙粒 + 仙人掌 + 骨头
    const dg = ctx.createLinearGradient(0, gy, 0, H);
    dg.addColorStop(0, '#d8a868'); dg.addColorStop(0.5, '#b07838'); dg.addColorStop(1, '#7a4820');
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    for (let x = 0; x <= W; x += 18) ctx.lineTo(x, gy + Math.sin(x * 0.022 + 1) * 10);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    // 沙丘脊线高光
    ctx.strokeStyle = 'rgba(255,220,160,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 18) {
      const yy = gy + Math.sin(x * 0.022 + 1) * 10;
      if (x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.stroke();
    // 沙粒纹理
    ctx.fillStyle = 'rgba(255,220,150,0.2)';
    for (let i = 0; i < 35; i++) {
      ctx.fillRect((i * 37 + game.time * 8) % W, gy + 6 + (i * 13) % (H - gy - 8), 2, 2);
    }
    // 仙人掌
    ctx.fillStyle = '#3a6a2a';
    for (let i = 0; i < 2; i++) {
      const cx = (W*0.15 + i*W*0.6) % W;
      ctx.fillRect(cx, gy-18, 4, 18);
      ctx.fillRect(cx-6, gy-12, 5, 3); ctx.fillRect(cx-6, gy-12, 3, 8);
      ctx.fillRect(cx+5, gy-14, 5, 3); ctx.fillRect(cx+7, gy-14, 3, 10);
    }
    // 骨头/骷髅
    ctx.fillStyle = 'rgba(230,220,190,0.6)';
    const bx = (W*0.7 + Math.sin(game.time*0.1)*10) % W;
    ctx.beginPath(); ctx.ellipse(bx, gy-3, 6, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx-5, gy-3, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+5, gy-3, 2, 0, Math.PI*2); ctx.fill();
  } else if (type === 'mars') {
    // 火星: 红色地表 + 陨石坑(带高光) + 岩石 + 沙尘
    const mg = ctx.createLinearGradient(0, gy, 0, H);
    mg.addColorStop(0, '#bb4433'); mg.addColorStop(0.5, '#882218'); mg.addColorStop(1, '#441108');
    ctx.fillStyle = mg;
    ctx.fillRect(0, gy, W, H - gy);
    // 地表起伏
    ctx.fillStyle = 'rgba(150,40,25,0.4)';
    ctx.beginPath();
    ctx.moveTo(0, gy);
    for (let x=0;x<=W;x+=20) ctx.lineTo(x, gy+Math.sin(x*0.03)*6);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
    // 陨石坑 (带边缘高光)
    for (let i = 0; i < 5; i++) {
      const cx = (i * 89 + 20) % W;
      const cy = gy + 14 + i * 10;
      const cr = 14 + (i%3)*4;
      ctx.fillStyle = 'rgba(50,10,5,0.6)';
      ctx.beginPath(); ctx.ellipse(cx, cy, cr, cr*0.4, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(200,80,50,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(cx, cy, cr, cr*0.4, 0, 0, Math.PI*2); ctx.stroke();
    }
    // 岩石 (棱角状)
    for (let i = 0; i < 5; i++) {
      const rx = (i * 110 + 40) % W;
      ctx.fillStyle = '#772218';
      ctx.beginPath();
      ctx.moveTo(rx, gy+4); ctx.lineTo(rx-6, gy-6); ctx.lineTo(rx-2, gy-10);
      ctx.lineTo(rx+4, gy-8); ctx.lineTo(rx+7, gy-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(120,40,25,0.5)';
      ctx.beginPath(); ctx.moveTo(rx,gy+4); ctx.lineTo(rx+7,gy-2); ctx.lineTo(rx+4,gy+2); ctx.closePath(); ctx.fill();
    }
    // 沙尘粒子
    ctx.fillStyle = 'rgba(200,120,80,0.3)';
    for (let i = 0; i < 15; i++) {
      const sx = (i * 53 + game.time * 40) % W;
      const sy = gy + 4 + (i * 11) % (H - gy - 8);
      ctx.fillRect(sx, sy, 2, 1);
    }
  } else if (type === 'moon') {
    // 月球: 灰色地表 + 陨石坑(立体) + 车辙 + 岩石
    const mg = ctx.createLinearGradient(0, gy, 0, H);
    mg.addColorStop(0, '#aaaaaa'); mg.addColorStop(1, '#666666');
    ctx.fillStyle = mg;
    ctx.fillRect(0, gy, W, H - gy);
    // 陨石坑 (立体感: 暗底+亮缘)
    for (let i = 0; i < 10; i++) {
      const cx = (i * 57 + 10) % W;
      const cy = gy + 8 + (i * 17) % (H - gy - 18);
      const cr = 3 + (i % 4) * 2.5;
      ctx.fillStyle = 'rgba(60,60,60,0.7)';
      ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(180,180,180,0.6)';
      ctx.beginPath(); ctx.arc(cx-cr*0.3, cy-cr*0.3, cr*0.4, 0, Math.PI*2); ctx.fill();
    }
    // 月面车辙
    ctx.strokeStyle = 'rgba(80,80,80,0.5)'; ctx.lineWidth = 2;
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(0, gy + 20 + i*25);
      for (let x=0;x<=W;x+=15) ctx.lineTo(x, gy+20+i*25+Math.sin(x*0.05+i)*2);
      ctx.stroke();
    }
    // 岩石
    ctx.fillStyle = '#777';
    for (let i = 0; i < 4; i++) {
      const rx = (i * 130 + 50) % W;
      ctx.beginPath(); ctx.arc(rx, gy+10, 3+i%3, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'savanna') {
    // 草原: 草地 + 草丛 + 花 + 土路
    const sg = ctx.createLinearGradient(0, gy, 0, H);
    sg.addColorStop(0, '#7a9a4a'); sg.addColorStop(0.5, '#5a7a2a'); sg.addColorStop(1, '#3a5a1a');
    ctx.fillStyle = sg;
    ctx.fillRect(0, gy, W, H - gy);
    // 土路 (横向)
    ctx.fillStyle = 'rgba(120,90,50,0.4)';
    ctx.beginPath();
    ctx.moveTo(0, gy+18);
    for (let x=0;x<=W;x+=20) ctx.lineTo(x, gy+18+Math.sin(x*0.04)*4);
    ctx.lineTo(W, gy+30);
    for (let x=W;x>=0;x-=20) ctx.lineTo(x, gy+30+Math.sin(x*0.04+1)*3);
    ctx.closePath(); ctx.fill();
    // 草丛
    ctx.strokeStyle = '#9aca5a'; ctx.lineWidth = 1.5;
    for (let x = 0; x < W; x += 7) {
      const gh = 5 + Math.sin(x * 0.12) * 3;
      ctx.beginPath();
      ctx.moveTo(x, gy); ctx.lineTo(x - 2, gy - gh); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, gy); ctx.lineTo(x + 2, gy - gh); ctx.stroke();
    }
    // 小花
    for (let i = 0; i < 6; i++) {
      const fx = (i * 73 + 30) % W;
      const fy = gy + 3 + (i%3)*8;
      ctx.fillStyle = ['#ff6688','#ffdd44','#ffffff'][i%3];
      ctx.beginPath(); ctx.arc(fx, fy, 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath(); ctx.arc(fx, fy, 0.8, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'jungle') {
    // 雨林: 深色地面 + 蕨类 + 落叶 + 蘑菇
    const jg = ctx.createLinearGradient(0, gy, 0, H);
    jg.addColorStop(0, '#2a6a3a'); jg.addColorStop(0.5, '#1a4a2a'); jg.addColorStop(1, '#0a2a1a');
    ctx.fillStyle = jg;
    ctx.fillRect(0, gy, W, H - gy);
    // 蕨类植物 (多层叶片)
    for (let x = 0; x < W; x += 18) {
      ctx.fillStyle = '#3a8a4a';
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x - 5, gy - 12); ctx.lineTo(x, gy - 7); ctx.lineTo(x + 5, gy - 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2a6a38';
      ctx.beginPath();
      ctx.moveTo(x, gy); ctx.lineTo(x-3, gy-8); ctx.lineTo(x, gy-5); ctx.lineTo(x+3, gy-8);
      ctx.closePath(); ctx.fill();
    }
    // 蘑菇
    for (let i = 0; i < 3; i++) {
      const mx = (i * 90 + 40) % W;
      ctx.fillStyle = '#e8d8b8';
      ctx.fillRect(mx-1.5, gy-6, 3, 6);
      ctx.fillStyle = ['#cc3333','#dd6622','#cc4488'][i];
      ctx.beginPath(); ctx.ellipse(mx, gy-6, 5, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(mx-1.5, gy-7, 0.8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx+1.5, gy-6.5, 0.6, 0, Math.PI*2); ctx.fill();
    }
    // 落叶
    ctx.fillStyle = 'rgba(160,210,90,0.4)';
    for (let i = 0; i < 7; i++) {
      ctx.beginPath(); ctx.ellipse((i*60+20)%W, gy+8+i*6, 4, 2, i*0.5, 0, Math.PI*2); ctx.fill();
    }
    // 地面雾气
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#88bb88';
    ctx.fillRect(0, gy-4, W, 8);
    ctx.globalAlpha = 1;
  } else if (type === 'neptune') {
    // 海王星: 冰面 + 冰裂纹 + 冰块 + 冰晶
    const ng = ctx.createLinearGradient(0, gy, 0, H);
    ng.addColorStop(0, '#6a9ada'); ng.addColorStop(0.5, '#3a6aaa'); ng.addColorStop(1, '#1a3a7a');
    ctx.fillStyle = ng;
    ctx.fillRect(0, gy, W, H - gy);
    // 冰面高光
    ctx.fillStyle = 'rgba(200,230,255,0.2)';
    ctx.fillRect(0, gy, W, 2);
    // 冰裂纹 (网状)
    ctx.strokeStyle = 'rgba(200,225,255,0.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const sx = (i*50 + 20) % W;
      ctx.beginPath();
      ctx.moveTo(sx, gy+3);
      ctx.lineTo(sx + 15, gy+18);
      ctx.lineTo(sx + 8, gy+35);
      ctx.lineTo(sx + 20, gy+50);
      ctx.stroke();
      // 分支
      ctx.beginPath();
      ctx.moveTo(sx+15, gy+18); ctx.lineTo(sx+25, gy+22); ctx.stroke();
    }
    // 冰块 (多边形)
    ctx.fillStyle = 'rgba(180,210,255,0.5)';
    for (let i = 0; i < 4; i++) {
      const ix = (i * 90 + 30) % W;
      ctx.beginPath();
      ctx.moveTo(ix, gy+5); ctx.lineTo(ix+12, gy+2);
      ctx.lineTo(ix+18, gy+10); ctx.lineTo(ix+8, gy+16);
      ctx.lineTo(ix-2, gy+12);
      ctx.closePath(); ctx.fill();
    }
    // 冰晶/雪花
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 18; i++) {
      const sx = (i * 43 + game.time * 18) % W;
      const sy = gy + 4 + ((i * 21 + game.time * 28) % (H - gy - 8));
      ctx.beginPath(); ctx.arc(sx, sy, 1.2 + (i%2), 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

/* ==================== HUD ==================== */
function updateHUD() {
  document.getElementById('hLv').textContent = game.level + 1;
  document.getElementById('hSc').textContent = game.score.toLocaleString();
  document.getElementById('hMst').textContent = game.monsters.length + (game.bossActive ? 1 : 0);
  const hp = document.getElementById('hpBar');
  hp.innerHTML = '';
  for (let i = 0; i < CFG.maxHP; i++) {
    const h = document.createElement('div');
    h.className = 'hp' + (i >= player.hp ? ' empty' : '');
    hp.appendChild(h);
  }
  // 武器状态
  const wc = document.getElementById('weaponCell');
  if (player.weapon !== 'normal') {
    wc.style.display = '';
    const names = { laser: '激光', shotgun: '霰弹', rocket: '火箭' };
    const colors = { laser: '#0ff', shotgun: '#fd0', rocket: '#f60' };
    const el = document.getElementById('hWp');
    el.textContent = names[player.weapon] + ' ' + Math.ceil(player.weaponTime) + 's';
    el.style.color = colors[player.weapon];
  } else {
    wc.style.display = 'none';
  }
}

/* ==================== 游戏流程 ==================== */
function startGame(level) {
  game.level = level;
  game.score = 0; game.kills = 0; game.shots = 0; game.hits = 0;
  game.time = 0; game.waveIdx = 0;
  game.monsters = []; game.bullets = []; game.enemyBullets = []; game.particles = [];
  game.powerups = [];
  game.boss = null; game.bossActive = false; game.bossPending = false; game.trickleTimer = 0; game.shake = 0;
  player.x = W / 2; player.y = H - 100;
  player.hp = CFG.maxHP; player.invuln = 0; player.fireCD = 0;
  player.weapon = 'normal'; player.weaponTime = 0;
  initStars(level);
  game.state = 'playing';
  hideAllOverlays();
  document.getElementById('bossBar').classList.remove('show');
  updateHUD();
}

function endLevel(win) {
  game.state = 'over';
  game.overWin = win;
  document.getElementById('overTitle').textContent = win ? '关卡通过!' : '机甲损毁';
  document.getElementById('overTitle').style.color = win ? '#00ff88' : '#ff4444';
  document.getElementById('ovLv').textContent = game.level + 1;
  document.getElementById('ovSc').textContent = game.score.toLocaleString();
  document.getElementById('ovKill').textContent = game.kills;
  const hitRate = game.shots > 0 ? Math.round(game.hits / game.shots * 100) : 0;
  document.getElementById('ovHit').textContent = hitRate + '%';
  const rank = win ? (hitRate > 60 ? 'S' : hitRate > 40 ? 'A' : 'B') : 'D';
  document.getElementById('rank').textContent = rank;
  document.getElementById('btnNext').style.display = (win && game.level < LEVELS.length - 1) ? '' : 'none';
  document.getElementById('ovOver').classList.remove('hidden');
  // 存档: 解锁下一关 + 记录最高分
  if (win) {
    unlockLevel(game.level + 1);
    recordBest(game.level, game.score);
  }
}

function hideAllOverlays() {
  ['ovTitle','ovLevel','ovPause','ovOver','ovBossIntro'].forEach(id => document.getElementById(id).classList.add('hidden'));
}

function togglePause() {
  if (game.state === 'playing') {
    game.state = 'pause';
    document.getElementById('ovPause').classList.remove('hidden');
  } else if (game.state === 'pause') {
    game.state = 'playing';
    document.getElementById('ovPause').classList.add('hidden');
  }
}

/* ==================== 音频 (Web Audio 合成) ==================== */
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function sfx(type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  if (type === 'shoot') {
    o.type = 'square'; o.frequency.setValueAtTime(880, now); o.frequency.exponentialRampToValueAtTime(440, now+0.08);
    g.gain.setValueAtTime(0.08, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.1);
    o.start(now); o.stop(now+0.1);
  } else if (type === 'explode') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now); o.frequency.exponentialRampToValueAtTime(40, now+0.3);
    g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.35);
    o.start(now); o.stop(now+0.35);
  } else if (type === 'hit') {
    o.type = 'square'; o.frequency.setValueAtTime(300, now); g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.06);
    o.start(now); o.stop(now+0.06);
  } else if (type === 'hurt') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(150, now); o.frequency.exponentialRampToValueAtTime(50, now+0.2);
    g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.25);
    o.start(now); o.stop(now+0.25);
  } else if (type === 'bossDie') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(400, now); o.frequency.exponentialRampToValueAtTime(30, now+0.8);
    g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.9);
    o.start(now); o.stop(now+0.9);
  } else if (type === 'laser') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(1200, now); o.frequency.exponentialRampToValueAtTime(600, now+0.1);
    g.gain.setValueAtTime(0.07, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.12);
    o.start(now); o.stop(now+0.12);
  } else if (type === 'shotgun') {
    o.type = 'square'; o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(60, now+0.15);
    g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    o.start(now); o.stop(now+0.18);
  } else if (type === 'rocket') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(100, now); o.frequency.exponentialRampToValueAtTime(300, now+0.15);
    g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.2);
    o.start(now); o.stop(now+0.2);
  } else if (type === 'powerup') {
    o.type = 'sine'; o.frequency.setValueAtTime(523, now); o.frequency.setValueAtTime(659, now+0.08); o.frequency.setValueAtTime(784, now+0.16);
    g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.3);
    o.start(now); o.stop(now+0.3);
  } else if (type === 'bossWarn') {
    // 低沉警报音 + 上升音
    o.type = 'sawtooth'; o.frequency.setValueAtTime(110, now); o.frequency.linearRampToValueAtTime(220, now+0.25);
    o.frequency.linearRampToValueAtTime(110, now+0.5); o.frequency.linearRampToValueAtTime(330, now+0.75);
    g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.9);
    o.start(now); o.stop(now+0.9);
  }
}

/* ==================== BGM (FM 合成循环) ==================== */
let bgmOn = false;
let bgmTimer = null;
let bgmStep = 0;
// C 小调: 主旋律 & 低音
const BGM_SCALE = [261.63, 293.66, 311.13, 349.23, 392.00, 415.30, 466.16, 523.25];
const BGM_BASS  = [65.41, 65.41, 98.00, 87.31, 73.42, 73.42, 98.00, 82.41];
const BGM_SEQ   = [0,2,4,2, 5,4,2,0, 4,5,7,5, 4,2,0,2]; // 音阶索引

function playNote(freq, time, dur, type, vol) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(time); o.stop(time + dur + 0.05);
}

function bgmTick() {
  if (!bgmOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  const stepDur = 0.18;
  const idx = bgmStep % BGM_SEQ.length;
  // 主旋律
  playNote(BGM_SCALE[BGM_SEQ[idx]], now, stepDur * 1.8, 'triangle', 0.06);
  // 低音 (每 2 步)
  if (bgmStep % 2 === 0) {
    playNote(BGM_BASS[(bgmStep/2) % BGM_BASS.length], now, stepDur * 3.5, 'sawtooth', 0.04);
  }
  // 和声 (每 4 步高八度)
  if (bgmStep % 4 === 2) {
    playNote(BGM_SCALE[BGM_SEQ[idx]] * 2, now, stepDur * 1.5, 'sine', 0.03);
  }
  bgmStep++;
  bgmTimer = setTimeout(bgmTick, stepDur * 1000);
}

function toggleBGM() {
  initAudio();
  bgmOn = !bgmOn;
  const btn = document.getElementById('bgmBtn');
  if (bgmOn) {
    btn.classList.remove('off');
    bgmStep = 0;
    bgmTick();
  } else {
    btn.classList.add('off');
    clearTimeout(bgmTimer);
  }
}

/* ==================== 主循环 ==================== */
let lastT = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  ctx.save();
  // 屏幕震动
  if (game.shake > 0) {
    game.shake -= dt;
    ctx.translate(rand(-6, 6), rand(-6, 6));
  }

  if (game.state === 'playing') {
    game.time += dt;
    update(dt);
  }
  render();
  ctx.restore();
  requestAnimationFrame(loop);
}

function update(dt) {
  // 玩家移动
  const sp = CFG.playerSpeed;
  if (input.left) player.x -= sp * dt;
  if (input.right) player.x += sp * dt;
  if (input.up) player.y -= sp * dt;
  if (input.down) player.y += sp * dt;
  player.x = clamp(player.x, 20, W - 20);
  player.y = clamp(player.y, H * 0.25, H - 40);
  // 倾斜动画
  player.tilt = (input.right ? 1 : 0) - (input.left ? 1 : 0);

  if (player.invuln > 0) player.invuln -= dt;
  player.fireCD -= dt;
  // 武器持续时间
  if (player.weaponTime > 0) {
    player.weaponTime -= dt;
    if (player.weaponTime <= 0) { player.weapon = 'normal'; player.weaponTime = 0; }
  }
  if (input.shoot) fireBullet();

  updateBullets(dt);
  updateMonsters(dt);
  updateWaves(dt);
  updateParticles(dt);
  updatePowerups(dt);
  checkCollisions();
  updateHUD();
}

function render() {
  if (game.state === 'title' || game.state === 'level') {
    // 标题背景
    ctx.fillStyle = '#050a18';
    ctx.fillRect(0, 0, W, H);
    for (const s of game.stars) { s.y += 20 * 0.016; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } ctx.globalAlpha = s.alpha; ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, s.size, s.size); }
    ctx.globalAlpha = 1;
    return;
  }
  if (game.state === 'pause' || game.state === 'over' || game.state === 'bossIntro') {
    // 暂停/结算时保留最后一帧背景
    drawBackground(0.016);
    for (const m of game.monsters) drawMonster(m);
    if (game.boss) drawBoss(game.boss);
    drawPowerups();
    drawPlayer();
    drawBullets();
    drawParticles();
    return;
  }
  drawBackground(0.016);
  for (const m of game.monsters) drawMonster(m);
  if (game.boss) drawBoss(game.boss);
  drawPowerups();
  drawPlayer();
  drawBullets();
  drawParticles();
}

/* ==================== 关卡选择 UI ==================== */
function buildLevelGrid() {
  const grid = document.getElementById('lvGrid');
  grid.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const locked = i >= save.unlocked;
    const best = save.bestScores[i] || 0;
    const d = document.createElement('div');
    d.className = 'lv' + (locked ? ' locked' : '');
    d.innerHTML = `<div class="num">${locked ? '🔒' : i+1}</div><div class="nm">${lv.name}</div>${best > 0 ? `<div class="best">最高 ${best.toLocaleString()}</div>` : ''}`;
    if (!locked) {
      d.addEventListener('click', () => { hideAllOverlays(); startGame(i); });
    }
    grid.appendChild(d);
  });
}

/* ==================== 事件绑定 ==================== */
document.getElementById('btnStart').addEventListener('click', () => { initAudio(); hideAllOverlays(); startGame(0); });
document.getElementById('btnLevel').addEventListener('click', () => { hideAllOverlays(); buildLevelGrid(); document.getElementById('ovLevel').classList.remove('hidden'); });
document.getElementById('btnBack').addEventListener('click', () => { hideAllOverlays(); document.getElementById('ovTitle').classList.remove('hidden'); });
document.getElementById('btnResume').addEventListener('click', togglePause);
document.getElementById('btnQuit').addEventListener('click', () => { game.state = 'title'; hideAllOverlays(); document.getElementById('ovTitle').classList.remove('hidden'); });
document.getElementById('btnNext').addEventListener('click', () => startGame(game.level + 1));
document.getElementById('btnRetry').addEventListener('click', () => startGame(game.level));
document.getElementById('btnMenu').addEventListener('click', () => { game.state = 'title'; hideAllOverlays(); document.getElementById('ovTitle').classList.remove('hidden'); });
document.getElementById('btnBossFight').addEventListener('click', confirmBossBattle);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('bgmBtn').addEventListener('click', toggleBGM);

buildLevelGrid();
initStars(0);
requestAnimationFrame(loop);
</script>
