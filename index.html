<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#050a18" />
<title>机甲大战怪兽 · MECHA VS MONSTERS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#050a18;overflow:hidden;font-family:'Courier New',monospace;color:#fff;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #game{display:block;image-rendering:pixelated;background:#000;}
  /* 扫描线 */
  #scan{position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.12) 0px,rgba(0,0,0,0.12) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply;}
  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:1px 1px 0 #000;}
  .hud-cell{background:rgba(0,20,40,0.6);border:1px solid #0af;padding:4px 10px;font-weight:bold;font-size:clamp(11px,2.8vw,15px);border-radius:3px;letter-spacing:1px;color:#0df;}
  .hud-cell b{color:#fff;}
  #hpBar{display:flex;gap:3px;align-items:center;}
  .hp{width:clamp(10px,2.6vw,16px);height:clamp(10px,2.6vw,16px);background:#ff3050;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);box-shadow:0 0 6px #ff3050;}
  .hp.empty{background:#331020;box-shadow:none;}
  /* 触控 */
  #touchArea{position:fixed;inset:0;z-index:15;display:none;}
  /* 覆盖层 */
  .ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(5,10,30,0.92),rgba(2,4,12,0.98));text-align:center;padding:20px;}
  .ov.hidden{display:none;}
  .title{font-size:clamp(30px,9vw,64px);font-weight:900;color:#00e5ff;
    text-shadow:0 0 20px #00e5ff,0 0 40px #0088ff,3px 3px 0 #003;letter-spacing:0.08em;margin-bottom:4px;}
  .subtitle{font-size:clamp(11px,3.2vw,20px);color:#88ccff;letter-spacing:0.4em;margin-bottom:32px;}
  .btn{padding:12px 40px;font-size:clamp(15px,4vw,20px);font-weight:bold;color:#001;cursor:pointer;
    background:linear-gradient(180deg,#00e5ff,#0099cc);border:2px solid #0ff;border-radius:4px;letter-spacing:2px;
    box-shadow:0 0 18px rgba(0,229,255,0.5),0 4px 0 #003;margin:6px;}
  .btn:active{transform:translateY(3px);box-shadow:0 0 12px rgba(0,229,255,0.4),0 1px 0 #003;}
  .btn.ghost{background:transparent;color:#00e5ff;box-shadow:none;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;width:100%;}
  .lv{padding:14px 8px;border:2px solid #0af;border-radius:6px;background:rgba(0,30,60,0.4);cursor:pointer;transition:.15s;}
  .lv:hover{background:rgba(0,60,120,0.6);box-shadow:0 0 14px rgba(0,170,255,0.4);}
  .lv .num{font-size:clamp(22px,7vw,36px);font-weight:900;color:#0df;}
  .lv .nm{font-size:clamp(11px,3vw,14px);color:#aaf;margin-top:2px;}
  .lv .best{font-size:10px;color:#6f8;margin-top:3px;}
  .lv.locked{opacity:0.4;border-color:#555;cursor:not-allowed;}
  .lv.locked .num{color:#888;}
  .ov-stat{font-size:clamp(13px,3.5vw,18px);color:#aaf;margin:5px 0;}
  .ov-stat b{color:#ffd23f;font-size:1.2em;}
  .rank{font-size:clamp(42px,12vw,80px);color:#ffd23f;text-shadow:0 0 20px #ff8800,4px 4px 0 #000;margin:6px 0;}
  .hint{font-size:11px;color:#668;margin-top:18px;line-height:1.7;}
  /* Boss血条 */
  #bossBar{position:fixed;top:46px;left:50%;transform:translateX(-50%);z-index:21;width:70%;max-width:360px;display:none;}
  #bossBar.show{display:block;}
  #bossBar .name{text-align:center;color:#ff5;font-size:12px;letter-spacing:2px;margin-bottom:3px;text-shadow:1px 1px 0 #000;}
  #bossBar .track{height:8px;background:#200;border:1px solid #f50;border-radius:4px;overflow:hidden;}
  #bossBar .fill{height:100%;background:linear-gradient(90deg,#ff3030,#ff8800);transition:width .2s;box-shadow:0 0 8px #f50;}
  /* 暂停按钮 */
  #pauseBtn{position:fixed;top:8px;right:8px;z-index:25;width:34px;height:34px;border-radius:50%;
    background:rgba(0,20,40,0.6);border:1px solid #0af;color:#0af;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #bgmBtn{position:fixed;top:8px;right:48px;z-index:25;width:34px;height:34px;border-radius:50%;
    background:rgba(0,20,40,0.6);border:1px solid #0af;color:#0af;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #bgmBtn.off{opacity:0.4;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="scan"></div>

<div id="hud">
  <div class="hud-cell">关卡 <b id="hLv">1</b></div>
  <div class="hud-cell">分数 <b id="hSc">0</b></div>
  <div id="hpBar"></div>
  <div class="hud-cell" id="weaponCell" style="display:none">武器 <b id="hWp">普通</b></div>
  <div class="hud-cell">怪兽 <b id="hMst">0</b></div>
</div>
<div id="bossBar"><div class="name" id="bossName">BOSS</div><div class="track"><div class="fill" id="bossFill" style="width:100%"></div></div></div>
<button id="pauseBtn">Ⅱ</button>
<button id="bgmBtn" title="背景音乐">♪</button>
<div id="touchArea"></div>

<!-- 标题 -->
<div class="ov" id="ovTitle">
  <div class="title">机甲大战怪兽</div>
  <div class="subtitle">MECHA VS MONSTERS</div>
  <button class="btn" id="btnStart">开始游戏</button>
  <button class="btn ghost" id="btnLevel">选择关卡</button>
  <div class="hint">桌面: 方向键/WASD 移动 · 空格 射击<br/>手机: 触摸拖动移动 · 自动射击</div>
</div>

<!-- 关卡选择 -->
<div class="ov hidden" id="ovLevel">
  <div class="title" style="font-size:clamp(24px,7vw,48px)">选择关卡</div>
  <div class="grid" id="lvGrid"></div>
  <button class="btn ghost" id="btnBack" style="margin-top:20px">返回</button>
</div>

<!-- 暂停 -->
<div class="ov hidden" id="ovPause">
  <div class="title" style="font-size:clamp(24px,7vw,48px)">暂停</div>
  <button class="btn" id="btnResume">继续</button>
  <button class="btn ghost" id="btnQuit">返回主菜单</button>
</div>

<!-- 结算 -->
<div class="ov hidden" id="ovOver">
  <div class="title" id="overTitle" style="font-size:clamp(26px,8vw,56px)">胜利!</div>
  <div class="rank" id="rank">S</div>
  <div class="ov-stat">关卡 <b id="ovLv">1</b> · 得分 <b id="ovSc">0</b></div>
  <div class="ov-stat">消灭怪兽 <b id="ovKill">0</b> · 命中率 <b id="ovHit">0%</b></div>
  <button class="btn" id="btnNext">下一关</button>
  <button class="btn ghost" id="btnRetry">重试</button>
  <button class="btn ghost" id="btnMenu">主菜单</button>
</div>

<script>
/* ============================================================
 * 机甲大战怪兽 — 单文件 Canvas 2D 飞机射击游戏
 * 模块化: CFG / LEVELS / MONSTERS / 玩家 / 子弹 / 粒子 / 碰撞 / 音频
 * ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const vv = () => window.visualViewport;
function resize() {
  W = vv() ? vv().width : innerWidth;
  H = vv() ? vv().height : innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ==================== 配置 ==================== */
const CFG = {
  playerSpeed: 380,
  fireInterval: 0.14,
  bulletSpeed: 720,
  maxHP: 6,
  invulnTime: 1.2,
  baseMonsterSpeed: 80,
  // 难度曲线: 每关递增, 速度倍率 & 射击间隔缩短
  difficulty: [1.0, 1.1, 1.2, 1.35, 1.5, 1.65, 1.85, 2.1],
};

/* ==================== 8 关卡定义 ==================== */
const LEVELS = [
  { name:'太空', bg:['#0a0e2a','#1a1a4a','#2a1a5a'], starColor:'#ffffff', particle:'star', ground:null,
    waves:[ {t:0,type:'octopus',n:5,pattern:'line'}, {t:8,type:'octopus',n:6,pattern:'v'}, {t:16,type:'scorpion',n:4,pattern:'line'}, {t:24,type:'octopus',n:8,pattern:'wave'} ], boss:null },
  { name:'海洋', bg:['#001a33','#003355','#004466'], starColor:'#aaddff', particle:'bubble', ground:'ocean',
    waves:[ {t:0,type:'scorpion',n:5,pattern:'v'}, {t:8,type:'ufo',n:3,pattern:'line'}, {t:16,type:'octopus',n:8,pattern:'wave'}, {t:24,type:'scorpion',n:6,pattern:'line'} ], boss:null },
  { name:'撒哈拉沙漠', bg:['#3a2010','#6a4020','#9a6030'], starColor:'#ffe0a0', particle:'sand', ground:'desert',
    waves:[ {t:0,type:'bug',n:6,pattern:'wave'}, {t:8,type:'scorpion',n:5,pattern:'v'}, {t:16,type:'bug',n:8,pattern:'line'}, {t:24,type:'turret',n:4,pattern:'line'} ], boss:null },
  { name:'火星', bg:['#3a0a0a','#5a1a0a','#7a2a1a'], starColor:'#ffaa88', particle:'ember', ground:'mars',
    waves:[ {t:0,type:'ufo',n:5,pattern:'line'}, {t:8,type:'bug',n:8,pattern:'wave'}, {t:16,type:'turret',n:4,pattern:'v'}, {t:22,type:'scorpion',n:6,pattern:'line'} ], boss:'dragon' },
  { name:'月球', bg:['#0a0a18','#1a1a2a','#2a2a3a'], starColor:'#ccccff', particle:'star', ground:'moon',
    waves:[ {t:0,type:'turret',n:5,pattern:'line'}, {t:8,type:'ufo',n:4,pattern:'v'}, {t:16,type:'bug',n:10,pattern:'wave'}, {t:24,type:'bomber',n:2,pattern:'line'} ], boss:null },
  { name:'非洲大草原', bg:['#1a2a0a','#2a4a1a','#3a6a2a'], starColor:'#aaff88', particle:'leaf', ground:'savanna',
    waves:[ {t:0,type:'scorpion',n:6,pattern:'v'}, {t:8,type:'octopus',n:8,pattern:'wave'}, {t:16,type:'bomber',n:3,pattern:'line'}, {t:24,type:'turret',n:5,pattern:'v'} ], boss:null },
  { name:'热带雨林', bg:['#0a2a1a','#1a4a2a','#2a6a3a'], starColor:'#88ffaa', particle:'rain', ground:'jungle',
    waves:[ {t:0,type:'bug',n:8,pattern:'wave'}, {t:8,type:'ufo',n:5,pattern:'line'}, {t:16,type:'scorpion',n:8,pattern:'v'}, {t:24,type:'bomber',n:3,pattern:'line'} ], boss:null },
  { name:'海王星', bg:['#0a1a3a','#1a3a6a','#2a5aaa'], starColor:'#aaccff', particle:'snow', ground:'neptune',
    waves:[ {t:0,type:'turret',n:6,pattern:'line'}, {t:8,type:'bomber',n:3,pattern:'v'}, {t:16,type:'bug',n:12,pattern:'wave'}, {t:24,type:'ufo',n:6,pattern:'line'} ], boss:'kraken' },
];

/* ==================== 怪兽类型 ==================== */
// 每种怪兽: hp, score, speed, size, shoot?, draw(ctx, m, t)
const MONSTER_TYPES = {
  octopus: { hp:1, score:100, speed:1.0, size:1.0, shoot:false },
  scorpion:{ hp:2, score:200, speed:0.9, size:1.1, shoot:true, shootInterval:1.8 },
  ufo:     { hp:2, score:250, speed:0.6, size:1.2, shoot:true, shootInterval:1.4 },
  bug:     { hp:1, score:150, speed:1.6, size:0.8, shoot:false },
  turret:  { hp:3, score:300, speed:0.3, size:1.3, shoot:true, shootInterval:1.2 },
  bomber:  { hp:6, score:500, speed:0.5, size:2.0, shoot:true, shootInterval:1.0 },
};

const BOSS_TYPES = {
  dragon: { hp:60, score:5000, size:4.5, name:'机械巨龙' },
  kraken: { hp:100, score:10000, size:5.5, name:'深渊海妖' },
};

/* ==================== 工具 ==================== */
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

/* ==================== 存档 (localStorage) ==================== */
const SAVE_KEY = 'mecha_vs_monsters_save_v1';
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { unlocked: 1, bestScores: {} }; // 默认解锁第 1 关
}
function saveSave(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e) {}
}
let save = loadSave();
function unlockLevel(idx) {
  if (idx + 1 > save.unlocked) { save.unlocked = idx + 1; saveSave(save); }
}
function recordBest(idx, score) {
  if (!save.bestScores[idx] || score > save.bestScores[idx]) {
    save.bestScores[idx] = score;
    saveSave(save);
  }
}

/* ==================== 游戏状态 ==================== */
let game = {
  state: 'title', // title/level/playing/pause/over
  level: 0,
  score: 0,
  kills: 0,
  shots: 0,
  hits: 0,
  time: 0,
  waveIdx: 0,
  monsters: [],
  bullets: [],
  enemyBullets: [],
  particles: [],
  stars: [],
  boss: null,
  bossActive: false,
  shake: 0,
  overWin: false,
  powerups: [], // 奖励宝盒
};

let player = {
  x: 0, y: 0,
  hp: CFG.maxHP,
  invuln: 0,
  fireCD: 0,
  tilt: 0,
  engineT: 0,
  weapon: 'normal', // normal / laser / shotgun / rocket
  weaponTime: 0, // 武器持续时间
};

let input = { left:false, right:false, up:false, down:false, shoot:false };

/* ==================== 输入 ==================== */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowleft'||k==='a') input.left=true;
  if (k==='arrowright'||k==='d') input.right=true;
  if (k==='arrowup'||k==='w') input.up=true;
  if (k==='arrowdown'||k==='s') input.down=true;
  if (k===' '||k==='j') input.shoot=true;
  if (k==='escape') togglePause();
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowleft'||k==='a') input.left=false;
  if (k==='arrowright'||k==='d') input.right=false;
  if (k==='arrowup'||k==='w') input.up=false;
  if (k==='arrowdown'||k==='s') input.down=false;
  if (k===' '||k==='j') input.shoot=false;
});

// 触摸拖动
const ta = document.getElementById('touchArea');
let touchActive = false, touchId = null;
ta.addEventListener('pointerdown', e => {
  if (game.state !== 'playing') return;
  touchActive = true; touchId = e.pointerId;
  input.shoot = true; // 触摸时自动射击
  movePlayerTo(e.clientX, e.clientY);
  e.preventDefault();
}, {passive:false});
ta.addEventListener('pointermove', e => {
  if (touchActive && e.pointerId === touchId) movePlayerTo(e.clientX, e.clientY);
}, {passive:false});
ta.addEventListener('pointerup', e => {
  if (e.pointerId === touchId) { touchActive = false; touchId = null; input.shoot = false; }
});
function movePlayerTo(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  player.x = clamp(cx - rect.left, 30, W - 30);
  player.y = clamp(cy - rect.top, H * 0.3, H - 50);
}
document.getElementById('touchArea').style.display = 'block';

/* ==================== 星空/粒子背景 ==================== */
function initStars(level) {
  const lv = LEVELS[level];
  game.stars = [];
  for (let i = 0; i < 80; i++) {
    game.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: rand(0.5, 2.5),
      speed: rand(20, 80),
      color: lv.starColor,
      alpha: rand(0.3, 1),
    });
  }
}

/* ==================== 怪兽生成 ==================== */
function spawnWave(wave) {
  const lv = LEVELS[game.level];
  const cfg = MONSTER_TYPES[wave.type];
  const diff = CFG.difficulty[game.level] || 1;
  const n = wave.n;
  const startY = -50;
  // 根据屏幕宽度自适应间距，确保所有怪兽都在屏幕内
  const maxSpread = W - 80; // 左右各留 40 边距
  const spacing = Math.min(60, maxSpread / Math.max(n - 1, 1));

  for (let i = 0; i < n; i++) {
    let x, y, vx = 0, vy = cfg.speed * CFG.baseMonsterSpeed * diff;
    const offset = (i - (n - 1) / 2) * spacing;
    if (wave.pattern === 'line') {
      x = W / 2 + offset;
      y = startY - i * 30;
    } else if (wave.pattern === 'v') {
      const half = (n - 1) / 2;
      x = W / 2 + offset;
      y = startY - Math.abs(i - half) * 40;
    } else { // wave
      x = W / 2 + offset;
      y = startY - i * 20;
      vx = (i % 2 === 0 ? 1 : -1) * 40 * diff;
    }
    // 确保生成位置在屏幕内
    x = clamp(x, 40, W - 40);
    const shootInt = cfg.shoot ? cfg.shootInterval / diff : 0;
    game.monsters.push({
      type: wave.type, x, y, vx, vy,
      hp: cfg.hp, maxHp: cfg.hp,
      size: cfg.size, score: cfg.score,
      shootCD: cfg.shoot ? rand(0.5, shootInt) : 0,
      shootInterval: shootInt,
      t: Math.random() * Math.PI * 2,
      pattern: wave.pattern,
      phase: 'enter',
    });
  }
}

function spawnBoss(type) {
  const cfg = BOSS_TYPES[type];
  game.boss = {
    type, x: W / 2, y: -150,
    hp: cfg.hp, maxHp: cfg.hp,
    size: cfg.size, score: cfg.score, name: cfg.name,
    t: 0, shootCD: 1.5, phase: 'enter',
  };
  game.bossActive = true;
  document.getElementById('bossName').textContent = cfg.name;
  document.getElementById('bossBar').classList.add('show');
}

/* ==================== 玩家绘制: 精致机甲战斗机 ==================== */
function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2) return;
  const x = player.x, y = player.y;
  const tilt = player.tilt * 0.15;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);

  // 引擎喷焰 (双层动画)
  player.engineT += 0.3;
  const flame1 = 16 + Math.sin(player.engineT) * 5;
  const flame2 = 10 + Math.sin(player.engineT * 1.5) * 3;
  // 外焰
  const fg1 = ctx.createLinearGradient(0, 18, 0, 18 + flame1);
  fg1.addColorStop(0, 'rgba(0,229,255,0.9)');
  fg1.addColorStop(0.5, 'rgba(0,136,255,0.5)');
  fg1.addColorStop(1, 'rgba(0,80,255,0)');
  ctx.fillStyle = fg1;
  ctx.beginPath();
  ctx.moveTo(-10, 18); ctx.lineTo(0, 18 + flame1); ctx.lineTo(10, 18);
  ctx.closePath(); ctx.fill();
  // 内焰
  const fg2 = ctx.createLinearGradient(0, 18, 0, 18 + flame2);
  fg2.addColorStop(0, '#ffffff');
  fg2.addColorStop(0.6, '#00e5ff');
  fg2.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = fg2;
  ctx.beginPath();
  ctx.moveTo(-5, 18); ctx.lineTo(0, 18 + flame2); ctx.lineTo(5, 18);
  ctx.closePath(); ctx.fill();

  // 机翼 (后掠翼 + 武器挂架)
  ctx.fillStyle = '#1a4a7a';
  ctx.beginPath();
  ctx.moveTo(-26, 12); ctx.lineTo(-16, -8); ctx.lineTo(-6, 6); ctx.lineTo(-6, 18); ctx.lineTo(-22, 18);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(26, 12); ctx.lineTo(16, -8); ctx.lineTo(6, 6); ctx.lineTo(6, 18); ctx.lineTo(22, 18);
  ctx.closePath(); ctx.fill();
  // 机翼武器舱
  ctx.fillStyle = '#0a2a4a';
  ctx.fillRect(-20, 8, 6, 10);
  ctx.fillRect(14, 8, 6, 10);
  // 翼尖导弹
  ctx.fillStyle = '#4488cc';
  ctx.fillRect(-26, 10, 4, 8);
  ctx.fillRect(22, 10, 4, 8);

  // 机身主体 (渐变 + 分块)
  const bodyGrad = ctx.createLinearGradient(-12, -22, 12, 20);
  bodyGrad.addColorStop(0, '#7ac8ff');
  bodyGrad.addColorStop(0.3, '#3090e0');
  bodyGrad.addColorStop(0.7, '#1a5a9a');
  bodyGrad.addColorStop(1, '#0a2a5a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(0, -26);
  ctx.lineTo(11, -6);
  ctx.lineTo(9, 18);
  ctx.lineTo(-9, 18);
  ctx.lineTo(-11, -6);
  ctx.closePath();
  ctx.fill();
  // 机身装甲缝
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(8, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7, 8); ctx.lineTo(7, 8); ctx.stroke();

  // 机身中线高光
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(3, -6); ctx.lineTo(0, 18); ctx.lineTo(-3, -6);
  ctx.closePath(); ctx.fill();

  // 驾驶舱 (深色玻璃 + 高光)
  ctx.fillStyle = '#001020';
  ctx.beginPath();
  ctx.ellipse(0, -8, 5, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  const cockpitGrad = ctx.createRadialGradient(-1.5, -11, 0, -1.5, -8, 8);
  cockpitGrad.addColorStop(0, 'rgba(0,229,255,0.7)');
  cockpitGrad.addColorStop(1, 'rgba(0,40,80,0.3)');
  ctx.fillStyle = cockpitGrad;
  ctx.beginPath();
  ctx.ellipse(0, -8, 5, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  // 驾驶舱反光
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(-1.5, -11, 1.5, 3, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // 机头炮管
  ctx.fillStyle = '#88ccff';
  ctx.fillRect(-2.5, -28, 5, 8);
  ctx.fillStyle = '#aaddff';
  ctx.fillRect(-1.5, -28, 3, 4);

  // 武器颜色指示 (机身发光)
  if (player.weapon === 'laser') {
    ctx.shadowColor = '#0ff'; ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(0,255,255,0.5)';
    ctx.fillRect(-3, -10, 6, 14);
    ctx.shadowBlur = 0;
  } else if (player.weapon === 'shotgun') {
    ctx.shadowColor = '#fd0'; ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255,221,0,0.4)';
    ctx.fillRect(-3, -10, 6, 14);
    ctx.shadowBlur = 0;
  } else if (player.weapon === 'rocket') {
    ctx.shadowColor = '#f60'; ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255,102,0,0.4)';
    ctx.fillRect(-3, -10, 6, 14);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

/* ==================== 怪兽绘制 ==================== */
function drawMonster(m) {
  const x = m.x, y = m.y, s = m.size;
  ctx.save();
  ctx.translate(x, y);

  if (m.type === 'octopus') {
    // 章鱼怪: 头部渐变 + 5条波浪触手 + 大眼
    const hg = ctx.createRadialGradient(-3*s, -7*s, 2*s, 0, -4*s, 14*s);
    hg.addColorStop(0, '#ff8899');
    hg.addColorStop(0.6, '#ff4466');
    hg.addColorStop(1, '#cc2244');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0, -4*s, 14*s, 0, Math.PI*2); ctx.fill();
    // 头部高光
    ctx.fillStyle = 'rgba(255,200,210,0.4)';
    ctx.beginPath(); ctx.ellipse(-4*s, -9*s, 4*s, 3*s, -0.3, 0, Math.PI*2); ctx.fill();
    // 触手 (5条, 波浪摆动)
    for (let i = -2; i <= 2; i++) {
      const tx = i * 7 * s;
      const wave = Math.sin(m.t * 2 + i * 0.8) * 5 * s;
      ctx.fillStyle = '#cc2244';
      ctx.beginPath();
      ctx.moveTo(tx - 3.5*s, 5*s);
      ctx.quadraticCurveTo(tx + wave, 18*s, tx - 1*s, 24*s);
      ctx.quadraticCurveTo(tx + wave*0.5, 18*s, tx + 3.5*s, 5*s);
      ctx.closePath(); ctx.fill();
      // 触手吸盘
      ctx.fillStyle = '#ff6677';
      ctx.beginPath(); ctx.arc(tx + wave*0.3, 14*s, 1.5*s, 0, Math.PI*2); ctx.fill();
    }
    // 眼睛 (大白眼+黑瞳+高光)
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-5*s, -7*s, 4.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5*s, -7*s, 4.5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5*s, -7*s, 2.2*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5*s, -7*s, 2.2*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6*s, -8*s, 1*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s, -8*s, 1*s, 0, Math.PI*2); ctx.fill();
  } else if (m.type === 'scorpion') {
    // 蝎子怪: 分节身体 + 大钳 + 毒尾
    const bg = ctx.createLinearGradient(0, -16*s, 0, 16*s);
    bg.addColorStop(0, '#cc66dd'); bg.addColorStop(0.5, '#aa44cc'); bg.addColorStop(1, '#772299');
    // 身体分节
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = i % 2 ? '#9933bb' : '#aa44cc';
      ctx.beginPath();
      ctx.ellipse(0, -8*s + i*8*s, (12 - i*1.5)*s, (5 - i*0.5)*s, 0, 0, Math.PI*2);
      ctx.fill();
    }
    // 钳子 (带开合动画)
    const clawOpen = Math.sin(m.t * 3) * 2 * s;
    ctx.fillStyle = '#8822aa';
    ctx.beginPath(); ctx.ellipse(-15*s, -10*s, 7*s, 5*s, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(15*s, -10*s, 7*s, 5*s, -0.3, 0, Math.PI*2); ctx.fill();
    // 钳爪
    ctx.fillStyle = '#661188';
    ctx.beginPath(); ctx.moveTo(-20*s, -13*s + clawOpen); ctx.lineTo(-25*s, -16*s); ctx.lineTo(-18*s, -10*s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20*s, -13*s - clawOpen); ctx.lineTo(25*s, -16*s); ctx.lineTo(18*s, -10*s); ctx.closePath(); ctx.fill();
    // 尾巴 (弯曲带毒刺)
    ctx.strokeStyle = '#8822aa'; ctx.lineWidth = 5*s; ctx.lineCap = 'round';
    const tailWag = Math.sin(m.t * 2) * 6 * s;
    ctx.beginPath();
    ctx.moveTo(0, 14*s);
    ctx.quadraticCurveTo(12*s + tailWag, 22*s, 6*s, 30*s);
    ctx.stroke();
    // 毒刺
    ctx.fillStyle = '#ff2244';
    ctx.shadowColor = '#ff2244'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.moveTo(6*s, 30*s); ctx.lineTo(2*s, 36*s); ctx.lineTo(9*s, 34*s); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    // 眼睛
    ctx.fillStyle = '#ffee00';
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(-4*s, -10*s, 2.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s, -10*s, 2.5*s, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (m.type === 'ufo') {
    // 飞碟: 多层圆盘 + 玻璃罩 + 底灯
    // 底部圆盘
    const dg1 = ctx.createLinearGradient(0, 2*s, 0, 9*s);
    dg1.addColorStop(0, '#999'); dg1.addColorStop(1, '#555');
    ctx.fillStyle = dg1;
    ctx.beginPath(); ctx.ellipse(0, 6*s, 21*s, 6*s, 0, 0, Math.PI*2); ctx.fill();
    // 中部圆盘
    const dg2 = ctx.createLinearGradient(0, -2*s, 0, 5*s);
    dg2.addColorStop(0, '#ccc'); dg2.addColorStop(1, '#888');
    ctx.fillStyle = dg2;
    ctx.beginPath(); ctx.ellipse(0, 1*s, 16*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
    // 玻璃罩 (径向渐变)
    const dg = ctx.createRadialGradient(-3*s, -6*s, 1*s, 0, -3*s, 11*s);
    dg.addColorStop(0, '#ccffff'); dg.addColorStop(0.5, '#44aacc'); dg.addColorStop(1, '#005577');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.ellipse(0, -2*s, 11*s, 9*s, 0, Math.PI, 0); ctx.fill();
    // 罩高光
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(-4*s, -6*s, 3*s, 4*s, -0.3, 0, Math.PI*2); ctx.fill();
    // 底灯 (闪烁)
    const blink = (Math.sin(m.t * 3) + 1) / 2;
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = `rgba(255,${100 + blink*155},0,${0.6 + blink*0.4})`;
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(i * 8 * s, 8 * s, 2 * s, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // 外星人眼睛 (从罩里看)
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, -3*s, 4*s, 3*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0f0';
    ctx.beginPath(); ctx.arc(-2*s, -3*s, 1.2*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(2*s, -3*s, 1.2*s, 0, Math.PI*2); ctx.fill();
  } else if (m.type === 'bug') {
    // 机械虫: 椭圆甲壳 + 透明翅膀 + 复眼
    const bg = ctx.createLinearGradient(0, -14*s, 0, 14*s);
    bg.addColorStop(0, '#66cc44'); bg.addColorStop(0.5, '#338822'); bg.addColorStop(1, '#1a5511');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, 11*s, 15*s, 0, 0, Math.PI*2); ctx.fill();
    // 甲壳分缝
    ctx.strokeStyle = 'rgba(0,60,0,0.5)'; ctx.lineWidth = 1.5*s;
    ctx.beginPath(); ctx.moveTo(0, -14*s); ctx.lineTo(0, 14*s); ctx.stroke();
    // 甲壳斑点
    ctx.fillStyle = 'rgba(255,255,100,0.3)';
    ctx.beginPath(); ctx.arc(-4*s, -4*s, 2*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s, 2*s, 1.5*s, 0, Math.PI*2); ctx.fill();
    // 翅膀 (高速振动模糊)
    const wing = Math.sin(m.t * 8) * 3 * s;
    ctx.fillStyle = 'rgba(200,255,200,0.35)';
    ctx.beginPath(); ctx.ellipse(-13*s, -3*s + wing, 9*s, 6*s, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13*s, -3*s - wing, 9*s, 6*s, 0.4, 0, Math.PI*2); ctx.fill();
    // 复眼 (红色发光)
    ctx.fillStyle = '#ff0000';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(-4*s, -9*s, 3.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4*s, -9*s, 3.5*s, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 复眼高光
    ctx.fillStyle = '#ffaaaa';
    ctx.beginPath(); ctx.arc(-5*s, -10*s, 1*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3*s, -10*s, 1*s, 0, Math.PI*2); ctx.fill();
  } else if (m.type === 'turret') {
    // 炮台怪: 装甲底座 + 旋转炮管 + 红眼瞄准
    // 底座
    ctx.fillStyle = '#555';
    ctx.fillRect(-15*s, -4*s, 30*s, 22*s);
    const bg = ctx.createLinearGradient(0, -4*s, 0, 18*s);
    bg.addColorStop(0, '#666'); bg.addColorStop(1, '#333');
    ctx.fillStyle = bg;
    ctx.fillRect(-15*s, -4*s, 30*s, 22*s);
    // 装甲铆钉
    ctx.fillStyle = '#888';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.arc(i*10*s, 12*s, 1.5*s, 0, Math.PI*2); ctx.fill();
    }
    // 履带
    ctx.fillStyle = '#222';
    ctx.fillRect(-17*s, 14*s, 34*s, 8*s);
    ctx.fillStyle = '#444';
    for (let i = -2; i <= 2; i++) ctx.fillRect(i*7*s - 2, 15*s, 4*s, 6*s);
    // 炮塔
    ctx.fillStyle = '#777';
    ctx.beginPath(); ctx.arc(0, -2*s, 9*s, 0, Math.PI*2); ctx.fill();
    // 炮管 (朝玩家方向)
    const ang = Math.atan2(player.y - m.y, player.x - m.x) + Math.PI/2;
    ctx.save();
    ctx.rotate(ang);
    ctx.fillStyle = '#333';
    ctx.fillRect(-3.5*s, -22*s, 7*s, 20*s);
    ctx.fillStyle = '#555';
    ctx.fillRect(-4.5*s, -24*s, 9*s, 4*s);
    ctx.restore();
    // 红眼瞄准
    ctx.fillStyle = '#ff2200';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(0, -2*s, 3*s, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (m.type === 'bomber') {
    // 轰炸机: 大型机身 + 宽翼 + 多炮塔
    const bg = ctx.createLinearGradient(0, -28*s, 0, 28*s);
    bg.addColorStop(0, '#775533'); bg.addColorStop(0.5, '#553322'); bg.addColorStop(1, '#332211');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, 23*s, 30*s, 0, 0, Math.PI*2); ctx.fill();
    // 机翼
    ctx.fillStyle = '#442211';
    ctx.beginPath();
    ctx.moveTo(-23*s, -6*s); ctx.lineTo(-40*s, 6*s); ctx.lineTo(-38*s, 14*s); ctx.lineTo(-20*s, 14*s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(23*s, -6*s); ctx.lineTo(40*s, 6*s); ctx.lineTo(38*s, 14*s); ctx.lineTo(20*s, 14*s);
    ctx.closePath(); ctx.fill();
    // 机翼引擎
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.ellipse(-32*s, 8*s, 4*s, 7*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(32*s, 8*s, 4*s, 7*s, 0, 0, Math.PI*2); ctx.fill();
    // 驾驶舱
    ctx.fillStyle = '#001830';
    ctx.beginPath(); ctx.ellipse(0, -16*s, 9*s, 7*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,0,0.6)';
    ctx.beginPath(); ctx.ellipse(0, -17*s, 6*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
    // 机身装甲带
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2*s;
    ctx.beginPath(); ctx.ellipse(0, 0, 20*s, 26*s, 0, 0, Math.PI*2); ctx.stroke();
    // 尾部炮塔
    ctx.fillStyle = '#555';
    ctx.beginPath(); ctx.arc(0, 22*s, 5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff2200';
    ctx.beginPath(); ctx.arc(0, 22*s, 2*s, 0, Math.PI*2); ctx.fill();
  }

  // 血条 (多血怪兽)
  if (m.maxHp > 1) {
    const bw = 26 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-bw/2, -22 * s, bw, 3);
    ctx.fillStyle = '#ff3030';
    ctx.fillRect(-bw/2, -22 * s, bw * (m.hp / m.maxHp), 3);
  }
  ctx.restore();
}

/* ==================== Boss 绘制 ==================== */
function drawBoss(b) {
  ctx.save();
  ctx.translate(b.x, b.y);

  if (b.type === 'dragon') {
    // 机械巨龙: 分节身体 + 金属翅膀 + 龙头
    const bodyGrad = ctx.createLinearGradient(0, -50, 0, 60);
    bodyGrad.addColorStop(0, '#cc2222'); bodyGrad.addColorStop(0.5, '#880000'); bodyGrad.addColorStop(1, '#440000');
    // 身体分节
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i % 2 ? '#770000' : '#990000';
      ctx.beginPath();
      ctx.ellipse(0, -10 + i * 14, (35 - i * 3), (22 - i * 2), 0, 0, Math.PI*2);
      ctx.fill();
    }
    // 金属翅膀 (拍动)
    const wf = Math.sin(b.t * 2) * 20;
    const wingGrad = ctx.createLinearGradient(-90, 0, -30, 30);
    wingGrad.addColorStop(0, '#550000'); wingGrad.addColorStop(1, '#880000');
    ctx.fillStyle = wingGrad;
    ctx.beginPath();
    ctx.moveTo(-30, -5);
    ctx.quadraticCurveTo(-100, -40 + wf, -80, 50);
    ctx.quadraticCurveTo(-55, 25, -30, 35);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(30, -5);
    ctx.quadraticCurveTo(100, -40 + wf, 80, 50);
    ctx.quadraticCurveTo(55, 25, 30, 35);
    ctx.closePath(); ctx.fill();
    // 翅膀骨架
    ctx.strokeStyle = '#330000'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-30, 0 + i*10); ctx.lineTo(-75 - i*8, 20 + wf*0.5); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(30, 0 + i*10); ctx.lineTo(75 + i*8, 20 + wf*0.5); ctx.stroke();
    }
    // 龙头
    const headGrad = ctx.createRadialGradient(-8, -40, 5, 0, -35, 35);
    headGrad.addColorStop(0, '#dd3333'); headGrad.addColorStop(1, '#880000');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(0, -38, 32, 28, 0, 0, Math.PI*2);
    ctx.fill();
    // 龙角
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.moveTo(-22, -55); ctx.lineTo(-16, -78); ctx.lineTo(-12, -55); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(22, -55); ctx.lineTo(16, -78); ctx.lineTo(12, -55); ctx.closePath(); ctx.fill();
    // 眼睛 (发光黄)
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(-13, -42, 7, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13, -42, 7, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(-12, -42, 3, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, -42, 3, 4, 0, 0, Math.PI*2); ctx.fill();
    // 鼻孔
    ctx.fillStyle = '#220000';
    ctx.beginPath(); ctx.arc(-6, -28, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -28, 2, 0, Math.PI*2); ctx.fill();
    // 獠牙
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-11, -22); ctx.lineTo(-8, -10); ctx.lineTo(-5, -22); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(11, -22); ctx.lineTo(8, -10); ctx.lineTo(5, -22); ctx.closePath(); ctx.fill();
  } else if (b.type === 'kraken') {
    // 深渊海妖: 巨型头部 + 8条触须 + 发光眼
    const bg = ctx.createRadialGradient(-10, -20, 10, 0, -10, 65);
    bg.addColorStop(0, '#cc3377'); bg.addColorStop(0.6, '#882255'); bg.addColorStop(1, '#330022');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, -10, 55, 0, Math.PI*2); ctx.fill();
    // 头部高光
    ctx.fillStyle = 'rgba(255,150,200,0.3)';
    ctx.beginPath(); ctx.ellipse(-15, -25, 18, 12, -0.3, 0, Math.PI*2); ctx.fill();
    // 8条触须 (波浪摆动)
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2 + Math.PI/8;
      const wave = Math.sin(b.t * 1.5 + i * 0.7) * 18;
      ctx.strokeStyle = '#771155';
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * 35, Math.sin(ang) * 35 - 10);
      ctx.quadraticCurveTo(Math.cos(ang) * 60, Math.sin(ang) * 60 + wave, Math.cos(ang) * 45, Math.sin(ang) * 90);
      ctx.stroke();
      // 触须尖端
      ctx.strokeStyle = '#992266';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * 45, Math.sin(ang) * 90);
      ctx.lineTo(Math.cos(ang) * 40, Math.sin(ang) * 105);
      ctx.stroke();
      // 吸盘
      ctx.fillStyle = '#ff88bb';
      ctx.beginPath(); ctx.arc(Math.cos(ang) * 50, Math.sin(ang) * 70, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(Math.cos(ang) * 42, Math.sin(ang) * 85, 3, 0, Math.PI*2); ctx.fill();
    }
    // 眼睛 (巨大发光)
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(-20, -20, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(20, -20, 12, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-20, -20, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(20, -20, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-22, -23, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(18, -23, 2, 0, Math.PI*2); ctx.fill();
    // 嘴
    ctx.fillStyle = '#220011';
    ctx.beginPath();
    ctx.ellipse(0, 5, 18, 8, 0, 0, Math.PI*2);
    ctx.fill();
    // 牙齿
    ctx.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 7 - 3, 0); ctx.lineTo(i * 7, 8); ctx.lineTo(i * 7 + 3, 0);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

/* ==================== 子弹 ==================== */
function fireBullet() {
  if (player.fireCD > 0) return;
  const w = player.weapon;
  if (w === 'normal') {
    player.fireCD = CFG.fireInterval;
    game.bullets.push({ x: player.x, y: player.y - 24, vx: 0, vy: -CFG.bulletSpeed, dmg: 1, type: 'normal' });
    game.shots++;
    sfx('shoot');
  } else if (w === 'laser') {
    // 激光: 穿透, 高伤害, 宽弹
    player.fireCD = 0.08;
    game.bullets.push({ x: player.x, y: player.y - 24, vx: 0, vy: -CFG.bulletSpeed * 1.4, dmg: 2, type: 'laser', pierce: true });
    game.shots++;
    sfx('laser');
  } else if (w === 'shotgun') {
    // 霰弹: 5 发扇形散射
    player.fireCD = 0.28;
    for (let i = -2; i <= 2; i++) {
      const ang = -Math.PI / 2 + i * 0.18;
      game.bullets.push({ x: player.x, y: player.y - 20, vx: Math.cos(ang) * CFG.bulletSpeed, vy: Math.sin(ang) * CFG.bulletSpeed, dmg: 1, type: 'shotgun' });
    }
    game.shots += 5;
    sfx('shotgun');
  } else if (w === 'rocket') {
    // 三连发火箭: 追踪, 爆炸伤害
    player.fireCD = 0.35;
    for (let i = -1; i <= 1; i++) {
      game.bullets.push({ x: player.x + i * 12, y: player.y - 20, vx: i * 60, vy: -CFG.bulletSpeed * 0.9, dmg: 3, type: 'rocket', track: true });
    }
    game.shots += 3;
    sfx('rocket');
  }
  // 炮口闪光粒子
  for (let i = 0; i < 3; i++) {
    game.particles.push({ x: player.x + rand(-4, 4), y: player.y - 24, vx: rand(-30, 30), vy: rand(-50, -10), life: 0.15, color: '#aaffff', size: 3 });
  }
}

function updateBullets(dt) {
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    // 追踪导弹
    if (b.track) {
      let target = game.boss;
      if (!target && game.monsters.length > 0) {
        // 找最近的怪兽
        let minD = Infinity;
        for (const m of game.monsters) {
          const d = dist(b, m);
          if (d < minD) { minD = d; target = m; }
        }
      }
      if (target) {
        const dx = target.x - b.x, dy = target.y - b.y;
        const d = Math.hypot(dx, dy) || 1;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx += (dx / d) * 600 * dt;
        b.vy += (dy / d) * 600 * dt;
        const ns = Math.hypot(b.vx, b.vy);
        if (ns > sp * 1.5) { b.vx = b.vx / ns * sp * 1.5; b.vy = b.vy / ns * sp * 1.5; }
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) game.bullets.splice(i, 1);
  }
  for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
    const b = game.enemyBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -20) game.enemyBullets.splice(i, 1);
  }
}

function drawBullets() {
  for (const b of game.bullets) {
    if (b.type === 'laser') {
      // 激光: 青色粗光柱
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 12;
      ctx.fillRect(b.x - 4, b.y - 14, 8, 24);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x - 2, b.y - 14, 4, 24);
      ctx.shadowBlur = 0;
    } else if (b.type === 'shotgun') {
      // 霰弹: 黄色小球
      ctx.fillStyle = '#ffdd00';
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    } else if (b.type === 'rocket') {
      // 火箭: 橙色带尾焰
      ctx.fillStyle = '#ff6600';
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - 8); ctx.lineTo(b.x + 4, b.y + 6); ctx.lineTo(b.x - 4, b.y + 6);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      // 尾焰
      ctx.fillStyle = 'rgba(255,200,0,0.6)';
      ctx.beginPath(); ctx.arc(b.x, b.y + 8, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      // 普通子弹: 蓝色能量弹
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, 3, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,229,255,0.3)';
      ctx.fillRect(b.x - 1, b.y, 2, 8);
    }
  }
  // 敌方子弹
  for (const b of game.enemyBullets) {
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

/* ==================== 粒子 ==================== */
function addExplosion(x, y, color, count = 12, power = 1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(60, 200) * power;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.7),
      color, size: rand(2, 5) * power,
    });
  }
}

function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* ==================== 碰撞 ==================== */
function checkCollisions() {
  // 玩家子弹 vs 怪兽
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    let consumed = false;
    let hitCount = 0;
    for (let j = game.monsters.length - 1; j >= 0; j--) {
      const m = game.monsters[j];
      if (dist(b, m) < 18 * m.size) {
        m.hp -= b.dmg;
        game.hits++;
        addExplosion(b.x, b.y, '#88ccff', 4, 0.5);
        hitCount++;
        if (m.hp <= 0) {
          game.kills++;
          game.score += m.score;
          addExplosion(m.x, m.y, '#ff8800', 16, 1);
          sfx('explode');
          // 火箭爆炸范围伤害
          if (b.type === 'rocket') {
            rocketExplode(b.x, b.y, 50, b.dmg);
          }
          // 随机掉落宝盒 (15% 概率)
          if (Math.random() < 0.15) spawnPowerup(m.x, m.y);
          game.monsters.splice(j, 1);
        } else {
          sfx('hit');
        }
        if (!b.pierce) { consumed = true; break; }
      }
    }
    // vs Boss
    if (!consumed && game.boss) {
      if (dist(b, game.boss) < 45 * game.boss.size) {
        game.boss.hp -= b.dmg;
        game.hits++;
        addExplosion(b.x, b.y, '#ffaa00', 4, 0.5);
        hitCount++;
        if (b.type === 'rocket') rocketExplode(b.x, b.y, 60, b.dmg);
        document.getElementById('bossFill').style.width = (game.boss.hp / game.boss.maxHp * 100) + '%';
        if (game.boss.hp <= 0) {
          game.score += game.boss.score;
          addExplosion(game.boss.x, game.boss.y, '#ff5500', 60, 2);
          game.shake = 0.5;
          sfx('bossDie');
          game.boss = null;
          game.bossActive = false;
          document.getElementById('bossBar').classList.remove('show');
          setTimeout(() => endLevel(true), 800);
        }
        if (!b.pierce) consumed = true;
      }
    }
    if (consumed) game.bullets.splice(i, 1);
  }

  // 玩家 vs 宝盒
  for (let i = game.powerups.length - 1; i >= 0; i--) {
    const p = game.powerups[i];
    if (dist(p, player) < 28) {
      applyPowerup(p.type);
      addExplosion(p.x, p.y, '#ffd700', 12, 0.8);
      sfx('powerup');
      game.powerups.splice(i, 1);
    }
  }

  // 敌方子弹 vs 玩家
  if (player.invuln <= 0) {
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      if (dist(b, player) < 18) {
        playerHit();
        game.enemyBullets.splice(i, 1);
        break;
      }
    }
    // 怪兽撞玩家
    for (const m of game.monsters) {
      if (dist(m, player) < 16 * m.size + 10) {
        playerHit();
        break;
      }
    }
  }
}

// 火箭爆炸范围伤害
function rocketExplode(x, y, radius, dmg) {
  addExplosion(x, y, '#ff6600', 20, 1.2);
  game.shake = Math.max(game.shake, 0.15);
  for (let j = game.monsters.length - 1; j >= 0; j--) {
    const m = game.monsters[j];
    if (dist({x,y}, m) < radius) {
      m.hp -= dmg;
      if (m.hp <= 0) {
        game.kills++;
        game.score += m.score;
        addExplosion(m.x, m.y, '#ff8800', 12, 0.8);
        if (Math.random() < 0.15) spawnPowerup(m.x, m.y);
        game.monsters.splice(j, 1);
      }
    }
  }
  if (game.boss && dist({x,y}, game.boss) < radius) {
    game.boss.hp -= dmg * 0.5;
    document.getElementById('bossFill').style.width = (game.boss.hp / game.boss.maxHp * 100) + '%';
  }
}

/* ==================== 奖励宝盒 ==================== */
const POWERUP_TYPES = ['laser', 'shotgun', 'rocket'];
function spawnPowerup(x, y) {
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  game.powerups.push({ x, y, vy: 80, type, t: 0 });
}
function updatePowerups(dt) {
  for (let i = game.powerups.length - 1; i >= 0; i--) {
    const p = game.powerups[i];
    p.y += p.vy * dt;
    p.t += dt;
    if (p.y > H + 30) game.powerups.splice(i, 1);
  }
}
function drawPowerups() {
  for (const p of game.powerups) {
    const colors = { laser: '#00ffff', shotgun: '#ffdd00', rocket: '#ff6600' };
    const labels = { laser: 'L', shotgun: 'S', rocket: 'R' };
    const c = colors[p.type];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.t * 2);
    // 外框发光
    ctx.shadowColor = c; ctx.shadowBlur = 12;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(-12, -12, 24, 24);
    ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.strokeRect(-12, -12, 24, 24);
    ctx.shadowBlur = 0;
    ctx.rotate(-p.t * 2);
    // 字母
    ctx.fillStyle = c;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[p.type], 0, 0);
    ctx.restore();
  }
}
function applyPowerup(type) {
  player.weapon = type;
  player.weaponTime = 10; // 持续 10 秒
}

function playerHit() {
  player.hp--;
  player.invuln = CFG.invulnTime;
  game.shake = 0.3;
  addExplosion(player.x, player.y, '#00aaff', 10, 0.8);
  sfx('hurt');
  updateHUD();
  if (player.hp <= 0) endLevel(false);
}

/* ==================== 怪兽更新 ==================== */
function updateMonsters(dt) {
  const lv = LEVELS[game.level];
  for (let i = game.monsters.length - 1; i >= 0; i--) {
    const m = game.monsters[i];
    m.t += dt;
    if (m.phase === 'enter') {
      m.y += m.vy * dt;
      if (m.y > 80) { m.phase = 'fight'; m.baseY = m.y; }
    } else {
      // 战斗模式: 左右移动+射击
      if (m.pattern === 'wave') {
        m.x += m.vx * dt;
        // 边界反弹
        if (m.x < 35) { m.x = 35; m.vx = Math.abs(m.vx); }
        if (m.x > W - 35) { m.x = W - 35; m.vx = -Math.abs(m.vx); }
      } else {
        m.x += Math.sin(m.t * 1.5) * 30 * dt;
        m.x = clamp(m.x, 35, W - 35);
      }
      m.y = m.baseY + Math.sin(m.t) * 10;

      const cfg = MONSTER_TYPES[m.type];
      if (cfg.shoot) {
        m.shootCD -= dt;
        if (m.shootCD <= 0) {
          m.shootCD = m.shootInterval;
          const dx = player.x - m.x, dy = player.y - m.y;
          const d = Math.hypot(dx, dy);
          const bSpeed = 220 * (CFG.difficulty[game.level] || 1);
          game.enemyBullets.push({ x: m.x, y: m.y + 10 * m.size, vx: dx/d * bSpeed, vy: dy/d * bSpeed });
          if (m.type === 'bomber') {
            // 轰炸机撒 3 发
            game.enemyBullets.push({ x: m.x - 15, y: m.y, vx: -60, vy: 200 * (CFG.difficulty[game.level] || 1) });
            game.enemyBullets.push({ x: m.x + 15, y: m.y, vx: 60, vy: 200 * (CFG.difficulty[game.level] || 1) });
          }
        }
      }
    }
    // 超出屏幕底部移除
    if (m.y > H + 60) game.monsters.splice(i, 1);
  }

  // Boss 更新
  if (game.boss) {
    const b = game.boss;
    b.t += dt;
    if (b.phase === 'enter') {
      b.y += 60 * dt;
      if (b.y > 120) b.phase = 'fight';
    } else {
      b.x = W / 2 + Math.sin(b.t * 0.8) * (W * 0.3);
      b.y = 100 + Math.sin(b.t * 1.2) * 20;
      b.shootCD -= dt;
      if (b.shootCD <= 0) {
        const diff = CFG.difficulty[game.level] || 1;
        b.shootCD = (b.type === 'kraken' ? 0.8 : 1.2) / diff;
        // 扇形弹幕
        const count = b.type === 'kraken' ? 8 : 5;
        const bSpeed = 200 * diff;
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI/2 + (i - (count-1)/2) * 0.3 + Math.sin(b.t)*0.2;
          game.enemyBullets.push({ x: b.x, y: b.y + 30, vx: Math.cos(ang) * bSpeed, vy: Math.sin(ang) * bSpeed });
        }
      }
    }
  }
}

/* ==================== 关卡波次 ==================== */
function updateWaves(dt) {
  if (game.bossActive) return;
  const lv = LEVELS[game.level];
  if (game.waveIdx < lv.waves.length) {
    if (game.time >= lv.waves[game.waveIdx].t) {
      spawnWave(lv.waves[game.waveIdx]);
      game.waveIdx++;
    }
  } else if (game.monsters.length === 0) {
    // 所有波次清完 → Boss 或 过关
    if (lv.boss) {
      if (!game.bossActive && !game.boss) spawnBoss(lv.boss);
    } else {
      endLevel(true);
    }
  }
}

/* ==================== 背景绘制 (多层视差) ==================== */
function drawBackground(dt) {
  const lv = LEVELS[game.level];
  // 渐变天空
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, lv.bg[0]);
  g.addColorStop(0.5, lv.bg[1]);
  g.addColorStop(1, lv.bg[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 视差远景层
  drawFarLayer(lv.ground, lv);

  // 星空/粒子 (中景)
  for (const s of game.stars) {
    s.y += s.speed * dt;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // 地形 (近景底部)
  if (lv.ground) drawGround(lv.ground);
}

// 远景层: 每关独特的视差元素
function drawFarLayer(type, lv) {
  const off = (game.time * 20) % W; // 视差滚动偏移
  ctx.save();
  if (type === null) {
    // 太空: 星云 + 远处行星
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#4466ff';
    ctx.beginPath(); ctx.arc(W * 0.2 - off * 0.3, H * 0.3, 60, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff4488';
    ctx.beginPath(); ctx.arc(W * 0.8 - off * 0.2, H * 0.2, 40, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (type === 'ocean') {
    // 海洋: 远处海面光线
    ctx.globalAlpha = 0.1;
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = '#44aaff';
      ctx.fillRect(W * (0.2 + i * 0.3) - off * 0.1, 0, 30, H * 0.6);
    }
    ctx.globalAlpha = 1;
  } else if (type === 'desert') {
    // 沙漠: 远处金字塔
    ctx.fillStyle = 'rgba(120,80,40,0.5)';
    const px = W * 0.3 - off * 0.3;
    ctx.beginPath();
    ctx.moveTo(px, H * 0.7); ctx.lineTo(px + 50, H * 0.5); ctx.lineTo(px + 100, H * 0.7);
    ctx.closePath(); ctx.fill();
    const px2 = W * 0.7 - off * 0.3;
    ctx.beginPath();
    ctx.moveTo(px2, H * 0.72); ctx.lineTo(px2 + 35, H * 0.55); ctx.lineTo(px2 + 70, H * 0.72);
    ctx.closePath(); ctx.fill();
  } else if (type === 'mars') {
    // 火星: 远处岩石山脉
    ctx.fillStyle = 'rgba(90,30,15,0.6)';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.6);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, H * 0.6 + Math.sin(x * 0.01 + 1) * 30 - 20);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  } else if (type === 'moon') {
    // 月球: 远处地球
    ctx.globalAlpha = 0.8;
    const earthX = W * 0.8 - off * 0.15;
    const eg = ctx.createRadialGradient(earthX, H * 0.15, 5, earthX, H * 0.15, 30);
    eg.addColorStop(0, '#4488ff'); eg.addColorStop(0.7, '#224488'); eg.addColorStop(1, '#112244');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(earthX, H * 0.15, 28, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (type === 'savanna') {
    // 草原: 远处金合欢树剪影
    ctx.fillStyle = 'rgba(40,30,15,0.6)';
    for (let i = 0; i < 4; i++) {
      const tx = (i * W / 3 + 50 - off * 0.25) % (W + 100) - 50;
      ctx.fillRect(tx, H * 0.6, 4, 30); // 树干
      ctx.beginPath(); ctx.ellipse(tx + 2, H * 0.58, 18, 8, 0, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'jungle') {
    // 雨林: 远处树冠层
    ctx.fillStyle = 'rgba(15,50,25,0.7)';
    for (let x = 0; x < W; x += 25) {
      const th = 20 + Math.sin(x * 0.05) * 10;
      ctx.beginPath();
      ctx.arc(x, H * 0.65, th, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'neptune') {
    // 海王星: 极光
    ctx.globalAlpha = 0.2;
    const ag = ctx.createLinearGradient(0, 0, W, 0);
    ag.addColorStop(0, '#00ff88'); ag.addColorStop(0.5, '#00aaff'); ag.addColorStop(1, '#aa00ff');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.1);
    for (let x = 0; x <= W; x += 20) {
      ctx.lineTo(x, H * 0.1 + Math.sin(x * 0.01 + game.time) * 15);
    }
    ctx.lineTo(W, H * 0.25);
    for (let x = W; x >= 0; x -= 20) {
      ctx.lineTo(x, H * 0.25 + Math.sin(x * 0.015 + game.time * 0.7) * 10);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawGround(type) {
  const gy = H * 0.82;
  ctx.save();
  if (type === 'ocean') {
    // 海洋: 深水 + 波浪 + 气泡
    const og = ctx.createLinearGradient(0, gy, 0, H);
    og.addColorStop(0, '#004477'); og.addColorStop(1, '#001133');
    ctx.fillStyle = og;
    ctx.fillRect(0, gy, W, H - gy);
    // 波浪线
    ctx.strokeStyle = 'rgba(0,150,220,0.5)'; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 10) {
        ctx.lineTo(x, gy + i * 12 + Math.sin(game.time * 2 + x * 0.03 + i) * 4);
      }
      ctx.stroke();
    }
    // 气泡
    ctx.fillStyle = 'rgba(150,220,255,0.3)';
    for (let i = 0; i < 8; i++) {
      const bx = (i * 73 + game.time * 30) % W;
      const by = gy + 10 + ((i * 17 + game.time * 40) % (H - gy - 20));
      ctx.beginPath(); ctx.arc(bx, by, 2 + i % 3, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'desert') {
    // 沙漠: 沙丘 + 沙粒
    const dg = ctx.createLinearGradient(0, gy, 0, H);
    dg.addColorStop(0, '#c8985a'); dg.addColorStop(1, '#8a6030');
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, gy + Math.sin(x * 0.02 + 1) * 12);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    // 沙粒纹理
    ctx.fillStyle = 'rgba(255,220,150,0.2)';
    for (let i = 0; i < 30; i++) {
      ctx.fillRect((i * 37 + game.time * 10) % W, gy + (i * 13) % (H - gy), 2, 2);
    }
  } else if (type === 'mars') {
    // 火星: 红色地表 + 陨石坑 + 岩石
    const mg = ctx.createLinearGradient(0, gy, 0, H);
    mg.addColorStop(0, '#aa3322'); mg.addColorStop(1, '#551108');
    ctx.fillStyle = mg;
    ctx.fillRect(0, gy, W, H - gy);
    // 陨石坑
    ctx.fillStyle = 'rgba(60,15,8,0.6)';
    for (let i = 0; i < 5; i++) {
      const cx = (i * 89) % W;
      const cy = gy + 15 + i * 12;
      ctx.beginPath(); ctx.ellipse(cx, cy, 15 + i*3, 6, 0, 0, Math.PI*2); ctx.fill();
    }
    // 岩石
    ctx.fillStyle = '#772218';
    for (let i = 0; i < 4; i++) {
      const rx = (i * 120 + 30) % W;
      ctx.beginPath(); ctx.arc(rx, gy + 8, 4 + i, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'moon') {
    // 月球: 灰色地表 + 陨石坑
    ctx.fillStyle = '#999';
    ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#777';
    for (let i = 0; i < 12; i++) {
      const cx = (i * 53) % W;
      const cy = gy + 8 + (i * 17) % (H - gy - 15);
      ctx.beginPath(); ctx.arc(cx, cy, 3 + (i % 4) * 2, 0, Math.PI*2); ctx.fill();
    }
    // 陨石坑高光
    ctx.fillStyle = '#bbb';
    for (let i = 0; i < 8; i++) {
      const cx = (i * 71) % W;
      const cy = gy + 12 + (i * 23) % (H - gy - 20);
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'savanna') {
    // 草原: 草地 + 草丛
    const sg = ctx.createLinearGradient(0, gy, 0, H);
    sg.addColorStop(0, '#6a8a3a'); sg.addColorStop(1, '#3a5a1a');
    ctx.fillStyle = sg;
    ctx.fillRect(0, gy, W, H - gy);
    // 草丛
    ctx.strokeStyle = '#8aaa4a'; ctx.lineWidth = 1.5;
    for (let x = 0; x < W; x += 8) {
      const gh = 4 + Math.sin(x * 0.1) * 3;
      ctx.beginPath();
      ctx.moveTo(x, gy); ctx.lineTo(x - 2, gy - gh); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, gy); ctx.lineTo(x + 2, gy - gh); ctx.stroke();
    }
  } else if (type === 'jungle') {
    // 雨林: 深色地面 + 藤蔓 + 落叶
    const jg = ctx.createLinearGradient(0, gy, 0, H);
    jg.addColorStop(0, '#2a5a3a'); jg.addColorStop(1, '#0a2a1a');
    ctx.fillStyle = jg;
    ctx.fillRect(0, gy, W, H - gy);
    // 草丛/蕨类
    ctx.fillStyle = '#3a7a4a';
    for (let x = 0; x < W; x += 15) {
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x - 4, gy - 10); ctx.lineTo(x, gy - 6); ctx.lineTo(x + 4, gy - 10);
      ctx.closePath(); ctx.fill();
    }
    // 落叶
    ctx.fillStyle = 'rgba(150,200,80,0.4)';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.ellipse((i*80+30)%W, gy+10+i*8, 4, 2, i, 0, Math.PI*2); ctx.fill();
    }
  } else if (type === 'neptune') {
    // 海王星: 冰面 + 雪花
    const ng = ctx.createLinearGradient(0, gy, 0, H);
    ng.addColorStop(0, '#5a8aca'); ng.addColorStop(1, '#2a4a7a');
    ctx.fillStyle = ng;
    ctx.fillRect(0, gy, W, H - gy);
    // 冰裂纹
    ctx.strokeStyle = 'rgba(180,210,255,0.4)'; ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo((i*60)%W, gy + 5);
      ctx.lineTo((i*60+30)%W, gy + 25);
      ctx.lineTo((i*60+15)%W, gy + 45);
      ctx.stroke();
    }
    // 雪花
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 15; i++) {
      const sx = (i * 47 + game.time * 20) % W;
      const sy = gy + ((i * 23 + game.time * 30) % (H - gy));
      ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

/* ==================== HUD ==================== */
function updateHUD() {
  document.getElementById('hLv').textContent = game.level + 1;
  document.getElementById('hSc').textContent = game.score.toLocaleString();
  document.getElementById('hMst').textContent = game.monsters.length + (game.bossActive ? 1 : 0);
  const hp = document.getElementById('hpBar');
  hp.innerHTML = '';
  for (let i = 0; i < CFG.maxHP; i++) {
    const h = document.createElement('div');
    h.className = 'hp' + (i >= player.hp ? ' empty' : '');
    hp.appendChild(h);
  }
  // 武器状态
  const wc = document.getElementById('weaponCell');
  if (player.weapon !== 'normal') {
    wc.style.display = '';
    const names = { laser: '激光', shotgun: '霰弹', rocket: '火箭' };
    const colors = { laser: '#0ff', shotgun: '#fd0', rocket: '#f60' };
    const el = document.getElementById('hWp');
    el.textContent = names[player.weapon] + ' ' + Math.ceil(player.weaponTime) + 's';
    el.style.color = colors[player.weapon];
  } else {
    wc.style.display = 'none';
  }
}

/* ==================== 游戏流程 ==================== */
function startGame(level) {
  game.level = level;
  game.score = 0; game.kills = 0; game.shots = 0; game.hits = 0;
  game.time = 0; game.waveIdx = 0;
  game.monsters = []; game.bullets = []; game.enemyBullets = []; game.particles = [];
  game.powerups = [];
  game.boss = null; game.bossActive = false; game.shake = 0;
  player.x = W / 2; player.y = H - 100;
  player.hp = CFG.maxHP; player.invuln = 0; player.fireCD = 0;
  player.weapon = 'normal'; player.weaponTime = 0;
  initStars(level);
  game.state = 'playing';
  hideAllOverlays();
  document.getElementById('bossBar').classList.remove('show');
  updateHUD();
}

function endLevel(win) {
  game.state = 'over';
  game.overWin = win;
  document.getElementById('overTitle').textContent = win ? '关卡通过!' : '机甲损毁';
  document.getElementById('overTitle').style.color = win ? '#00ff88' : '#ff4444';
  document.getElementById('ovLv').textContent = game.level + 1;
  document.getElementById('ovSc').textContent = game.score.toLocaleString();
  document.getElementById('ovKill').textContent = game.kills;
  const hitRate = game.shots > 0 ? Math.round(game.hits / game.shots * 100) : 0;
  document.getElementById('ovHit').textContent = hitRate + '%';
  const rank = win ? (hitRate > 60 ? 'S' : hitRate > 40 ? 'A' : 'B') : 'D';
  document.getElementById('rank').textContent = rank;
  document.getElementById('btnNext').style.display = (win && game.level < LEVELS.length - 1) ? '' : 'none';
  document.getElementById('ovOver').classList.remove('hidden');
  // 存档: 解锁下一关 + 记录最高分
  if (win) {
    unlockLevel(game.level + 1);
    recordBest(game.level, game.score);
  }
}

function hideAllOverlays() {
  ['ovTitle','ovLevel','ovPause','ovOver'].forEach(id => document.getElementById(id).classList.add('hidden'));
}

function togglePause() {
  if (game.state === 'playing') {
    game.state = 'pause';
    document.getElementById('ovPause').classList.remove('hidden');
  } else if (game.state === 'pause') {
    game.state = 'playing';
    document.getElementById('ovPause').classList.add('hidden');
  }
}

/* ==================== 音频 (Web Audio 合成) ==================== */
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function sfx(type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  if (type === 'shoot') {
    o.type = 'square'; o.frequency.setValueAtTime(880, now); o.frequency.exponentialRampToValueAtTime(440, now+0.08);
    g.gain.setValueAtTime(0.08, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.1);
    o.start(now); o.stop(now+0.1);
  } else if (type === 'explode') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now); o.frequency.exponentialRampToValueAtTime(40, now+0.3);
    g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.35);
    o.start(now); o.stop(now+0.35);
  } else if (type === 'hit') {
    o.type = 'square'; o.frequency.setValueAtTime(300, now); g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.06);
    o.start(now); o.stop(now+0.06);
  } else if (type === 'hurt') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(150, now); o.frequency.exponentialRampToValueAtTime(50, now+0.2);
    g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.25);
    o.start(now); o.stop(now+0.25);
  } else if (type === 'bossDie') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(400, now); o.frequency.exponentialRampToValueAtTime(30, now+0.8);
    g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.9);
    o.start(now); o.stop(now+0.9);
  } else if (type === 'laser') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(1200, now); o.frequency.exponentialRampToValueAtTime(600, now+0.1);
    g.gain.setValueAtTime(0.07, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.12);
    o.start(now); o.stop(now+0.12);
  } else if (type === 'shotgun') {
    o.type = 'square'; o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(60, now+0.15);
    g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    o.start(now); o.stop(now+0.18);
  } else if (type === 'rocket') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(100, now); o.frequency.exponentialRampToValueAtTime(300, now+0.15);
    g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.2);
    o.start(now); o.stop(now+0.2);
  } else if (type === 'powerup') {
    o.type = 'sine'; o.frequency.setValueAtTime(523, now); o.frequency.setValueAtTime(659, now+0.08); o.frequency.setValueAtTime(784, now+0.16);
    g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.3);
    o.start(now); o.stop(now+0.3);
  }
}

/* ==================== BGM (FM 合成循环) ==================== */
let bgmOn = false;
let bgmTimer = null;
let bgmStep = 0;
// C 小调: 主旋律 & 低音
const BGM_SCALE = [261.63, 293.66, 311.13, 349.23, 392.00, 415.30, 466.16, 523.25];
const BGM_BASS  = [65.41, 65.41, 98.00, 87.31, 73.42, 73.42, 98.00, 82.41];
const BGM_SEQ   = [0,2,4,2, 5,4,2,0, 4,5,7,5, 4,2,0,2]; // 音阶索引

function playNote(freq, time, dur, type, vol) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(time); o.stop(time + dur + 0.05);
}

function bgmTick() {
  if (!bgmOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  const stepDur = 0.18;
  const idx = bgmStep % BGM_SEQ.length;
  // 主旋律
  playNote(BGM_SCALE[BGM_SEQ[idx]], now, stepDur * 1.8, 'triangle', 0.06);
  // 低音 (每 2 步)
  if (bgmStep % 2 === 0) {
    playNote(BGM_BASS[(bgmStep/2) % BGM_BASS.length], now, stepDur * 3.5, 'sawtooth', 0.04);
  }
  // 和声 (每 4 步高八度)
  if (bgmStep % 4 === 2) {
    playNote(BGM_SCALE[BGM_SEQ[idx]] * 2, now, stepDur * 1.5, 'sine', 0.03);
  }
  bgmStep++;
  bgmTimer = setTimeout(bgmTick, stepDur * 1000);
}

function toggleBGM() {
  initAudio();
  bgmOn = !bgmOn;
  const btn = document.getElementById('bgmBtn');
  if (bgmOn) {
    btn.classList.remove('off');
    bgmStep = 0;
    bgmTick();
  } else {
    btn.classList.add('off');
    clearTimeout(bgmTimer);
  }
}

/* ==================== 主循环 ==================== */
let lastT = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  ctx.save();
  // 屏幕震动
  if (game.shake > 0) {
    game.shake -= dt;
    ctx.translate(rand(-6, 6), rand(-6, 6));
  }

  if (game.state === 'playing') {
    game.time += dt;
    update(dt);
  }
  render();
  ctx.restore();
  requestAnimationFrame(loop);
}

function update(dt) {
  // 玩家移动
  const sp = CFG.playerSpeed;
  if (input.left) player.x -= sp * dt;
  if (input.right) player.x += sp * dt;
  if (input.up) player.y -= sp * dt;
  if (input.down) player.y += sp * dt;
  player.x = clamp(player.x, 20, W - 20);
  player.y = clamp(player.y, H * 0.25, H - 40);
  // 倾斜动画
  player.tilt = (input.right ? 1 : 0) - (input.left ? 1 : 0);

  if (player.invuln > 0) player.invuln -= dt;
  player.fireCD -= dt;
  // 武器持续时间
  if (player.weaponTime > 0) {
    player.weaponTime -= dt;
    if (player.weaponTime <= 0) { player.weapon = 'normal'; player.weaponTime = 0; }
  }
  if (input.shoot) fireBullet();

  updateBullets(dt);
  updateMonsters(dt);
  updateWaves(dt);
  updateParticles(dt);
  updatePowerups(dt);
  checkCollisions();
  updateHUD();
}

function render() {
  if (game.state === 'title' || game.state === 'level') {
    // 标题背景
    ctx.fillStyle = '#050a18';
    ctx.fillRect(0, 0, W, H);
    for (const s of game.stars) { s.y += 20 * 0.016; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } ctx.globalAlpha = s.alpha; ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, s.size, s.size); }
    ctx.globalAlpha = 1;
    return;
  }
  if (game.state === 'pause' || game.state === 'over') {
    // 暂停/结算时保留最后一帧背景
    drawBackground(0.016);
    for (const m of game.monsters) drawMonster(m);
    if (game.boss) drawBoss(game.boss);
    drawPowerups();
    drawPlayer();
    drawBullets();
    drawParticles();
    return;
  }
  drawBackground(0.016);
  for (const m of game.monsters) drawMonster(m);
  if (game.boss) drawBoss(game.boss);
  drawPowerups();
  drawPlayer();
  drawBullets();
  drawParticles();
}

/* ==================== 关卡选择 UI ==================== */
function buildLevelGrid() {
  const grid = document.getElementById('lvGrid');
  grid.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const locked = i >= save.unlocked;
    const best = save.bestScores[i] || 0;
    const d = document.createElement('div');
    d.className = 'lv' + (locked ? ' locked' : '');
    d.innerHTML = `<div class="num">${locked ? '🔒' : i+1}</div><div class="nm">${lv.name}</div>${best > 0 ? `<div class="best">最高 ${best.toLocaleString()}</div>` : ''}`;
    if (!locked) {
      d.addEventListener('click', () => { hideAllOverlays(); startGame(i); });
    }
    grid.appendChild(d);
  });
}

/* ==================== 事件绑定 ==================== */
document.getElementById('btnStart').addEventListener('click', () => { initAudio(); hideAllOverlays(); startGame(0); });
document.getElementById('btnLevel').addEventListener('click', () => { hideAllOverlays(); buildLevelGrid(); document.getElementById('ovLevel').classList.remove('hidden'); });
document.getElementById('btnBack').addEventListener('click', () => { hideAllOverlays(); document.getElementById('ovTitle').classList.remove('hidden'); });
document.getElementById('btnResume').addEventListener('click', togglePause);
document.getElementById('btnQuit').addEventListener('click', () => { game.state = 'title'; hideAllOverlays(); document.getElementById('ovTitle').classList.remove('hidden'); });
document.getElementById('btnNext').addEventListener('click', () => startGame(game.level + 1));
document.getElementById('btnRetry').addEventListener('click', () => startGame(game.level));
document.getElementById('btnMenu').addEventListener('click', () => { game.state = 'title'; hideAllOverlays(); document.getElementById('ovTitle').classList.remove('hidden'); });
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('bgmBtn').addEventListener('click', toggleBGM);

buildLevelGrid();
initStars(0);
requestAnimationFrame(loop);
</script>
